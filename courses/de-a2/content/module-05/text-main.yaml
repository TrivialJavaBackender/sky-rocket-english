# Glossen stehen nur auf Wörtern, deren Form im Satz gleich der Grundform ist:
# ReadingText rendert `gloss.term` direkt in den Fließtext.
# Erzählt wird so, wie man im Alltag von früher erzählt: sein, haben und die
# Verben können, müssen, wollen, dürfen, sollen stehen im Präteritum (war,
# hatten, durften, konnte, wollte), alle anderen Verben im Perfekt (Modul 01).
# Beide Konjunktionen kommen vor: als für den einen Tag, wenn für die Ferien
# jedes Jahr. 29 von 30 Vokabeln des Moduls stehen im Text — nur der Enkel
# fehlt, er steht im Interview (text-extra.yaml).
kind: main
kicker: READING
title: Als ich ein Kind war
meta: ≈ 3 min · dotted words carry glosses — tap to reveal
body:
  - - t: "Meine Kindheit war laut und voll. Wir haben in einem kleinen Dorf gewohnt, weit von der Stadt. Damals hatten wir kein Auto, keinen Computer und drei Programme im Fernsehen. Aber wir hatten den Hof zwischen den Häusern, und das war genug. Von morgens bis abends sind dort zwanzig Kinder gelaufen."
  - - t: "Meine Eltern waren streng, aber wir hatten viel "
    - g: Freiheit
    - t: ". Wir durften bis acht Uhr draußen bleiben. Nur eins war verboten: Allein zum Fluss sollten wir nicht gehen. Einmal hat meine Mutter es doch erlaubt — mit meinem großen Bruder. Ich war damals sieben und sehr "
    - g: schüchtern
    - t: ", und das Wasser hat mir Angst gemacht."
  - - t: "An einen Tag erinnere ich mich besonders gut: an den ersten September. Als ich sechs war, bin ich in die Schule gekommen. Meine Oma hat mir eine große Tasche geschenkt. Die Schulzeit hat gut angefangen: Ich war neugierig und wollte alles wissen. Später hatte ich nicht immer gute Noten."
  - - t: "Wenn wir Ferien hatten, sind wir immer zu meiner Oma aufs Land gefahren. Dort habe ich jeden Sommer vier Wochen verbracht. Wir sind auf die Bäume geklettert, wir haben Steine und alte Münzen gesammelt, und am Abend hat Oma uns Märchen erzählt. Spielzeug hatten wir fast keins — wir haben alles selbst gebaut."
  - - t: "Einmal ist etwas passiert. Das vergesse ich nie. Als ich acht Jahre alt war, sind wir in eine andere Stadt gezogen. Am dritten Mai haben wir die Kartons in den Wagen getragen. "
    - g: Plötzlich
    - t: " war das Dorf weg, und ich war das neue Kind in einer fremden Klasse. Dieses Erlebnis war hart: In den ersten Wochen konnte ich nachts nicht schlafen."
  - - t: "Meine Jugend war dann in der Stadt: neue Freunde, neue Musik. Inzwischen bin ich erwachsen und habe einen vollen "
    - g: Alltag
    - t: ". In diesem Dorf bin ich aufgewachsen, und das Haus steht heute noch. Früher war dort ein Hof voller Kinder, heute ist es ruhig. Meine Erinnerungen an diese Zeit sind aber immer noch da."
glosses:
  - key: Freiheit
    term: Freiheit
    pos_label: noun
    definition: freedom — you choose for yourself, nobody tells you what to do
    example: Als Kind hatten wir viel Freiheit.
  - key: schüchtern
    term: schüchtern
    pos_label: adjective
    definition: shy — you do not like talking to strangers
    example: Ich war damals sehr schüchtern.
  - key: Plötzlich
    term: Plötzlich
    pos_label: adverb
    definition: suddenly, out of the blue — nobody expected it
    example: Plötzlich hat es geregnet.
  - key: Alltag
    term: Alltag
    pos_label: noun
    definition: everyday life — work, shopping, eating, sleeping
    example: Im Alltag bleibt wenig Zeit für Hobbys.
