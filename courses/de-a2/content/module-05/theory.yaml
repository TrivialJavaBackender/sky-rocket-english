# Modul 05 · Früher und heute — theory. Two spotlights, 9 items realising the
# six grammar points of the module card (courses/de-a2/PLAN.md §4).
#
# The simple past stays with sein, haben and the five modal verbs. Every other
# verb keeps the perfect (module 01) — that is exactly how German is spoken.
#
# Word order in the subordinate clause is not a seventh point but lives in the
# als/wenn tables: this is where the learner meets it for the first time.
#
# Scaffolding rule (§5, revised 2026-07): title, intro, form and note in English,
# every example and table in German. Paradigms and the als/wenn/wann split come
# from courses/_reference/basic-german/ units 22 and 27.
spotlights:
  - title: The simple past
    intro: >-
      German has two past tenses and uses them differently from English. For
      almost every verb, spoken German tells the story in the perfect — the
      tense you learned in module 01. But a small group of very frequent verbs
      sounds wrong in the perfect and takes the simple past instead: sein,
      haben and the five modals können, müssen, wollen, dürfen, sollen. Nobody
      says Ich habe ein Kind gewesen; everyone says Ich war ein Kind. These
      seven paradigms are the whole of the simple past you need at A2.
    items:
      - form: "The simple past of sein: war"
        example: Als ich ein Kind war, war ich sehr schüchtern.
        note: "Not ich bin gewesen but ich war. This is how you talk about the past."
        table:
          headers: ["", "Präsens", "Präteritum"]
          rows:
            - ["ich", "bin", "war"]
            - ["du", "bist", "warst"]
            - ["er / sie / es", "ist", "war"]
            - ["wir", "sind", "waren"]
            - ["ihr", "seid", "wart"]
            - ["sie / Sie", "sind", "waren"]
      - form: "The simple past of haben: hatte"
        example: Damals hatten wir kein Auto und keinen Fernseher.
        note: "The stem is hatt-. As everywhere in the simple past, the ich and er/sie/es forms are identical."
        table:
          headers: ["", "Präsens", "Präteritum"]
          rows:
            - ["ich", "habe", "hatte"]
            - ["du", "hast", "hattest"]
            - ["er / sie / es", "hat", "hatte"]
            - ["wir", "haben", "hatten"]
            - ["ihr", "habt", "hattet"]
            - ["sie / Sie", "haben", "hatten"]
      - form: "The simple past of können, müssen, wollen, dürfen, sollen"
        example: Mit acht Jahren durfte ich schon allein zur Schule gehen. Wir konnten nicht schwimmen.
        note: "The umlaut disappears — ö and ü become o and u — and the ending is -te."
        table:
          headers: ["Infinitiv", "ich / er, sie, es", "wir / sie"]
          rows:
            - ["können", "konnte", "konnten"]
            - ["müssen", "musste", "mussten"]
            - ["wollen", "wollte", "wollten"]
            - ["dürfen", "durfte", "durften"]
            - ["sollen", "sollte", "sollten"]
      - form: "Which past tense to use"
        example: "Ich war müde. Ich hatte keine Zeit. Ich habe lange geschlafen."
        note: Seven verbs take the simple past; everything else keeps the perfect. Mixing them in one text is normal, not a mistake.
        table:
          headers: ["Verb", "So sagt man", "Nicht"]
          rows:
            - ["sein", "Ich war krank.", "Ich bin krank gewesen."]
            - ["haben", "Wir hatten Ferien.", "Wir haben Ferien gehabt."]
            - ["können", "Ich konnte nicht kommen.", "Ich habe nicht kommen können."]
            - ["spielen", "Ich habe gespielt.", "Ich spielte."]
            - ["fahren", "Wir sind gefahren.", "Wir fuhren."]

  - title: als and wenn
    intro: >-
      English has one word, 'when', where German has three. als marks a single
      occasion in the past, wenn a repeated one, and wann is only ever a
      question. Both als and wenn open a subordinate clause, and that brings the
      rule that shapes the whole of German from here on: in a subordinate clause
      the finite verb goes right to the end. It is the first time you meet it —
      it comes back with weil, dass and obwohl in block C.
    items:
      - form: "als — one occasion in the past"
        example: Als ich acht Jahre alt war, sind wir in eine andere Stadt gezogen.
        note: One day, one year, one experience. The subordinate clause can come first or second.
        table:
          headers: ["Reihenfolge", "Beispiel"]
          rows:
            - ["Nebensatz zuerst", "Als ich sechs war, bin ich in die Schule gekommen."]
            - ["Hauptsatz zuerst", "Ich bin in die Schule gekommen, als ich sechs war."]
      - form: "wenn — a repeated occasion in the past"
        example: Immer wenn wir Ferien hatten, sind wir zu meiner Oma gefahren.
        note: "immer or jedes Mal often stands beside it. Here too the verb goes to the end."
        table:
          headers: ["Wie oft?", "Konjunktion", "Beispiel"]
          rows:
            - ["einmal", "als", "Als ich zehn war, habe ich ein Fahrrad bekommen."]
            - ["immer wieder", "wenn", "Wenn ich Geburtstag hatte, hat Oma einen Kuchen gebacken."]
            - ["immer wieder", "wenn", "Immer wenn es geregnet hat, haben wir im Hof gespielt."]
      - form: Time expressions for the past
        example: Mit acht Jahren konnte ich schon Rad fahren.
        note: They stand at the front or in the middle. At the front, the verb follows immediately.
        table:
          headers: ["Zeitangabe", "Beispiel"]
          rows:
            - ["damals", "Damals hatten wir kein Auto."]
            - ["früher", "Früher war hier ein Hof voller Kinder."]
            - ["mit acht Jahren", "Mit acht Jahren durfte ich allein zur Schule gehen."]
            - ["als Kind", "Als Kind war ich sehr schüchtern."]
            - ["am dritten Mai", "Am dritten Mai sind wir umgezogen."]
      - form: "als, wenn or wann?"
        example: "Als ich klein war … Wenn wir Ferien hatten … Wann bist du geboren?"
        note: English uses 'when' for all three. German splits them, and wann only ever appears in a question.
        table:
          headers: ["Wort", "Wofür", "Beispiel"]
          rows:
            - ["als", "einmal, Vergangenheit", "Als ich zehn war, …"]
            - ["wenn", "immer wieder, Vergangenheit", "Immer wenn es regnete, …"]
            - ["wenn", "Gegenwart und Zukunft", "Wenn ich Zeit habe, komme ich."]
            - ["wann", "nur in der Frage", "Wann bist du umgezogen?"]

watchouts:
  - title: "als or wenn?"
    bad: Immer als wir Ferien hatten, sind wir zu Oma gefahren.
    good: Immer wenn wir Ferien hatten, sind wir zu Oma gefahren.
    note: "One occasion in the past → als. A repeated one → wenn."
  - title: The verb goes to the end
    bad: Als ich war klein, hatte ich einen Hund.
    good: Als ich klein war, hatte ich einen Hund.
    note: "After als and wenn the finite verb stands right at the end of its clause."
  - title: wann only ever asks a question
    bad: Wann ich zehn war, habe ich ein Fahrrad bekommen.
    good: Als ich zehn war, habe ich ein Fahrrad bekommen.
    note: English says 'when' for all three. A statement about one past occasion takes als — wann belongs in a question.
  - title: war, not habe gewesen
    bad: Ich habe als Kind in einem Dorf gewesen.
    good: Ich war als Kind in einem Dorf.
    note: "sein and haben almost always take the simple past: war, hatte."

cloze_cards:
  - text: "Als ich ein Kind {{c1::war}}, haben wir in einem kleinen Dorf gewohnt."
    hint: sein
    rule: "sein in the simple past: ich war. After als the verb goes to the end."
  - text: "Damals {{c1::hatten}} wir kein Auto und keinen Fernseher."
    hint: haben
    rule: "haben in the simple past: wir hatten. damals marks the past."
  - text: "Mit sechs Jahren {{c1::konnte}} ich noch nicht lesen."
    hint: können
    rule: "können in the simple past: ich konnte. The ö becomes o."
  - text: "Meine Eltern waren streng. Ich {{c1::durfte}} abends nicht lange draußen bleiben."
    hint: dürfen
    rule: "dürfen in the simple past: ich durfte. The ü becomes u."
  - text: "{{c1::Als}} ich zehn war, habe ich mein erstes Fahrrad bekommen."
    hint: als oder wenn
    rule: "One experience, one occasion in the past → als."
  - text: "Immer {{c1::wenn}} wir Ferien hatten, sind wir zu meiner Oma gefahren."
    hint: als oder wenn
    rule: "A repeated occasion in the past → wenn, often with immer beside it."
  - text: "Meine Großmutter {{c1::war}} als Kind sehr arm."
    hint: sein
    rule: "sein in the simple past: sie war — never sie hat gewesen."
  - text: "Ich {{c1::musste}} als Kind jeden Samstag im Hof helfen."
    hint: müssen
    rule: "müssen in the simple past: ich musste. The ü becomes u and the ß becomes ss."
