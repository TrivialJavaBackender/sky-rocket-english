mode: writing
genre: a story about your own childhood
word_target: [50, 60]
prompt: |
  Everyone in your online language group is writing about their childhood
  this week. Write your post. 50–60 words, in German.

  Cover all four points:
  • where you grew up and what it was like there
  • what you were allowed to do as a child and what was forbidden
  • what you always did in the holidays
  • one experience from your childhood

  Use the simple past of sein and haben, one verb from können, müssen,
  wollen, dürfen, sollen, and als and wenn once each.
model_answer: |
  Ich bin in einem kleinen Dorf aufgewachsen. Wir hatten kein Auto und kein
  Spielzeug, aber wir hatten viel Freiheit. Meine Eltern waren streng:
  Abends durfte ich nicht lange draußen bleiben. Immer wenn wir Ferien
  hatten, sind wir zu meiner Oma gefahren. Als ich acht war, sind wir in die
  Stadt gezogen. Diesen Tag vergesse ich nie.
checklist:
  - 50–60 words
  - All four points are covered
  - sein and haben are in the simple past (war, waren, hatte, hatten)
  - One verb from können, müssen, wollen, dürfen, sollen is in the simple past
  - als marks a single occasion, wenn a repeated one
  - After als and wenn the verb stands right at the end
  - Every other verb is in the perfect with haben or sein
  - A past time expression appears (damals, früher, mit acht Jahren)
  - At least eight words from the module appear
