# Checkpoint A · 30 Aufgaben zu den Modulen 1–5 (Block A · Erzählen). Die Grenze
# von 75 % (23 von 30) steht in course.yaml, nicht hier.
#
# Anders als der Einstufungstest prüft dieser Test nur, was der Block wirklich
# unterrichtet hat: die 34 Grammatikpunkte von M01–M05 und die 150 Wörter aus
# ihren vocab.yaml. Nichts darüber hinaus.
#
# Aufbau: genau 6 Aufgaben pro Modul, die Formate quer gemischt.
# reading_comprehension fehlt: ein Checkpoint-Paket hat keinen reading_text,
# der Sync würde reading_text_id = null schreiben.
#
# Verteilung: 5 open_cloze · 5 grammar_drill · 5 collocation_match ·
#             4 mc_cloze · 4 word_formation · 4 error_correction ·
#             3 key_word_transformation = 30
#
# ZUORDNUNG: Aufgaben im Checkpoint können kein `grammar_point` tragen (die
# Spalte gehört zum Modul, syncCheckpoint übergibt eine leere Karte). Deshalb
# steht das Modul vorn in der Erklärung — „M02 · Die Präpositionen mit Dativ —
# …". So sagt die Auswertung, zu welchem Modul ein Fehler gehört.
#
# Die Stützregel (PLAN.md §1a) gilt auch hier. Verlangt wird nie:
# das Präteritum von anderen Verben als sein, haben und können, müssen, wollen,
# dürfen, sollen (alles andere steht im Perfekt); eine Adjektivendung; ein
# Nebensatz außer mit als und wenn; ein Dativ Plural mit -n (nur Singular, dazu
# die Formen uns, euch, ihnen). Der Block Auffrischung ist keine Quelle.
#
# Fachwörter: nur die 28 aus dem Grammatik-Wörterbuch der Diagnostik, dazu
# „das Perfekt" (M01) und „das Präteritum" (M05).
#
# review_pool ist leer: Ein Checkpoint wird einmal geschrieben und sät keine
# Wiederholungen.

core:
  # ══════════════ M01 · Mein Wochenende ══════════════
  - type: grammar_drill
    group: grammar
    content:
      pre: "Am Sonntag "
      post: " meine Tochter ganz allein Rad gefahren."
      prompt: HABEN ODER SEIN
      options: [hat, ist, sind, war]
      answer: 1
    explanation: "M01 · Das Perfekt mit sein — Rad fahren ist eine Bewegung von A nach B, deshalb steht das Perfekt mit sein: sie ist gefahren. Mit hat wäre der Satz falsch."
  - type: open_cloze
    group: grammar
    content:
      pre: "Am Samstag "
      post: " wir uns vor dem Kino getroffen und sind dann ins Konzert gegangen."
      answers: [haben]
      answer_shown: haben
    explanation: "M01 · Das Perfekt mit haben — sich treffen nimmt haben: wir haben uns getroffen. Nur bei gehen steht im zweiten Satz sein."
  - type: word_formation
    group: vocab
    content:
      pre: "Alle Gäste haben etwas zum Essen "
      post: "."
      prompt: mitbringen
      answers: [mitgebracht]
      answer_shown: mitgebracht
    explanation: "M01 · Das Partizip der trennbaren Verben — Bei trennbaren Verben steht ge- in der Mitte: mit-ge-bracht. bringen ist unregelmäßig, deshalb gebracht und nicht gebringt."
  - type: key_word_transformation
    group: grammar
    content:
      s1: Meine Freunde besuchen mich.
      key: AM SONNTAG
      pre: "Am Sonntag "
      post: " mich besucht."
      answers: [haben meine Freunde]
      hint: 3 Wörter
      answer_shown: haben meine Freunde
    explanation: "M01 · Die Stellung im Satz — Nach der Zeitangabe am Anfang steht haben auf Position 2, danach kommt das Subjekt: Am Sonntag haben meine Freunde mich besucht. Das Partizip bleibt am Ende."
  - type: error_correction
    group: grammar
    content:
      words: [Wir, haben, am, Samstag, ins, Konzert, "gegangen."]
      wrong: 1
      correction: "haben → sind"
    explanation: "M01 · Das Perfekt mit sein — gehen ist eine Bewegung von A nach B: Das Perfekt steht mit sein. Wir sind ins Konzert gegangen."
  - type: collocation_match
    group: vocab
    content:
      left: [Sport, Kaffee, Geburtstag, Freunde]
      right: [einladen, treiben, feiern, kochen]
      pairs: { 0: 1, 1: 3, 2: 2, 3: 0 }
    explanation: "M01 · Wortschatz: Freizeit und Wochenende — Diese Wörter stehen fest zusammen: Sport treiben, Kaffee kochen, Geburtstag feiern, Freunde einladen."

  # ══════════════ M02 · Unterwegs ══════════════
  - type: mc_cloze
    group: grammar
    content:
      pre: "Nach "
      post: " Konzert sind wir noch zu Fuß durch die Stadt gegangen."
      options: [den, die, dem, der]
      answer: 2
    explanation: "M02 · Die Präpositionen mit Dativ — Nach nach steht immer der Dativ. das Konzert → nach dem Konzert."
  - type: open_cloze
    group: grammar
    content:
      pre: "Nach dem Kurs bin ich noch kurz "
      post: " Post gegangen und habe ein Paket abgeholt."
      answers: [zur]
      answer_shown: zur
    explanation: "M02 · nach, zu oder in? — Vor einer Firma oder einem Gebäude steht zu + Dativ: zu der Post → zur Post. nach steht nur vor Städten und Ländern ohne Artikel."
  - type: grammar_drill
    group: grammar
    content:
      pre: "Für "
      post: " Weg zum Bahnhof brauchst du ungefähr zwanzig Minuten."
      prompt: FÜR + KASUS
      options: [dem, der, das, den]
      answer: 3
    explanation: "M02 · Die Präpositionen mit Akkusativ — Nach für steht immer der Akkusativ. der Weg → für den Weg. Nur der wird zu den."
  - type: word_formation
    group: vocab
    content:
      pre: "Ich habe die Regel nicht verstanden. Die "
      post: " von meinem Bruder war zu kurz."
      prompt: erklären
      answers: [Erklärung]
      answer_shown: Erklärung
    explanation: "M02 · Wortbildung mit -ung — Mit -ung wird aus dem Verb ein Nomen, und der Artikel ist immer die: erklären → die Erklärung, verspäten → die Verspätung."
  - type: error_correction
    group: grammar
    content:
      words: [Wir, sind, gestern, mit, die, Straßenbahn, ins, Zentrum, "gefahren."]
      wrong: 4
      correction: "die → der"
    explanation: "M02 · Die Präpositionen mit Dativ — mit nimmt immer den Dativ. die Straßenbahn → mit der Straßenbahn."
  - type: collocation_match
    group: vocab
    content:
      left: [dauern, verpassen, abbiegen, erreichen]
      right: [nach rechts oder nach links fahren, den Zug noch schaffen, so viel Zeit brauchen, zu spät kommen und nicht mitfahren]
      pairs: { 0: 2, 1: 3, 2: 0, 3: 1 }
    explanation: "M02 · Wortschatz: Verkehr und Weg — Die Fahrt dauert zwei Stunden. Ich habe den Zug verpasst. An der Ampel biegen wir rechts ab. So erreichen wir den Anschluss noch."

  # ══════════════ M03 · Wohnen und Einrichten ══════════════
  - type: mc_cloze
    group: grammar
    content:
      pre: "Ich habe mein Fahrrad hinter "
      post: " Haus gestellt."
      options: [das, dem, der, den]
      answer: 0
    explanation: "M03 · Wohin? mit dem Akkusativ — stellen fragt Wohin? — also der Akkusativ. das Haus bleibt das: hinter das Haus. Bei Wo? hieße es: Das Fahrrad steht hinter dem Haus."
  - type: open_cloze
    group: grammar
    content:
      pre: "Das Spielzeug von meinem Enkel liegt schon wieder auf "
      post: " Boden."
      answers: [dem]
      answer_shown: dem
    explanation: "M03 · Wo? mit dem Dativ — liegen fragt Wo? — also der Dativ. der Boden → auf dem Boden. Nach legen (Wohin?) hieße es auf den Boden."
  - type: grammar_drill
    group: grammar
    content:
      pre: "Meine Jacke hängt "
      post: " Schrank, nicht an der Tür."
      prompt: "WO?"
      options: [in den, ins, im, in die]
      answer: 2
    explanation: "M03 · Die kurzen Formen im, ins, am, ans — hängen ohne Objekt fragt Wo? — also der Dativ: in dem Schrank → im Schrank. Für Wohin? stünde hier ins."
  - type: key_word_transformation
    group: grammar
    content:
      s1: Häng die Lampe bitte über den Tisch!
      key: HÄNGT
      pre: "Die Lampe "
      post: " Tisch."
      answers: [hängt über dem]
      hint: 3 Wörter
      answer_shown: hängt über dem
    explanation: "M03 · stehen, liegen und hängen — Ohne Objekt fragt hängen Wo? — also der Dativ: über dem Tisch. hängen steht in beiden Spalten, nur der Kasus zeigt den Unterschied."
  - type: error_correction
    group: grammar
    content:
      words: [Ich, habe, die, Schuhe, unter, dem, Bett, "gestellt."]
      wrong: 5
      correction: "dem → das"
    explanation: "M03 · Wohin? mit dem Akkusativ — Die Schuhe bewegen sich: stellen fragt Wohin? — also der Akkusativ. Nur bei stehen (Wo?) hieße es unter dem Bett."
  - type: collocation_match
    group: vocab
    content:
      left: [fahren + die Karte, die Woche + das Ende, die Schule + die Zeit, die Straße + die Bahn]
      right: [die Schulzeit, die Fahrkarte, die Straßenbahn, das Wochenende]
      pairs: { 0: 1, 1: 3, 2: 0, 3: 2 }
    explanation: "M03 · Wortbildung: zwei Wörter werden ein Wort — Das zweite Wort gibt den Artikel: die Karte → die Fahrkarte, das Ende → das Wochenende."

  # ══════════════ M04 · Geschenke und Gefälligkeiten ══════════════
  - type: mc_cloze
    group: grammar
    content:
      pre: "Liebe Frau Berger, ich danke "
      post: " herzlich für die Blumen."
      options: [Sie, Ihr, ihn, Ihnen]
      answer: 3
    explanation: "M04 · Die Personalpronomen im Dativ — danken fragt Wem? — also der Dativ. Sie → Ihnen: Ich danke Ihnen für die Blumen. Nicht: Ich danke Sie."
  - type: open_cloze
    group: grammar
    content:
      pre: "Wem gehört die Jacke am Fenster? — Sie gehört "
      post: ", ich habe sie heute Morgen vergessen."
      answers: [mir]
      answer_shown: mir
    explanation: "M04 · Die Verben helfen, danken, gehören und gratulieren — gehören fragt Wem? — also der Dativ. ich → mir: Die Jacke gehört mir."
  - type: grammar_drill
    group: grammar
    content:
      pre: "Mein Bruder versteht den Fahrplan nicht. "
      post: ""
      prompt: REIHENFOLGE
      options: ["Ich erkläre ihm die Strecke.", "Ich erkläre die Strecke ihm.", "Ich erkläre ihn die Strecke.", "Ich erkläre ihm der Strecke."]
      answer: 0
    explanation: "M04 · Zuerst der Dativ, dann der Akkusativ — Erst die Person (Wem? ihm), dann die Sache (Was? die Strecke). er → ihm, nicht ihn."
  - type: word_formation
    group: vocab
    content:
      pre: "Die Straßenbahn hält an der Kreuzung. Die "
      post: " macht die Türen auf."
      prompt: fahren
      answers: [Fahrerin]
      answer_shown: Fahrerin
    explanation: "M04 · Wortbildung mit -er und -in — Aus dem Verb wird die Person: fahren → der Fahrer, die Fahrerin. Der Artikel die zeigt hier die Form mit -in."
  - type: key_word_transformation
    group: grammar
    content:
      s1: Ich habe meinem Bruder und meiner Schwester Karten für das Konzert besorgt.
      key: IHNEN
      pre: "Ich habe "
      post: " Karten für das Konzert besorgt."
      answers: [ihnen]
      hint: 1 Wort
      answer_shown: ihnen
    explanation: "M04 · Die Personalpronomen im Dativ — Zwei Personen zusammen sind sie, im Dativ ihnen: Ich habe ihnen Karten besorgt. Die Person steht vor der Sache."
  - type: collocation_match
    group: vocab
    content:
      left: [versprechen, wünschen, einpacken, abholen]
      right: [Papier um das Geschenk machen, "sagen: Ich mache das sicher", jemanden am Bahnhof treffen und mitnehmen, alles Gute sagen]
      pairs: { 0: 1, 1: 3, 2: 0, 3: 2 }
    explanation: "M04 · Wortschatz: Geschenke und Hilfe — Ich verspreche dir das. Wir wünschen dir alles Gute. Ich packe das Geschenk ein. Ich hole dich am Bahnhof ab."

  # ══════════════ M05 · Früher und heute ══════════════
  - type: mc_cloze
    group: grammar
    content:
      pre: "Meine Eltern hatten wenig Geld. Wir "
      post: " als Kinder nie ins Kino gehen."
      options: [dürfen, durften, gedurft, durfte]
      answer: 1
    explanation: "M05 · Das Präteritum von können, müssen, wollen, dürfen und sollen — dürfen im Präteritum: wir durften. Aus ü wird u, bei wir steht die Endung -en."
  - type: open_cloze
    group: grammar
    content:
      pre: "Früher "
      post: " mein Großvater Lehrer in einem Dorf bei Dresden."
      answers: [war]
      answer_shown: war
    explanation: "M05 · Das Präteritum von sein — Von früher erzählt man mit war, nicht mit ist gewesen. Nach der Zeitangabe am Anfang steht das Verb auf Position 2."
  - type: grammar_drill
    group: grammar
    content:
      pre: "Immer "
      post: " ich bei meiner Oma war, hat sie mir ein Märchen erzählt."
      prompt: ALS ODER WENN
      options: [als, damals, dann, wenn]
      answer: 3
    explanation: "M05 · wenn — immer wieder in der Vergangenheit — Nach immer steht wenn: Der Besuch war jedes Mal wieder so. Für einmal in der Vergangenheit steht als."
  - type: word_formation
    group: vocab
    content:
      pre: "Der "
      post: " Dezember ist bei uns ein Feiertag."
      prompt: sechs
      answers: [sechste]
      answer_shown: sechste
    explanation: "M05 · Die Zahlen im Datum — Bis neunzehn kommt -te an die Zahl: sechs → der sechste, vier → der vierte. Ab zwanzig steht -ste."
  - type: error_correction
    group: grammar
    content:
      words: [Meine, Schwester, hatte, damals, zehn, "Jahre."]
      wrong: 2
      correction: "hatte zehn Jahre → war zehn Jahre alt"
    explanation: "M05 · Das Präteritum von sein — Das Alter steht mit sein und alt: Meine Schwester war damals zehn Jahre alt. Mit haben ist der Satz falsch."
  - type: collocation_match
    group: vocab
    content:
      left: [die Jugend, das Dorf, die Note, die Freiheit]
      right: [ein kleiner Ort auf dem Land, man darf selbst entscheiden, die Zeit nach der Kindheit, sie bekommt man in der Schule]
      pairs: { 0: 2, 1: 0, 2: 3, 3: 1 }
    explanation: "M05 · Wortschatz: Kindheit und Jugend — Die Jugend kommt nach der Kindheit. Im Dorf wohnen wenige Menschen. Noten bekommt man in der Schule, und Freiheit heißt: Man darf selbst entscheiden."

review_pool: []
