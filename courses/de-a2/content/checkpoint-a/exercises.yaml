# Checkpoint A · 30 Aufgaben zu den Modulen 1–5 (Block A · Erzählen). Die Grenze
# von 75 % (23 von 30) steht in course.yaml, nicht hier.
#
# Anders als der Einstufungstest prüft dieser Test nur, was der Block wirklich
# unterrichtet hat: die 34 Grammatikpunkte von M01–M05 und die 150 Wörter aus
# ihren vocab.yaml. Nichts darüber hinaus.
#
# Aufbau: genau 6 Aufgaben pro Modul, die Formate quer gemischt.
# reading_comprehension fehlt: ein Checkpoint-Paket hat keinen reading_text,
# der Sync würde reading_text_id = null schreiben.
#
# Verteilung: 5 open_cloze · 5 grammar_drill · 5 collocation_match ·
#             4 mc_cloze · 4 word_formation · 4 error_correction ·
#             3 key_word_transformation = 30
#
# ZUORDNUNG: Aufgaben im Checkpoint können kein `grammar_point` tragen (die
# Spalte gehört zum Modul, syncCheckpoint übergibt eine leere Karte). Deshalb
# steht das Modul vorn in der Erklärung — „M02 · Die Präpositionen mit Dativ —
# …". So sagt die Auswertung, zu welchem Modul ein Fehler gehört.
#
# Die Stützregel (PLAN.md §1a) gilt auch hier. Verlangt wird nie:
# das Präteritum von anderen Verben als sein, haben und können, müssen, wollen,
# dürfen, sollen (alles andere steht im Perfekt); eine Adjektivendung; ein
# Nebensatz außer mit als und wenn; ein Dativ Plural mit -n (nur Singular, dazu
# die Formen uns, euch, ihnen). Der Block Auffrischung ist keine Quelle.
#
# Fachwörter: nur die 28 aus dem Grammatik-Wörterbuch der Diagnostik, dazu
# „das Perfekt" (M01) und „das Präteritum" (M05).
#
# review_pool ist leer: Ein Checkpoint wird einmal geschrieben und sät keine
# Wiederholungen.

core:
  # ══════════════ M01 · Mein Wochenende ══════════════
  - type: grammar_drill
    group: grammar
    content:
      pre: "Am Sonntag "
      post: " meine Tochter ganz allein Rad gefahren."
      prompt: HABEN ODER SEIN
      options: [hat, ist, sind, war]
      answer: 1
    explanation: "M01 · The perfect with sein — Rad fahren is movement from A to B, so the perfect takes sein: sie ist gefahren. hat would be wrong here."
  - type: open_cloze
    group: grammar
    content:
      pre: "Am Samstag "
      post: " wir uns vor dem Kino getroffen und sind dann ins Konzert gegangen."
      answers: [haben]
      answer_shown: haben
    explanation: "M01 · The perfect with haben — sich treffen takes haben: wir haben uns getroffen. Only gehen in the second clause takes sein."
  - type: word_formation
    group: vocab
    content:
      pre: "Alle Gäste haben etwas zum Essen "
      post: "."
      prompt: mitbringen
      answers: [mitgebracht]
      answer_shown: mitgebracht
    explanation: "M01 · The participle of separable verbs — a separable verb carries ge- in the middle: mit-ge-bracht. bringen is irregular, hence gebracht and not gebringt."
  - type: key_word_transformation
    group: grammar
    content:
      s1: Meine Freunde besuchen mich.
      key: Perfekt after a front time phrase
      pre: "Am Sonntag "
      post: " mich besucht."
      answers: [haben meine Freunde]
      hint: 3 Wörter
      answer_shown: haben meine Freunde
    explanation: "M01 · Word order — after a time expression at the front, haben takes position 2 and the subject follows: Am Sonntag haben meine Freunde mich besucht. The participle stays at the end."
  - type: error_correction
    group: grammar
    content:
      words: [Wir, haben, am, Samstag, ins, Konzert, "gegangen."]
      wrong: 1
      correction: "haben → sind"
    explanation: "M01 · The perfect with sein — gehen is movement from A to B, so the perfect takes sein: Wir sind ins Konzert gegangen."
  - type: collocation_match
    group: vocab
    content:
      left: [Sport, Kaffee, Geburtstag, Freunde]
      right: [einladen, treiben, feiern, kochen]
      pairs: { 0: 1, 1: 3, 2: 2, 3: 0 }
    explanation: "M01 · Vocabulary: free time and the weekend — these words go together: Sport treiben, Kaffee kochen, Geburtstag feiern, Freunde einladen."

  # ══════════════ M02 · Unterwegs ══════════════
  - type: mc_cloze
    group: grammar
    content:
      pre: "Nach "
      post: " Konzert sind wir noch zu Fuß durch die Stadt gegangen."
      options: [den, die, dem, der]
      answer: 2
    explanation: "M02 · Prepositions with the dative — nach always takes the dative. das Konzert → nach dem Konzert."
  - type: open_cloze
    group: grammar
    content:
      pre: "Nach dem Kurs bin ich noch kurz "
      post: " Post gegangen und habe ein Paket abgeholt."
      answers: [zur]
      answer_shown: zur
    explanation: "M02 · nach, zu or in? — a company or a building takes zu + dative: zu der Post → zur Post. nach is only for towns and countries with no article."
  - type: grammar_drill
    group: grammar
    content:
      pre: "Für "
      post: " Weg zum Bahnhof brauchst du ungefähr zwanzig Minuten."
      prompt: FÜR + KASUS
      options: [dem, der, das, den]
      answer: 3
    explanation: "M02 · Prepositions with the accusative — für always takes the accusative. der Weg → für den Weg. Only der becomes den."
  - type: word_formation
    group: vocab
    content:
      pre: "Ich habe die Regel nicht verstanden. Die "
      post: " von meinem Bruder war zu kurz."
      prompt: erklären
      answers: [Erklärung]
      answer_shown: Erklärung
    explanation: "M02 · Word formation with -ung — -ung turns a verb into a noun, and the article is always die: erklären → die Erklärung, verspäten → die Verspätung."
  - type: error_correction
    group: grammar
    content:
      words: [Wir, sind, gestern, mit, die, Straßenbahn, ins, Zentrum, "gefahren."]
      wrong: 4
      correction: "die → der"
    explanation: "M02 · Prepositions with the dative — mit always takes the dative. die Straßenbahn → mit der Straßenbahn."
  - type: collocation_match
    group: vocab
    content:
      left: [dauern, verpassen, abbiegen, erreichen]
      right: [nach rechts oder nach links fahren, den Zug noch schaffen, so viel Zeit brauchen, zu spät kommen und nicht mitfahren]
      pairs: { 0: 2, 1: 3, 2: 0, 3: 1 }
    explanation: "M02 · Vocabulary: traffic and routes — Die Fahrt dauert zwei Stunden. Ich habe den Zug verpasst. An der Ampel biegen wir rechts ab. So erreichen wir den Anschluss noch."

  # ══════════════ M03 · Wohnen und Einrichten ══════════════
  - type: mc_cloze
    group: grammar
    content:
      pre: "Ich habe mein Fahrrad hinter "
      post: " Haus gestellt."
      options: [das, dem, der, den]
      answer: 0
    explanation: "M03 · Wohin? with the accusative — stellen asks Wohin?, so the case is accusative. das Haus stays das: hinter das Haus. With Wo? it would be Das Fahrrad steht hinter dem Haus."
  - type: open_cloze
    group: grammar
    content:
      pre: "Das Spielzeug von meinem Enkel liegt schon wieder auf "
      post: " Boden."
      answers: [dem]
      answer_shown: dem
    explanation: "M03 · Wo? with the dative — liegen asks Wo?, so the case is dative. der Boden → auf dem Boden. After legen (Wohin?) it would be auf den Boden."
  - type: grammar_drill
    group: grammar
    content:
      pre: "Meine Jacke hängt "
      post: " Schrank, nicht an der Tür."
      prompt: "WO?"
      options: [in den, ins, im, in die]
      answer: 2
    explanation: "M03 · The contracted forms im, ins, am, ans — hängen without an object asks Wo?, so the case is dative: in dem Schrank → im Schrank. For Wohin? it would be ins."
  - type: key_word_transformation
    group: grammar
    content:
      s1: Häng die Lampe bitte über den Tisch!
      key: HÄNGT
      pre: "Die Lampe "
      post: " Tisch."
      answers: [hängt über dem]
      hint: 3 Wörter
      answer_shown: hängt über dem
    explanation: "M03 · stehen, liegen and hängen — with no object hängen asks Wo?, so the case is dative: über dem Tisch. hängen sits in both columns and only the case tells them apart."
  - type: error_correction
    group: grammar
    content:
      words: [Ich, habe, die, Schuhe, unter, dem, Bett, "gestellt."]
      wrong: 5
      correction: "dem → das"
    explanation: "M03 · Wohin? with the accusative — the shoes are moving, so stellen asks Wohin? and the case is accusative. Only stehen (Wo?) would give unter dem Bett."
  - type: collocation_match
    group: vocab
    content:
      left: [fahren + die Karte, die Woche + das Ende, die Schule + die Zeit, die Straße + die Bahn]
      right: [die Schulzeit, die Fahrkarte, die Straßenbahn, das Wochenende]
      pairs: { 0: 1, 1: 3, 2: 0, 3: 2 }
    explanation: "M03 · Word formation: two words become one — the second word sets the article: die Karte → die Fahrkarte, das Ende → das Wochenende."

  # ══════════════ M04 · Geschenke und Gefälligkeiten ══════════════
  - type: mc_cloze
    group: grammar
    content:
      pre: "Liebe Frau Berger, ich danke "
      post: " herzlich für die Blumen."
      options: [Sie, Ihr, ihn, Ihnen]
      answer: 3
    explanation: "M04 · Personal pronouns in the dative — danken asks Wem?, so the case is dative. Sie → Ihnen: Ich danke Ihnen für die Blumen, never Ich danke Sie."
  - type: open_cloze
    group: grammar
    content:
      pre: "Wem gehört die Jacke am Fenster? — Sie gehört "
      post: ", ich habe sie heute Morgen vergessen."
      answers: [mir]
      answer_shown: mir
    explanation: "M04 · The verbs helfen, danken, gehören and gratulieren — gehören asks Wem?, so the case is dative. ich → mir: Die Jacke gehört mir."
  - type: grammar_drill
    group: grammar
    content:
      pre: "Mein Bruder versteht den Fahrplan nicht. "
      post: ""
      prompt: REIHENFOLGE
      options: ["Ich erkläre ihm die Strecke.", "Ich erkläre die Strecke ihm.", "Ich erkläre ihn die Strecke.", "Ich erkläre ihm der Strecke."]
      answer: 0
    explanation: "M04 · Dative before accusative — the person first (Wem? ihm), then the thing (Was? die Strecke). er → ihm, not ihn."
  - type: word_formation
    group: vocab
    content:
      pre: "Die Straßenbahn hält an der Kreuzung. Die "
      post: " macht die Türen auf."
      prompt: fahren
      answers: [Fahrerin]
      answer_shown: Fahrerin
    explanation: "M04 · Word formation with -er and -in — the verb becomes the person: fahren → der Fahrer, die Fahrerin. The article die points to the -in form here."
  - type: key_word_transformation
    group: grammar
    content:
      s1: Ich habe meinem Bruder und meiner Schwester Karten für das Konzert besorgt.
      key: dative pronoun
      pre: "Ich habe "
      post: " Karten für das Konzert besorgt."
      answers: [ihnen]
      hint: 1 Wort
      answer_shown: ihnen
    explanation: "M04 · Personal pronouns in the dative — two people together are sie, and in the dative ihnen: Ich habe ihnen Karten besorgt. The person comes before the thing."
  - type: collocation_match
    group: vocab
    content:
      left: [versprechen, wünschen, einpacken, abholen]
      right: [Papier um das Geschenk machen, "sagen: Ich mache das sicher", jemanden am Bahnhof treffen und mitnehmen, alles Gute sagen]
      pairs: { 0: 1, 1: 3, 2: 0, 3: 2 }
    explanation: "M04 · Vocabulary: presents and help — Ich verspreche dir das. Wir wünschen dir alles Gute. Ich packe das Geschenk ein. Ich hole dich am Bahnhof ab."

  # ══════════════ M05 · Früher und heute ══════════════
  - type: mc_cloze
    group: grammar
    content:
      pre: "Meine Eltern hatten wenig Geld. Wir "
      post: " als Kinder nie ins Kino gehen."
      options: [dürfen, durften, gedurft, durfte]
      answer: 1
    explanation: "M05 · The simple past of können, müssen, wollen, dürfen and sollen — dürfen in the simple past: wir durften. The ü becomes u and wir takes -en."
  - type: open_cloze
    group: grammar
    content:
      pre: "Früher "
      post: " mein Großvater Lehrer in einem Dorf bei Dresden."
      answers: [war]
      answer_shown: war
    explanation: "M05 · The simple past of sein — you talk about the past with war, not with ist gewesen. After a time expression at the front the verb takes position 2."
  - type: grammar_drill
    group: grammar
    content:
      pre: "Immer "
      post: " ich bei meiner Oma war, hat sie mir ein Märchen erzählt."
      prompt: ALS ODER WENN
      options: [als, damals, dann, wenn]
      answer: 3
    explanation: "M05 · wenn — a repeated occasion in the past — immer calls for wenn: the visit was like that every time. A single occasion takes als."
  - type: word_formation
    group: vocab
    content:
      pre: "Der "
      post: " Dezember ist bei uns ein Feiertag."
      prompt: sechs
      answers: [sechste]
      answer_shown: sechste
    explanation: "M05 · Numbers in a date — up to nineteen the number takes -te: sechs → der sechste, vier → der vierte. From twenty it is -ste."
  - type: error_correction
    group: grammar
    content:
      words: [Meine, Schwester, hatte, damals, zehn, "Jahre."]
      wrong: 2
      correction: "hatte zehn Jahre → war zehn Jahre alt"
    explanation: "M05 · The simple past of sein — age goes with sein and alt: Meine Schwester war damals zehn Jahre alt. With haben the sentence is wrong."
  - type: collocation_match
    group: vocab
    content:
      left: [die Jugend, das Dorf, die Note, die Freiheit]
      right: [ein kleiner Ort auf dem Land, man darf selbst entscheiden, die Zeit nach der Kindheit, sie bekommt man in der Schule]
      pairs: { 0: 2, 1: 0, 2: 3, 3: 1 }
    explanation: "M05 · Vocabulary: childhood and youth — die Jugend follows die Kindheit. Few people live im Dorf. You get Noten at school, and Freiheit means you decide for yourself."

review_pool: []
