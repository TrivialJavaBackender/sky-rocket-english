# Checkpoint A · writing task and marking. The scenario is chosen so that the
# grammar of all five modules becomes necessary by itself: the move at the
# weekend (M01 · perfect), the way to the new flat (M02 · prepositions with a
# fixed case), the furniture in the room (M03 · wo and wohin), the person who
# helped (M04 · dative object) and the old flat back then (M05 · war, hatte,
# musste and als/wenn).
#
# 60–80 words is more than the profile allows (PLAN.md §6: 50–60), deliberately:
# the task has to show the grammar of five modules at once, and that does not
# fit into 60 words.
mode: writing
genre: an email about moving house
word_target: [60, 80]
prompt: |
  Write this text straight after the 30 tasks, in the same sitting.
  20 minutes, no dictionary.

  ## The task

  You moved house last month. A friend from your German course lives in
  another town. Write them an email about your new flat, in German.
  60–80 words.

  Cover all five points:
  • what you did at the weekend — the move
  • who helped you and what you gave that person
  • where the furniture now stands, lies or hangs in the room
  • what the old flat used to be like
  • how to get to you from the station

  Use the perfect with haben and sein, a preposition that takes the dative,
  the dative after helfen, danken or schenken, the simple past of sein and
  haben, and als or wenn once.

  ## After the test

  • 23 out of 30 is 75 per cent — that is the pass mark.
  • Sort every mistake by module. The explanation starts with M01, M02, M03,
    M04 or M05.
  • One mistake here and one there is normal. Three mistakes in the same
    module is a gap: reread that module's rules and redo its tasks.
  • Fewer than 23 right? Then take a week of revision before block B.
model_answer: |
  Liebe Sara,

  endlich sind wir umgezogen! Am Samstag haben wir alles in die Wohnung
  getragen. Mein Bruder hat mir geholfen, und ich habe ihm einen Gutschein
  geschenkt. Das Regal steht neben dem Fenster, und die Lampe hängt über dem
  Tisch. Früher war mein Zimmer dunkel: Wir hatten kein Regal, und ich musste
  alles auf den Boden legen. Als wir am Abend fertig waren, haben wir
  zusammen gefeiert. Vom Bahnhof fährst du mit der Straßenbahn bis zur Ampel.

  Liebe Grüße
  Ella
checklist:
  - 60–80 words
  - All five points are covered
  - It opens with Liebe … / Lieber … and closes with a greeting
  - The weekend sentences are in the perfect, with the participle at the end
  - haben or sein is chosen correctly (movement → sein)
  - mit, bei, nach, von, zu, aus and seit are followed by the dative
  - stehen, liegen and hängen take the dative (Wo?), stellen, legen and hängen the accusative (Wohin?)
  - helfen, danken and schenken put the person in the dative
  - sein and haben are in the simple past (war, waren, hatte, hatten)
  - als or wenn appears once, with the verb at the end
  - At least ten words from modules 1–5 appear
