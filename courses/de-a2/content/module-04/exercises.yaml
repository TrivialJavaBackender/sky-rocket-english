  - type: open_cloze
    group: grammar
    content:
      pre: "Tom und Anna heiraten morgen. Wir wünschen "
      post: " alles Gute."
      answers: [ihnen]
      answer_shown: ihnen
    explanation: "wünschen asks Wem? and Was? Two people: sie → ihnen."
  - type: open_cloze
    group: grammar
    content:
      pre: "Zum Geburtstag schenke ich "
      post: " Kollegin einen Gutschein."
      answers: [meiner, der, deiner, ihrer, unserer, seiner, einer]
      answer_shown: meiner
    explanation: "schenken asks Wem? first — dative. die Kollegin → meiner Kollegin."
  - type: open_cloze
    group: grammar
    content:
      pre: "Liebe Oma, wir danken "
      post: " für das schöne Fest."
      answers: [dir]
      answer_shown: dir
    explanation: "danken asks Wem? — dative. One person addressed with du → dir."
  - type: open_cloze
    group: grammar
    content:
      pre: "Jonas und ich haben das Geschenk eingepackt. Der Verkäufer hat "
      post: " das Papier geschenkt."
      answers: [uns]
      answer_shown: uns
