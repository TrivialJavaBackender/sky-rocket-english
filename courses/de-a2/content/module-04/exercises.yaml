      answers: [mir]
      answer_shown: mir
    explanation: "erklären fragt Wem? + Was? ich → mir, danach den Weg."
  - type: open_cloze
    group: grammar
    content:
      pre: "Tom und Anna heiraten morgen. Wir wünschen "
