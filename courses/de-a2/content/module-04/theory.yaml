# Modul 04 · Geschenke und Gefälligkeiten — theory. Two spotlights, 9 items
# realising the seven grammar points of the module card (courses/de-a2/PLAN.md §4).
#
# The dative forms come from module 02, where they follow a preposition. Here the
# same case stands straight after the verb, so the table is not re-explained —
# only shown without a preposition in front of it.
#
# The plural stays out: the -n of the dative plural belongs to a later module, so
# every noun table shows the singular only. The pronouns uns, euch and ihnen are
# included — they are forms in their own right, not an ending on a noun.
#
# Scaffolding rule (§5, revised 2026-07): title, intro, form and note in English,
# every example and table in German. Dative verbs and pronouns come from
# courses/_reference/basic-german/ units 13 and 15.
spotlights:
  - title: The dative as an object
    intro: >-
      So far the dative has always followed a preposition — mit dem Bus, bei der
      Post. Here it turns up with no preposition at all, straight after the verb.
      Two things cause it. A small group of verbs simply demands the dative
      instead of the accusative (helfen, danken, gehören, gratulieren), and a
      larger group takes two objects at once, in which case the person goes in
      the dative and the thing in the accusative. The question to ask is Wem?
      — to whom. Ask it before you choose the article and the case follows.
    items:
      - form: "Wem? — the dative with no preposition"
        example: Ich helfe dem Bruder. — Wem helfe ich? Dem Bruder.
        note: The forms are the ones you know from module 02. What is new is that nothing stands in front of them.
        table:
          headers: ["Nominativ", "Dativ — Wem?"]
          rows:
            - ["der Bruder", "dem Bruder"]
            - ["die Kollegin", "der Kollegin"]
            - ["das Kind", "dem Kind"]
      - form: "Four verbs that take the dative"
        example: "Ich helfe meiner Kollegin. Das Fahrrad gehört der Nachbarin."
        note: These four never take the accusative. There is no rule behind it — learn the list by heart.
        table:
          headers: ["Verb", "Beispiel"]
          rows:
            - ["helfen", "Ich helfe meiner Kollegin."]
            - ["danken", "Wir danken dem Verkäufer."]
            - ["gehören", "Das Fahrrad gehört der Nachbarin."]
            - ["gratulieren", "Ich gratuliere dem Kind zum Geburtstag."]
      - form: Verbs with two objects
        example: Ich schenke meiner Oma ein Fotobuch.
        note: "One verb, two questions: Wem? and Was? The person takes the dative, the thing the accusative."
        table:
          headers: ["Verb", "Wem? — Dativ", "Was? — Akkusativ"]
          rows:
            - ["geben", "dem Kind", "das Buch"]
            - ["schenken", "der Oma", "ein Fotobuch"]
            - ["zeigen", "dem Freund", "die Fotos"]
            - ["erklären", "der Kollegin", "den Weg"]
      - form: Dative before accusative
        example: Ich schenke meinem Bruder ein Buch.
        note: The person comes first, the thing second. This is the normal order and you can rely on it.
        table:
          headers: ["Wer?", "Verb", "Wem? — Dativ", "Was? — Akkusativ"]
          rows:
            - ["Ich", "schenke", "meinem Bruder", "ein Buch."]
            - ["Er", "zeigt", "uns", "die Fotos."]
            - ["Wir", "besorgen", "der Oma", "einen Kuchen."]
      - form: "Which case does the verb want?"
        example: "Ich sehe meinen Bruder. Ich helfe meinem Bruder. Ich schenke meinem Bruder ein Buch."
        note: The verb decides. Most verbs take the accusative, a short list takes the dative, and a middle group takes both.
        table:
          headers: ["Verb", "Objekt", "Beispiel"]
          rows:
            - ["sehen, nehmen, kaufen", "nur Akkusativ", "Ich kaufe das Geschenk."]
            - ["helfen, danken, gehören", "nur Dativ", "Ich danke der Kollegin."]
            - ["geben, schenken, zeigen", "Dativ + Akkusativ", "Ich zeige dem Kind das Buch."]

  - title: "mir, dir, ihm — the dative for people"
    intro: >-
      Once a person has been named you stop repeating the name and switch to a
      pronoun, so the dative pronouns are the forms you will actually use most.
      There are eight of them and only two, uns and euch, look like the ones you
      already know. They also carry a set of everyday phrases where German
      insists on the dative and English does not: Wie geht es dir?, Das gefällt
      mir, Es tut mir leid.
    items:
      - form: Personal pronouns in the dative
        example: Kannst du mir bitte helfen? Ich zeige dir dann die Fotos.
        note: Only uns and euch stay as they are. Every other form changes.
        table:
          headers: ["Nominativ", "Dativ"]
          rows:
            - ["ich", "mir"]
            - ["du", "dir"]
            - ["er / es", "ihm"]
            - ["sie", "ihr"]
            - ["wir", "uns"]
            - ["ihr", "euch"]
            - ["sie", "ihnen"]
            - ["Sie", "Ihnen"]
      - form: "mein, dein and unser in the dative"
        example: Ich habe meiner Schwester und meinem Bruder gratuliert.
        note: "The endings copy dem and der exactly: -em for masculine and neuter, -er for feminine."
        table:
          headers: ["Nominativ", "Dativ"]
          rows:
            - ["mein Bruder", "meinem Bruder"]
            - ["meine Schwester", "meiner Schwester"]
            - ["mein Kind", "meinem Kind"]
            - ["unsere Oma", "unserer Oma"]
      - form: The dative at a glance
        example: "Ich helfe dem Bruder. Ich helfe meinem Bruder. Ich helfe ihm."
        note: Three ways to name the same person, one set of endings. The word in front of the noun carries the case.
        table:
          headers: ["", "der Bruder", "die Schwester", "das Kind"]
          rows:
            - ["Artikel", "dem Bruder", "der Schwester", "dem Kind"]
            - ["mein", "meinem Bruder", "meiner Schwester", "meinem Kind"]
            - ["Personalpronomen", "ihm", "ihr", "ihm"]
      - form: "Everyday phrases built on a dative pronoun"
        example: "Wie geht es dir? Das gefällt mir sehr. Es tut mir leid."
        note: German puts the person in the dative where English makes it the subject. Learn each phrase whole.
        table:
          headers: ["Deutsch", "English"]
          rows:
            - ["Wie geht es dir?", "How are you?"]
            - ["Das gefällt mir.", "I like it."]
            - ["Es tut mir leid.", "I am sorry."]
            - ["Kannst du mir helfen?", "Can you help me?"]
            - ["Das gehört mir.", "That is mine."]

watchouts:
  - title: "helfen asks Wem?"
    bad: Ich helfe meinen Bruder jeden Samstag.
    good: Ich helfe meinem Bruder jeden Samstag.
    note: "helfen never takes the accusative. Always ask: Wem helfe ich? Meinem Bruder."
  - title: "danken and gratulieren ask Wem? too"
    bad: Ich gratuliere dich zum Geburtstag.
    good: Ich gratuliere dir zum Geburtstag.
    note: "Not dich but dir. The same goes for danken: Ich danke dir für das Geschenk."
  - title: The person first, the thing second
    bad: Ich schenke ein Buch meinem Vater.
    good: Ich schenke meinem Vater ein Buch.
    note: "Wem? first, Was? second. The dative stands in front of the accusative."
  - title: These verbs take haben in the perfect
    bad: Ich bin meiner Nachbarin beim Umzug geholfen.
    good: Ich habe meiner Nachbarin beim Umzug geholfen.
    note: "helfen, danken and schenken always build their perfect with haben, never with sein."

cloze_cards:
  - text: "Ich helfe {{c1::meinem}} Bruder jeden Samstag im Garten."
    hint: mein Bruder
    rule: "helfen asks Wem?, so the case is dative. mein Bruder → meinem Bruder."
  - text: "Das Fahrrad im Hof gehört {{c1::der}} Nachbarin aus dem dritten Stock."
    hint: die Nachbarin
    rule: "gehören asks Wem?, so the case is dative. die Nachbarin → der Nachbarin."
  - text: "Tom hat heute Geburtstag. Wir gratulieren {{c1::ihm}} am Abend."
    hint: er
    rule: "gratulieren asks Wem? — dative. Tom = er → ihm."
  - text: "Ich schaffe das nicht allein. Kannst du {{c1::mir}} bitte helfen?"
    hint: ich
    rule: "helfen asks Wem? — dative. ich → mir."
  - text: "Ich habe {{c1::meiner}} Kollegin einen Gutschein geschenkt."
    hint: meine Kollegin
    rule: "schenken asks Wem? first — dative. meine Kollegin → meiner Kollegin."
  - text: "Wir wollen die Bilder sehen. Zeig {{c1::uns}} bitte die Fotos!"
    hint: wir
    rule: "zeigen asks Wem? and Was? wir → uns, and the thing follows."
  - text: "Der Verkäufer hat {{c1::dem}} Kind den Gutschein erklärt."
    hint: das Kind
    rule: "erklären asks Wem? and Was? das Kind → dem Kind, then den Gutschein."
  - text: "Liebe Anna, lieber Tom, ich danke {{c1::euch}} für das Geschenk."
    hint: ihr
    rule: "danken asks Wem? — dative. Two people you address with du = ihr → euch."
