mode: writing
genre: an email asking for a favour
word_target: [50, 60]
prompt: |
  Your grandmother's birthday is on Saturday. You need help, so you write
  an email to a friend. 50–60 words, in German.

  Cover all four points:
  • why you are writing — your request
  • what you need and when
  • what you have already done yourself
  • how you say thank you — what you promise in return

  Use at least four verbs that take the dative, plus the pronouns mir and dir.
model_answer: |
  Liebe Mia,

  ich habe eine dringende Bitte an dich. Meine Oma hat am Samstag
  Geburtstag, und ich muss ihr Geschenk um zehn Uhr abholen. Kannst du mir
  bitte dein Auto leihen? Das Fotobuch habe ich schon eingepackt.
  Am Sonntag bringe ich dir ein Stück Kuchen — das verspreche ich dir!

  Vielen Dank und liebe Grüße
  Lena
checklist:
  - 50–60 words
  - All four points are covered
  - It opens with Liebe … / Lieber … and closes with a greeting
  - helfen, danken, gehören and gratulieren are followed by the dative
  - The pronouns mir, dir, ihm and ihr carry the right form
  - With two objects the person comes before the thing
  - The perfect uses haben or sein with the participle at the end
  - At least eight words from the module appear
