# Modul 03 · Wohnen und Einrichten — 30 Wörter zu Wohnung, Möbeln und Einrichtung.
# Kein Wort aus Modul 01: eine Vokabel gehört genau einem Modul (PLAN.md §4).
# Die sechs Positionsverben stehen hier als Wortschatz und sind zugleich der
# Grammatikstoff des Moduls — bei ihnen nennt `register` den passenden Kasus.
entries:
  - term: die Wohnung
    tag: Nomen
    definition: a flat, an apartment — several rooms where a person or family lives
    use_cases:
      - Unsere Wohnung hat drei Zimmer und einen Balkon.
      - Wir haben endlich eine Wohnung gefunden.
    collocations: eine Wohnung suchen · eine Wohnung mieten · in einer Wohnung leben
    register: "Plural: die Wohnungen"

  - term: das Zimmer
    tag: Nomen
    definition: a room; kitchen, bathroom and bedroom are all Zimmer
    use_cases:
      - Mein Zimmer ist klein, aber hell.
      - Wie viele Zimmer hat die Wohnung?
    collocations: das Zimmer einrichten · ein Zimmer mit Balkon
    register: "Plural: die Zimmer — gleich wie Singular."

  - term: der Schrank
    tag: Nomen
    definition: a wardrobe or cupboard — a large piece of furniture with doors
    use_cases:
      - Der Schrank steht neben dem Fenster.
      - Häng die Jacke bitte in den Schrank!
    collocations: der Kleiderschrank · den Schrank aufmachen
    register: "Plural: die Schränke"

  - term: das Regal
    tag: Nomen
    definition: a shelf unit, a bookcase — furniture made of boards
    use_cases:
      - Im Regal stehen über hundert Bücher.
      - Wir haben ein neues Regal an die Wand gehängt.
    collocations: das Bücherregal · etwas ins Regal stellen
    register: "Plural: die Regale"

  - term: die Wand
    tag: Nomen
    definition: a wall of a room; pictures hang on it
    use_cases:
      - An der Wand hängt ein großes Foto.
      - Die Wand ist weiß.
    collocations: an der Wand hängen · etwas an die Wand hängen
    register: "Plural: die Wände"

  - term: der Teppich
    tag: Nomen
    definition: a rug, a carpet — a soft piece of fabric lying on the floor
    use_cases:
      - Der Teppich liegt zwischen dem Sofa und dem Tisch.
      - Wir haben einen neuen Teppich gekauft.
    collocations: der Teppich liegt · einen Teppich auslegen
    register: "Plural: die Teppiche"

  - term: die Möbel
    tag: Nomen
    definition: furniture — cupboard, table, bed and armchair together
    use_cases:
      - Die Möbel sind alt, aber sehr schön.
      - Wir haben die Möbel im Internet bestellt.
    collocations: Möbel kaufen · alte Möbel · das Möbelstück
    register: "Fast immer Plural: die Möbel."

  - term: der Sessel
    tag: Nomen
    definition: an armchair — a soft chair with arms, comfortable to sit in
    use_cases:
      - Der Sessel steht in der Ecke am Fenster.
      - Stell den Sessel bitte neben das Regal!
    collocations: im Sessel sitzen · ein bequemer Sessel
    register: "Plural: die Sessel — gleich wie Singular."

  - term: die Lampe
    tag: Nomen
    definition: a lamp — what makes the room bright
    use_cases:
      - Die Lampe steht auf dem Schreibtisch.
      - Häng die Lampe bitte über den Tisch!
    collocations: die Lampe anmachen · die Lampe ausmachen
    register: "Plural: die Lampen"

  - term: der Boden
    tag: Nomen
    definition: the floor — the surface you stand and walk on
    use_cases:
      - Auf dem Boden liegt ein alter Teppich.
      - Das Buch ist auf den Boden gefallen.
    collocations: auf dem Boden liegen · der Holzboden
    register: "Plural: die Böden"

  - term: die Ecke
    tag: Nomen
    definition: a corner, where two walls meet
    use_cases:
      - In der Ecke steht eine große Pflanze.
      - Stell den Sessel in die Ecke!
    collocations: in der Ecke stehen · um die Ecke
    register: "Plural: die Ecken"

  - term: das Schlafzimmer
    tag: Nomen
    definition: the bedroom, the room with the bed
    use_cases:
      - Unser Schlafzimmer ist das kleinste Zimmer.
      - Im Schlafzimmer steht nur ein Bett und ein Schrank.
    collocations: ins Schlafzimmer gehen · das Schlafzimmerfenster
    register: "Aus schlafen + das Zimmer. Genauso: das Wohnzimmer, das Esszimmer."

  - term: einrichten
    tag: Verb
    definition: to furnish — to put furniture into an empty flat until you can live there
    use_cases:
      - Wir richten gerade unsere neue Wohnung ein.
      - Das Zimmer ist modern eingerichtet.
    collocations: eine Wohnung einrichten · schön eingerichtet
    register: "Trennbar: Ich richte ein. Partizip: eingerichtet."

  - term: umziehen
    tag: Verb
    definition: to move house — to change from one flat to another
    use_cases:
      - Im Sommer ziehen wir nach Hamburg um.
      - Sie ist letzte Woche in eine größere Wohnung umgezogen.
    collocations: in eine neue Wohnung umziehen · der Umzug
    register: "Trennbar: Ich ziehe um. Partizip: umgezogen, mit sein."

  - term: stellen
    tag: Verb
    definition: to put, to stand something somewhere (upright)
    use_cases:
      - Ich stelle die Lampe auf den Schreibtisch.
      - Stell die Gläser bitte ins Regal!
    collocations: etwas auf den Tisch stellen · etwas in die Ecke stellen
    register: "Frage Wohin? — danach der Akkusativ. Partner: stehen."

  - term: legen
    tag: Verb
    definition: to lay, to put something down flat
    use_cases:
      - Ich lege das Buch auf den Tisch.
      - Leg den Teppich bitte vor das Sofa!
    collocations: etwas auf den Boden legen · etwas ins Regal legen
    register: "Frage Wohin? — danach der Akkusativ. Partner: liegen."

  - term: hängen
    tag: Verb
    definition: to hang something up, e.g. a picture on a wall
    use_cases:
      - Ich hänge das Foto an die Wand.
      - Das Foto hängt schon lange an der Wand.
    collocations: ein Bild an die Wand hängen · an der Wand hängen
    register: "Zwei Formen: mit Objekt Wohin? + Akkusativ, ohne Objekt Wo? + Dativ."

  - term: stehen
    tag: Verb
    definition: to stand — to be somewhere, upright rather than flat
    use_cases:
      - Der Schrank steht neben der Tür.
      - Auf dem Tisch stehen zwei Gläser.
    collocations: in der Ecke stehen · auf dem Tisch stehen
    register: "Frage Wo? — danach der Dativ. Partner: stellen."

  - term: liegen
    tag: Verb
    definition: to lie — to be somewhere, flat rather than upright
    use_cases:
      - Das Buch liegt auf dem Boden.
      - Der Teppich liegt unter dem Tisch.
    collocations: auf dem Bett liegen · im Regal liegen
    register: "Frage Wo? — danach der Dativ. Partner: legen."

  - term: suchen
    tag: Verb
    definition: to look for something you cannot see at the moment
    use_cases:
      - Wir suchen seit drei Monaten eine Wohnung.
      - Ich suche meine Schlüssel — hast du sie gesehen?
    collocations: eine Wohnung suchen · nach etwas suchen
    register: "Partizip: gesucht."

  - term: finden
    tag: Verb
    definition: to find — to see what you were looking for
    use_cases:
      - Endlich haben wir eine bezahlbare Wohnung gefunden.
      - Ich finde meine Brille nicht.
    collocations: eine Wohnung finden · etwas gut finden
    register: "Unregelmäßig. Partizip: gefunden."

  - term: passen
    tag: Verb
    definition: to fit, to go well — to be the right size or colour
    use_cases:
      - Der Schrank passt nicht in die Ecke — er ist zu breit.
      - Der neue Teppich passt gut zu den Möbeln.
    collocations: in das Zimmer passen · zu etwas passen
    register: "Partizip: gepasst."

  - term: praktisch
    tag: Adjektiv
    definition: practical, useful — easy to use in everyday life
    use_cases:
      - Das Regal ist klein, aber sehr praktisch.
      - Eine Küche mit Fenster ist praktisch.
    collocations: praktisch sein · eine praktische Lösung
    register: "Gegenteil: unpraktisch"

  - term: hell
    tag: Adjektiv
    definition: bright, light; opposite of dunkel
    use_cases:
      - Das Zimmer ist sehr hell, es hat zwei große Fenster.
      - Wir suchen eine helle Wohnung.
    collocations: ein helles Zimmer · hell und freundlich
    register: "Gegenteil: dunkel"

  - term: dunkel
    tag: Adjektiv
    definition: dark, with little light; opposite of hell
    use_cases:
      - Der Flur ist ziemlich dunkel.
      - Im Winter wird es früh dunkel.
    collocations: ein dunkles Zimmer · es wird dunkel
    register: "Gegenteil: hell"

  - term: eng
    tag: Adjektiv
    definition: narrow, cramped; opposite of breit
    use_cases:
      - Die Küche ist sehr eng, dort passen nur zwei Personen.
      - Der Flur ist lang und eng.
    collocations: ein enges Zimmer · eng werden
    register: "Gegenteil: breit"

  - term: oben
    tag: Adverb
    definition: up, above; opposite of unten
    use_cases:
      - Die Gläser stehen oben im Schrank.
      - Wir wohnen oben, im vierten Stock.
    collocations: oben im Regal · da oben
    register: "Gegenteil: unten"

  - term: unten
    tag: Adverb
    definition: down, below; opposite of oben
    use_cases:
      - Die schweren Bücher liegen unten im Regal.
      - Unten im Haus ist eine Bäckerei.
    collocations: unten im Schrank · hier unten
    register: "Gegenteil: oben"

  - term: daneben
    tag: Adverb
    definition: next to it, right beside it
    use_cases:
      - Links steht der Schrank, daneben das Regal.
      - Das Sofa ist neu, der Sessel daneben ist alt.
    collocations: direkt daneben · gleich daneben
    register: "Kurz für: neben dieser Sache."

  - term: gegenüber
    tag: Adverb
    definition: opposite, on the other side, directly facing it
    use_cases:
      - Der Schreibtisch steht gegenüber vom Fenster.
      - Gegenüber wohnt eine nette Familie.
    collocations: gegenüber vom Fenster · direkt gegenüber
    register: "Oft mit von: gegenüber vom Bahnhof."
