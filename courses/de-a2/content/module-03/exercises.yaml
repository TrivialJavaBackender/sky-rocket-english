# Modul 03 · Wohnen und Einrichten — 52 Aufgaben im Kern, 20 im Wiederholungspool.
# Verteilung laut Profil (courses/de-a2/PLAN.md §6): 6 mc_cloze · 8 open_cloze ·
# 6 word_formation · 4 key_word_transformation · 8 grammar_drill ·
# 6 error_correction · 8 collocation_match · 6 reading_comprehension.
#
# Spiralisches Wiederholen: grammar_drill 7 nimmt die Präpositionen mit Dativ
# aus Modul 02, grammar_drill 8 und error_correction 5 das Perfekt aus Modul 01.
#
# Alle open_cloze-Lücken stehen auf dem Artikel, nicht auf der Präposition:
# „Der Teppich liegt ___ dem Sofa“ ließe vor, unter, neben und hinter zu — der
# Artikel dagegen ist durch Wo?/Wohin? eindeutig bestimmt.
core:
  # ───────────────────────── Multiple Choice ─────────────────────────
  - type: mc_cloze
    group: grammar
    content:
      pre: "Das Buch liegt auf "
      post: " Tisch."
      options: [dem, den, der, das]
      answer: 0
    explanation: "liegen answers Wo? — so the case is dative. der Tisch → dem Tisch."
  - type: mc_cloze
    group: grammar
    content:
      pre: "Stell die Lampe bitte auf "
      post: " Schreibtisch!"
      options: [dem, der, den, das]
      answer: 2
    explanation: "stellen answers Wohin? — so the case is accusative. der Schreibtisch → den Schreibtisch."
  - type: mc_cloze
    group: grammar
    content:
      pre: "Der Teppich liegt "
      post: " dem Bett — man sieht ihn fast nicht."
      options: [über, unter, auf den, in die]
      answer: 1
    explanation: "unter means lower than something. After liegen (Wo?) comes the dative: unter dem Bett."
  - type: mc_cloze
    group: grammar
    content:
      pre: "Häng das Bild bitte an "
      post: " Wand!"
      options: [der, dem, den, die]
      answer: 3
    explanation: "hängen with an object answers Wohin? — accusative. die Wand stays die Wand."
  - type: mc_cloze
    group: grammar
    content:
      pre: "Die Bücher stehen "
      post: " Regal, nicht auf dem Tisch."
      options: [ins, in die, im, in den]
      answer: 2
    explanation: "stehen answers Wo? — dative, and in dem contracts to im Regal."
  - type: mc_cloze
    group: grammar
    content:
      pre: "Wir haben den Sessel "
      post: " die Ecke gestellt."
      options: [an, in, im, ins]
      answer: 1
    explanation: "in die Ecke — stellen answers Wohin?, so accusative. im would answer Wo?."

  # ───────────────────────── Lückentext ─────────────────────────
  - type: open_cloze
    group: grammar
    content:
      pre: "Die Lampe steht auf "
      post: " Boden neben dem Sessel."
      answers: [dem]
      answer_shown: dem
    explanation: "stehen answers Wo? — dative. der Boden → dem Boden."
  - type: open_cloze
    group: grammar
    content:
      pre: "Ich hänge das Foto an "
      post: " Wand über dem Bett."
      answers: [die]
      answer_shown: die
    explanation: "hängen with an object answers Wohin? — accusative. die Wand stays die."
  - type: open_cloze
    group: grammar
    content:
      pre: "Der Schrank steht in "
      post: " Ecke neben der Tür."
      answers: [der]
      answer_shown: der
    explanation: "stehen answers Wo? — dative. die Ecke → der Ecke."
  - type: open_cloze
    group: grammar
    content:
      pre: "Stell den Sessel bitte neben "
      post: " Fenster!"
      answers: [das]
      answer_shown: das
    explanation: "stellen answers Wohin? — accusative. das Fenster stays das."
  - type: open_cloze
    group: grammar
    content:
      pre: "Das Regal hängt über "
      post: " Sofa."
      answers: [dem]
      answer_shown: dem
    explanation: "hängen without an object answers Wo? — dative. das Sofa → dem Sofa."
  - type: open_cloze
    group: grammar
    content:
      pre: "Wir stellen den Tisch zwischen "
      post: " Sessel und das Regal."
      answers: [den]
      answer_shown: den
    explanation: "stellen answers Wohin? — accusative. der Sessel → den Sessel."
  - type: open_cloze
    group: grammar
    content:
      pre: "Der Teppich liegt unter "
      post: " Tisch."
      answers: [dem]
      answer_shown: dem
    explanation: "liegen answers Wo? — dative. der Tisch → dem Tisch."
  - type: open_cloze
    group: grammar
    content:
      pre: "Häng die Jacke bitte in "
      post: " Schrank!"
      answers: [den]
      answer_shown: den
    explanation: "hängen with an object answers Wohin? — accusative. der Schrank → den Schrank."

  # ───────────────────────── Wortbildung ─────────────────────────
  - type: word_formation
    group: vocab
    content:
      pre: "Das Bett steht im "
      post: "."
      prompt: schlafen + das Zimmer
      answers: [Schlafzimmer]
      answer_shown: Schlafzimmer
    explanation: "Two parts become one word: schlafen + das Zimmer = das Schlafzimmer."
  - type: word_formation
    group: vocab
    content:
      pre: "Das Sofa und der Sessel stehen im "
      post: "."
      prompt: wohnen + das Zimmer
      answers: [Wohnzimmer]
      answer_shown: Wohnzimmer
    explanation: "wohnen + das Zimmer = das Wohnzimmer. The article comes from the second part."
  - type: word_formation
    group: vocab
    content:
      pre: "Häng die Jacke in den "
      post: "!"
      prompt: die Kleider + der Schrank
      answers: [Kleiderschrank]
      answer_shown: Kleiderschrank
    explanation: "die Kleider + der Schrank = der Kleiderschrank."
  - type: word_formation
    group: vocab
    content:
      pre: "Meine Bücher stehen alle im "
      post: "."
      prompt: die Bücher + das Regal
      answers: [Bücherregal]
      answer_shown: Bücherregal
    explanation: "die Bücher + das Regal = das Bücherregal."
  - type: word_formation
    group: vocab
    content:
      pre: "Der Computer steht auf dem "
      post: " am Fenster."
      prompt: schreiben + der Tisch
      answers: [Schreibtisch]
      answer_shown: Schreibtisch
    explanation: "schreiben + der Tisch = der Schreibtisch."
  - type: word_formation
    group: vocab
    content:
      pre: "Wir essen jeden Abend zusammen im "
      post: "."
      prompt: essen + das Zimmer
      answers: [Esszimmer]
      answer_shown: Esszimmer
    explanation: "essen + das Zimmer = das Esszimmer."

  # ───────────────────────── Umformung ─────────────────────────
  - type: key_word_transformation
    group: grammar
    content:
      s1: Das Buch liegt auf dem Tisch.
      key: LEGEN
      pre: "Ich lege das Buch auf "
      post: " Tisch."
      answers: [den]
      hint: 1 Wort
      answer_shown: den
    explanation: "Wo? turns into Wohin?: liegen → legen, dative → accusative. dem Tisch → den Tisch."
  - type: key_word_transformation
    group: grammar
    content:
      s1: Ich hänge das Bild an die Wand.
      key: HÄNGEN
      pre: "Das Bild hängt an "
      post: " Wand."
      answers: [der]
      hint: 1 Wort
      answer_shown: der
    explanation: "Wohin? turns into Wo?: the accusative becomes the dative. die Wand → der Wand."
  - type: key_word_transformation
    group: grammar
    content:
      s1: Wir stellen den Sessel in die Ecke.
      key: STEHEN
      pre: "Der Sessel steht in "
      post: " Ecke."
      answers: [der]
      hint: 1 Wort
      answer_shown: der
    explanation: "stellen → stehen, accusative → dative. die Ecke → der Ecke."
  - type: key_word_transformation
    group: grammar
    content:
      s1: Wohin stellst du die Lampe?
      key: NEBEN
      pre: "Ich stelle die Lampe "
      post: "."
      answers: [neben das Sofa]
      hint: 3 Wörter
      answer_shown: neben das Sofa
    explanation: "The question Wohin? calls for the accusative: neben das Sofa."

  # ───────────────────────── Grammatik-Drill ─────────────────────────
  - type: grammar_drill
    group: grammar
    content:
      pre: "Die Lampe "
      post: " auf dem Tisch."
      prompt: STEHEN ODER STELLEN
      options: [steht, stellt, stellen, stehen]
      answer: 0
    explanation: "No object in the sentence and the question is Wo? — so the verb is stehen."
  - type: grammar_drill
    group: grammar
    content:
      pre: "Ich "
      post: " die Lampe auf den Tisch."
      prompt: STEHEN ODER STELLEN
      options: [stehe, stelle, steht, stellt]
      answer: 1
    explanation: "die Lampe is the object and the question is Wohin? — so the verb is stellen."
  - type: grammar_drill
    group: grammar
    content:
      pre: "Das Buch "
      post: " schon lange oben im Regal."
      prompt: LIEGEN ODER LEGEN
      options: [lege, legt, liegt, liege]
      answer: 2
    explanation: "No object, question Wo? — so the verb is liegen: Das Buch liegt."
  - type: grammar_drill
    group: grammar
    content:
      pre: "Bitte "
      post: " den Teppich vor das Sofa!"
      prompt: LIEGEN ODER LEGEN
      options: [liegt, liege, legt, leg]
      answer: 3
    explanation: "A request to one person with du: leg. With an object and Wohin? the verb is legen."
  - type: grammar_drill
    group: grammar
    content:
      pre: "Der Schrank steht "
      post: " der Ecke."
      prompt: WO?
      options: [in, ins, in die, an die]
      answer: 0
    explanation: "Wo? calls for the dative: in der Ecke. ins and in die would answer Wohin?."
  - type: grammar_drill
    group: grammar
    content:
      pre: "Häng die Jacke bitte "
      post: " den Schrank!"
      prompt: WOHIN?
      options: [im, in, ins, an dem]
      answer: 1
    explanation: "Wohin? calls for the accusative: in den Schrank."
  - type: grammar_drill
    group: grammar
    content:
      pre: "Ich fahre jeden Morgen "
      post: " dem Fahrrad zur Arbeit."
      prompt: PRÄPOSITION MIT DATIV
      options: [in, an, mit, auf]
      answer: 2
    explanation: "mit always takes the dative and never alternates: mit dem Fahrrad, mit der Bahn."
  - type: grammar_drill
    group: grammar
    content:
      pre: "Meine Schwester "
      post: " im Mai in eine größere Wohnung umgezogen."
      prompt: HABEN ODER SEIN
      options: [hat, haben, war, ist]
      answer: 3
    explanation: "umziehen is movement from A to B, so the perfect takes sein. sie + sein = ist."

  # ───────────────────────── Fehlersuche ─────────────────────────
  - type: error_correction
    group: grammar
    content:
      words: [Ich, lege, das, Buch, auf, dem, "Tisch."]
      wrong: 5
      correction: "dem → den"
    explanation: "legen answers Wohin? — accusative: auf den Tisch."
  - type: error_correction
    group: grammar
    content:
      words: [Der, Schrank, steht, in, die, "Ecke."]
      wrong: 4
      correction: "die → der"
    explanation: "stehen answers Wo? — dative: in der Ecke."
  - type: error_correction
    group: grammar
    content:
      words: [Häng, das, Bild, bitte, an, der, "Wand!"]
      wrong: 5
      correction: "der → die"
    explanation: "hängen with an object answers Wohin? — accusative: an die Wand."
  - type: error_correction
    group: grammar
    content:
      words: [Die, Lampe, stellt, auf, dem, "Schreibtisch."]
      wrong: 2
      correction: "stellt → steht"
    explanation: "With no object the verb is stehen. stellen always needs one: Ich stelle die Lampe."
  - type: error_correction
    group: grammar
    content:
      words: [Wir, haben, letzte, Woche, nach, Bremen, "umgezogen."]
      wrong: 1
      correction: "haben → sind"
    explanation: "umziehen is movement from A to B and forms its perfect with sein."
  - type: error_correction
    group: grammar
    content:
      words: [Wir, haben, ein, neues, Schlaf, Zimmer, "eingerichtet."]
      wrong: 4
      correction: "Schlaf Zimmer → Schlafzimmer"
    explanation: "Two nouns always become one word in German: das Schlafzimmer."

  # ───────────────────────── Wörter verbinden ─────────────────────────
  - type: collocation_match
    group: grammar
    content:
      left: [stellen, legen, stehen, liegen]
      right: [Wo? + Dativ, aufrecht, Wohin? + Akkusativ, flach]
      pairs: { 0: 2, 1: 3, 2: 0, 3: 1 }
    explanation: "stellen and legen answer Wohin?, stehen and liegen answer Wo?. legen and liegen are flat, stellen and stehen upright."
  - type: collocation_match
    group: grammar
    content:
      left: [in dem, in das, an dem, an das]
      right: [ins, am, im, ans]
      pairs: { 0: 2, 1: 0, 2: 1, 3: 3 }
    explanation: "The contracted forms: in dem = im, in das = ins, an dem = am, an das = ans."
  - type: collocation_match
    group: vocab
    content:
      left: [der Schrank, das Regal, der Teppich, die Lampe]
      right: [liegt auf dem Boden, macht das Zimmer hell, hat Türen, hat Bretter für Bücher]
      pairs: { 0: 2, 1: 3, 2: 0, 3: 1 }
    explanation: "Four pieces of furniture, each with what defines it."
  - type: collocation_match
    group: vocab
    content:
      left: [hell, dunkel, eng, praktisch]
      right: [mit wenig Platz, mit viel Licht, gut zu benutzen, mit wenig Licht]
      pairs: { 0: 1, 1: 3, 2: 0, 3: 2 }
    explanation: "hell and dunkel are opposites. eng describes the space, praktisch the use."
  - type: collocation_match
    group: vocab
    content:
      left: [oben, unten, daneben, gegenüber]
      right: [direkt neben dieser Sache, an einem tiefen Ort, auf der anderen Seite, an einem hohen Ort]
      pairs: { 0: 3, 1: 1, 2: 0, 3: 2 }
    explanation: "oben and unten are opposites. daneben and gegenüber tell you the side."
  - type: collocation_match
    group: vocab
    content:
      left: [eine Wohnung, ein Zimmer, ein Bild, Möbel]
      right: [einrichten, aufhängen, suchen, kaufen]
      pairs: { 0: 2, 1: 0, 2: 1, 3: 3 }
    explanation: "eine Wohnung suchen, ein Zimmer einrichten, ein Bild aufhängen, Möbel kaufen."
  - type: collocation_match
    group: vocab
    content:
      left: [umziehen, einrichten, passen, finden]
      right: [die richtige Größe haben, Möbel in ein leeres Zimmer stellen, in eine andere Wohnung wechseln, was man gesucht hat]
      pairs: { 0: 2, 1: 1, 2: 0, 3: 3 }
    explanation: "Four verbs about moving house, each with its paraphrase."
  - type: collocation_match
    group: vocab
    content:
      left: [schlafen + Zimmer, Bücher + Regal, Kleider + Schrank, schreiben + Tisch]
      right: [das Bücherregal, der Schreibtisch, das Schlafzimmer, der Kleiderschrank]
      pairs: { 0: 2, 1: 0, 2: 3, 3: 1 }
    explanation: "Two parts become one word, and the article always comes from the second one."

  # ───────────────────────── Leseverstehen ─────────────────────────
  - type: reading_comprehension
    group: reading
    content:
      passage: "Drei Monate haben Jonas und Mira eine Wohnung gesucht. Im April haben sie endlich eine gefunden: drei Zimmer, vierter Stock, zwei große Fenster. „Hell und praktisch“, sagt Mira. „Nur der Flur ist eng und dunkel.“"
      q: Was gefällt Mira an der Wohnung nicht?
      options:
        - Der Flur
        - Die Fenster
        - Der vierte Stock
        - Die Zahl der Zimmer
      answer: 0
    explanation: "The text says: Nur der Flur ist eng und dunkel. Everything else she finds bright and practical."
  - type: reading_comprehension
    group: reading
    content:
      passage: "Sie haben mit dem Wohnzimmer angefangen. Das Sofa steht jetzt an der Wand, gegenüber vom Fenster. Den Teppich haben sie davor auf den Boden gelegt. In die Ecke neben dem Fenster haben sie den Sessel gestellt — dort ist es am hellsten, und Mira liest dort jeden Abend."
      q: Warum steht der Sessel in der Ecke am Fenster?
      options:
        - Dort ist mehr Platz.
        - Dort ist es am hellsten.
        - Dort steht auch das Sofa.
        - Dort liegt der Teppich.
      answer: 1
    explanation: "The text says: dort ist es am hellsten, und Mira liest dort jeden Abend."
  - type: reading_comprehension
    group: reading
    content:
      passage: "Das Bücherregal hängt nicht an der Wand, es steht daneben auf dem Boden: „Ein Regal an der Wand ist schön, aber unsere Bücher sind zu schwer.“"
      q: Wo ist das Bücherregal?
      options:
        - An der Wand
        - Im Schlafzimmer
        - Auf dem Boden
        - Im Flur
      answer: 2
    explanation: "The text says: es steht daneben auf dem Boden. It is not hanging on the wall at the moment."
  - type: reading_comprehension
    group: reading
    content:
      passage: "Im Schlafzimmer ist es einfacher gewesen. Das Bett steht zwischen den beiden Fenstern, der Kleiderschrank an der langen Wand. Über dem Bett hängt ein großes Foto aus Portugal. „Das Foto hängt in jeder Wohnung über unserem Bett“, sagt Jonas."
      q: Was macht Jonas in jeder Wohnung gleich?
      options:
        - Er stellt das Bett zwischen die Fenster.
        - Er kauft einen neuen Schrank.
        - Er richtet zuerst das Schlafzimmer ein.
        - Er hängt das Foto über das Bett.
      answer: 3
    explanation: "The text says: Das Foto hängt in jeder Wohnung über unserem Bett."
  - type: reading_comprehension
    group: reading
    content:
      passage: "In der Küche stehen die Gläser oben im Schrank und die schweren Töpfe unten. „So ist es praktisch“, sagt Mira, „oben nehme ich zehnmal am Tag etwas heraus, unten zweimal.“"
      q: Warum stehen die Gläser oben?
      options:
        - Weil sie leichter sind.
        - Mira braucht sie sehr oft.
        - Unten ist kein Platz mehr.
        - Die Töpfe sind zu groß.
      answer: 1
    explanation: "The text says: oben nehme ich zehnmal am Tag etwas heraus, unten zweimal."
  - type: reading_comprehension
    group: reading
    content:
      passage: "Nur eine Sache passt noch nicht: Der Küchentisch ist zu groß. Er steht jetzt mitten im Raum, und alle laufen um ihn herum. „Nächstes Wochenende stellen wir ihn an die Wand“, sagt Jonas. Mira lacht: „Das hast du letzte Woche auch gesagt.“"
      q: Was ist das Problem mit dem Küchentisch?
      options:
        - Er ist zu dunkel.
        - Er ist kaputt.
        - Er ist zu groß für den Platz.
        - Er passt nicht zu den Möbeln.
      answer: 2
    explanation: "The text says: Der Küchentisch ist zu groß. Er steht mitten im Raum, und alle laufen um ihn herum."

