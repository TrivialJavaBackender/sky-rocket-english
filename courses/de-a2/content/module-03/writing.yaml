mode: writing
genre: Beschreibung des eigenen Zimmers
word_target: [50, 60]
prompt: |
  Eine Freundin will Ihr Zimmer sehen, bevor sie zu Besuch kommt.
  Beschreiben Sie ihr das Zimmer. 50–60 Wörter.

  Schreiben Sie zu allen vier Punkten:
  • Wie das Zimmer ist — hell, dunkel, eng, praktisch
  • Wo die großen Möbel stehen
  • Was an der Wand hängt
  • Was Sie noch ändern möchten

  Benutzen Sie mindestens vier Wechselpräpositionen und die Frage Wo?
model_answer: |
  Mein Zimmer ist klein, aber sehr hell. Der Schreibtisch steht am Fenster,
  daneben ein Regal mit meinen Büchern. Das Bett steht an der Wand,
  gegenüber vom Schrank. Über dem Bett hängt ein Foto aus Italien, und auf
  dem Boden liegt ein Teppich. Nur der Sessel passt nicht: Er steht
  mitten im Zimmer. Nächste Woche stelle ich ihn in die Ecke.
checklist:
  - 50–60 Wörter
  - Alle vier Punkte stehen im Text
  - Mindestens vier Wechselpräpositionen kommen vor
  - Nach Wo? steht der Dativ (auf dem Tisch, an der Wand)
  - Nach Wohin? steht der Akkusativ (in die Ecke, an die Wand)
  - stehen, liegen und hängen ohne Objekt — stellen, legen und hängen mit Objekt
  - Adjektive stehen hinter dem Nomen mit sein (Das Zimmer ist hell)
  - Mindestens acht Wörter aus dem Modul kommen vor
