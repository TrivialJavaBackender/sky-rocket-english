mode: writing
genre: a description of your own room
word_target: [50, 60]
prompt: |
  A friend wants to see your room before she visits. Describe it to her,
  in German. 50–60 words.

  Cover all four points:
  • what the room is like — hell, dunkel, eng, praktisch
  • where the big pieces of furniture stand
  • what hangs on the wall
  • what you would still like to change

  Use at least four two-way prepositions and the question Wo?
model_answer: |
  Mein Zimmer ist klein, aber sehr hell. Der Schreibtisch steht am Fenster,
  daneben ein Regal mit meinen Büchern. Das Bett steht an der Wand,
  gegenüber vom Schrank. Über dem Bett hängt ein Foto aus Italien, und auf
  dem Boden liegt ein Teppich. Nur der Sessel passt nicht: Er steht
  mitten im Zimmer. Nächste Woche stelle ich ihn in die Ecke.
checklist:
  - 50–60 words
  - All four points are covered
  - At least four two-way prepositions appear
  - Wo? is answered with the dative (auf dem Tisch, an der Wand)
  - Wohin? is answered with the accusative (in die Ecke, an die Wand)
  - stehen, liegen and hängen take no object — stellen, legen and hängen do
  - Adjectives follow the noun with sein (Das Zimmer ist hell)
  - At least eight words from the module appear
