# Sprechen statt Schreiben (Modulkarte: записанный монолог 1–2 мин), deshalb
# ohne word_target — content-schema.ts lässt es bei mode: speaking nicht zu.
# Das Musterbeispiel hat 119 Wörter: gesprochen sind das rund anderthalb Minuten.
mode: speaking
genre: your journey from home to work
prompt: |
  A colleague from another city asks you: „Wie kommst du eigentlich jeden
  Morgen zur Arbeit?“ Describe your journey, in German. Speak for
  1–2 minutes and record yourself.

  Cover all four points:
  • how long the journey takes and what you travel by
  • where you get on, change and get off
  • the stretch on foot at the start or the end — geradeaus, rechts, links
  • what makes the morning harder: traffic, a delay or a crowded train

  Use at least six prepositions with the dative and two with the accusative.
model_answer: |
  Ich wohne im Zentrum, mein Büro ist weit draußen. Der Weg dauert ungefähr
  vierzig Minuten. Zuerst gehe ich fünf Minuten zu Fuß bis zur Haltestelle.
  Dort nehme ich die Straßenbahn 6 in Richtung Hauptbahnhof. Am Hauptbahnhof
  steige ich um: Ich gehe geradeaus durch die Halle und dann rechts zum
  Bahnsteig 3. Die S-Bahn fährt alle zehn Minuten, und ich bin nach vier
  Stationen da. Von der Haltestelle sind es noch drei Minuten zu Fuß: nach
  der Ampel links, dann immer geradeaus. Am Morgen ist die Bahn sehr voll,
  aber ich sitze fast immer. Mit dem Auto brauche ich eine Stunde — bei so
  viel Verkehr fahre ich gern mit der Bahn. Nur mit Verspätung komme ich zu
  spät zur Arbeit.
checklist:
  - 1–2 minutes of free speech, no pause longer than five seconds
  - All four points are covered
  - At least six prepositions with the dative (mit, bei, nach, von, zu, aus, seit)
  - At least two prepositions with the accusative (für, gegen, ohne, um, durch, bis)
  - The dative follows mit, bei, nach, von, zu, aus, seit (mit dem Bus, zur Arbeit)
  - The accusative follows für, gegen, ohne, um, durch, bis (durch den Park)
  - "The contracted forms appear: zum, zur, beim, vom, im, am"
  - nach before towns, zu before people and buildings (nach Wien, zum Arzt)
  - At least eight words from the module appear
