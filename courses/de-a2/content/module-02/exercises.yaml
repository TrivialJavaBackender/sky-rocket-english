      pre: "Wir kommen gerade "
      post: " Konzert."
      prompt: KURZE FORM
      options: [zum, beim, vom, im]
      answer: 2
    explanation: "That is where the route starts: von dem Konzert, contracted to vom Konzert."
  - type: grammar_drill
    group: grammar
    content:
      pre: "Sie ist gestern ohne "
      post: " Fahrkarte gefahren."
      prompt: DIE FAHRKARTE
      options: [ihre, ihrer, ihrem, ihren]
      answer: 0
    explanation: "ohne takes the accusative, but a die-noun does not change: ohne ihre Fahrkarte."
  - type: grammar_drill
    group: grammar
    content:
      pre: "Der Zug nach Wien fährt "
      post: " Bahnsteig 21 ab."
      prompt: WELCHE PRÄPOSITION
      options: [zu, für, bei, von]
      answer: 3
    explanation: "abfahren marks the start of the journey: von Bahnsteig 21."
  - type: grammar_drill
    group: grammar
    content:
      pre: "Nach "
      post: " Kurs fahre ich sofort nach Hause."
      prompt: DER KURS IM DATIV
      options: [den Kurs, dem Kurs, der Kurs, des Kurses]
      answer: 1
    explanation: "nach takes the dative. der Kurs → dem Kurs."
  - type: error_correction
    group: grammar
    content:
      words: [Wir, fahren, mit, das, Auto, in, die, "Stadt."]
      wrong: 3
      correction: "das → dem"
    explanation: "mit takes the dative: mit dem Auto."
  - type: error_correction
    group: grammar
    content:
      words: [Ich, gehe, jeden, Tag, zu, Fuß, nach, "Arbeit."]
      wrong: 6
      correction: "nach → zur"
    explanation: "nach goes before towns and countries. die Arbeit takes zu: zur Arbeit."
  - type: error_correction
    group: grammar
    content:
      words: [Meine, Eltern, haben, gestern, nach, Wien, "gefahren."]
      wrong: 2
      correction: "haben → sind"
    explanation: "fahren takes sein: Meine Eltern sind nach Wien gefahren."
  - type: word_formation
    group: vocab
