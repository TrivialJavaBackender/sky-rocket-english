# Modul 01 · Mein Wochenende — Grammatik im Fokus, Watch out! und Lückenkarten.
# 7 Punkte — genau die Grammatik-Liste der Modulkarte (courses/de-a2/PLAN.md §4).
# Die Obergrenze des Profils (§6) wäre 2 Spotlights × 4 Punkte.
#
# Fachwörter: alle aus dem Grammatik-Wörterbuch der Diagnostik, dazu „das
# Perfekt“ — der Begriff nennt die Konstruktion, die dieses Modul einführt, und
# steht deshalb hier (PLAN.md §5.2).
spotlights:
  - title: "Das Partizip"
    intro: "Für die Vergangenheit braucht man das Partizip. Es gibt drei Gruppen — die Endung zeigt, welche."
    items:
      - form: "Regelmäßige Verben: ge- + Stamm + -t"
        note: "Der Stamm bleibt gleich. Das ist die größte Gruppe."
        table:
          headers: ["Infinitiv", "Stamm", "Partizip"]
          rows:
            - ["machen", "mach-", "gemacht"]
            - ["kochen", "koch-", "gekocht"]
            - ["spielen", "spiel-", "gespielt"]
            - ["wandern", "wander-", "gewandert"]
      - form: "Unregelmäßige Verben: ge- + Stamm + -en"
        note: "Oft ändert sich auch der Vokal. Diese Formen lernt man auswendig."
        table:
          headers: ["Infinitiv", "Partizip"]
          rows:
            - ["essen", "gegessen"]
            - ["trinken", "getrunken"]
            - ["fahren", "gefahren"]
            - ["gehen", "gegangen"]
            - ["kommen", "gekommen"]
            - ["sein", "gewesen"]
      - form: "Trennbare Verben: ge- steht in der Mitte"
        note: "Vorsilbe + ge- + Stamm + Endung. Alles bleibt ein Wort."
        table:
          headers: ["Infinitiv", "Vorsilbe", "Partizip"]
          rows:
            - ["aufräumen", "auf-", "aufgeräumt"]
            - ["einkaufen", "ein-", "eingekauft"]
            - ["einladen", "ein-", "eingeladen"]
            - ["mitbringen", "mit-", "mitgebracht"]
            - ["fernsehen", "fern-", "ferngesehen"]

  - title: "Das Perfekt im Satz"
    intro: "Das Perfekt hat zwei Teile: haben oder sein und das Partizip. So erzählt man von gestern."
    items:
      - form: "Das Perfekt mit haben"
        note: "Die meisten Verben nehmen haben."
        table:
          headers: ["", "haben", "Partizip"]
          rows:
            - ["ich", "habe", "gekocht"]
            - ["du", "hast", "gekocht"]
            - ["er / sie / es", "hat", "gekocht"]
            - ["wir", "haben", "gekocht"]
            - ["ihr", "habt", "gekocht"]
            - ["sie / Sie", "haben", "gekocht"]
      - form: "Das Perfekt mit sein"
        note: "Bewegung von A nach B und die Verben bleiben, sein, werden."
        table:
          headers: ["", "sein", "Partizip"]
          rows:
            - ["ich", "bin", "gefahren"]
            - ["du", "bist", "gefahren"]
            - ["er / sie / es", "ist", "gefahren"]
            - ["wir", "sind", "gefahren"]
            - ["ihr", "seid", "gefahren"]
            - ["sie / Sie", "sind", "gefahren"]
      - form: "Die Stellung: Position 2 und am Ende"
        note: "haben oder sein steht auf Position 2. Das Partizip steht ganz am Ende."
        table:
          headers: ["Position 1", "haben / sein", "Mitte", "Ende"]
          rows:
            - ["Ich", "habe", "am Samstag Fußball", "gespielt."]
            - ["Am Samstag", "habe", "ich Fußball", "gespielt."]
            - ["Wir", "sind", "um zehn nach Hause", "gekommen."]
            - ["Was", "hast", "du am Wochenende", "gemacht?"]
      - form: "Die Zeitangaben"
        note: "Sie stehen am Anfang oder in der Mitte — nie am Ende."
        table:
          headers: ["Zeitangabe", "Beispiel"]
          rows:
            - ["gestern", "Gestern habe ich gearbeitet."]
            - ["vorgestern", "Vorgestern sind wir gewandert."]
            - ["letzte Woche", "Letzte Woche hat sie gefeiert."]
            - ["am Samstag", "Am Samstag bin ich zu Hause geblieben."]

watchouts:
  - title: "Bewegung nimmt sein"
    bad: Ich habe nach Berlin gefahren.
    good: Ich bin nach Berlin gefahren.
    note: "Bewegung von A nach B: fahren, gehen, kommen, fliegen — immer mit sein."
  - title: "Ohne Bewegung steht haben"
    bad: Ich bin Fußball gespielt.
    good: Ich habe Fußball gespielt.
    note: "spielen, kochen, arbeiten, lernen — alle mit haben."
  - title: "Verben auf -ieren ohne ge-"
    bad: Ich habe mit Anna getelefoniert.
    good: Ich habe mit Anna telefoniert.
    note: "telefonieren, studieren, fotografieren — das Partizip endet auf -t, ohne ge-."
  - title: "Das Partizip steht am Ende"
    bad: Wir haben gemacht einen Ausflug.
    good: Wir haben einen Ausflug gemacht.
    note: "Zwischen haben und Partizip steht der Rest vom Satz."

cloze_cards:
  - text: "Am Samstag {{c1::habe}} ich bis zehn Uhr geschlafen."
    hint: haben
    rule: "schlafen bildet das Perfekt mit haben. ich + haben = habe."
  - text: "Meine Schwester {{c1::ist}} am Sonntag zu mir gekommen."
    hint: sein
    rule: "kommen ist Bewegung von A nach B, also Perfekt mit sein. sie + sein = ist."
  - text: "Wir haben zusammen einen Kuchen {{c1::gebacken}}."
    hint: backen
    rule: "backen ist unregelmäßig: ge- + Stamm + -en."
  - text: "Ich habe am Freitag meine Wohnung {{c1::aufgeräumt}}."
    hint: aufräumen
    rule: "Trennbares Verb: das ge- steht in der Mitte — auf-ge-räumt."
  - text: "{{c1::Seid}} ihr gestern spazieren gegangen?"
    hint: sein
    rule: "gehen bildet das Perfekt mit sein. ihr + sein = seid."
  - text: "Nina hat zehn Freunde zur Party {{c1::eingeladen}}."
    hint: einladen
    rule: "ein-ge-laden: das ge- steht zwischen Vorsilbe und Stamm."
  - text: "Wir sind drei Stunden am See {{c1::gewandert}}."
    hint: wandern
    rule: "wandern ist regelmäßig: ge- + Stamm + -t. Es ist Bewegung, also mit sein."
  - text: "Was {{c1::hast}} du am Wochenende gemacht?"
    hint: haben
    rule: "machen nimmt haben. du + haben = hast. Das Partizip steht am Ende."
