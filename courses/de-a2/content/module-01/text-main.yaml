kind: main
kicker: READING
title: Was hast du am Wochenende gemacht?
meta: ≈ 3 min · dotted words carry glosses — tap to reveal
body:
  - - t: "Am Montag im Büro fragen alle das Gleiche: Was hast du am Wochenende gemacht? Für Nina ist die Antwort diesmal lang geworden."
  - - t: "Am Freitagabend ist sie früh nach Hause gekommen und hat zuerst die Wohnung aufgeräumt. „Das klingt langweilig“, sagt sie und lacht, „aber so habe ich danach zwei freie Tage gehabt.“"
  - - t: "Am Samstag hat Nina ausgeschlafen. Um zehn ist sie aufgestanden, hat gefrühstückt und ist mit dem Rad zum Markt gefahren. Dort hat sie für die ganze Woche eingekauft: Obst, Gemüse, Brot. Am Nachmittag hat sie einen Kuchen gebacken, denn am Abend sind Freunde gekommen. Sie hat die Leute schon am Mittwoch eingeladen. Alle haben etwas mitgebracht — Salat, Wein, Musik. Sie haben zusammen gekocht, gegessen und bis nach "
    - g: Mitternacht
    - t: " geredet. Der Abend ist sehr "
    - g: gemütlich
    - t: " gewesen. „Wir haben nichts geplant und trotzdem bis spät gefeiert“, sagt Nina."
  - - t: "Am Sonntag hat die Sonne geschienen, und Nina ist keine Minute drinnen geblieben. Mit ihrer Schwester hat sie sich am Bahnhof getroffen, und die beiden sind an den See gefahren. Dort haben sie einen Ausflug gemacht und sind drei Stunden gewandert. Nina findet Wandern spannend, ihre Schwester findet es "
    - g: anstrengend
    - t: ". „Aber am Ende hat sie gelacht“, sagt Nina. Den ganzen Nachmittag sind die beiden draußen geblieben."
  - - t: "Am Abend hat Nina nichts mehr geplant. Sie hat nur noch ferngesehen und ist früh ins Bett gegangen. Übrigens: Neulich hat sie ein neues Hobby gefunden. Sie treibt jetzt zweimal pro Woche Sport — sie geht schwimmen. Am Sonntag hat sie das nicht gemacht. „Einmal Pause ist auch Freizeit.“"
  - - t: "Und Sie? Was haben Sie am Wochenende gemacht? Sind Sie spazieren gegangen, haben Sie Freunde besucht, haben Sie ein Konzert gehört? Oder haben Sie vorgestern und gestern einfach nichts getan? Auch das ist eine Antwort."
glosses:
  - key: Mitternacht
    term: Mitternacht
    pos_label: noun
    definition: midnight; twelve at night, when one day ends and the next begins
    example: Wir haben bis nach Mitternacht geredet.
  - key: gemütlich
    term: gemütlich
    pos_label: adjective
    definition: cosy, relaxed — calm and pleasant, with no hurry
    example: Das Café ist klein und sehr gemütlich.
  - key: anstrengend
    term: anstrengend
    pos_label: adjective
    definition: tiring, exhausting — it takes a lot out of you
    example: Die Wanderung war schön, aber anstrengend.
