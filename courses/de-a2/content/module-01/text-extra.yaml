kind: extra
kicker: POSTS
title: Drei Posts vom Wochenende
meta: ≈ 1 min · three short posts from an online group
body:
  - - t: "TOM, Samstag 22:14"
  - - t: "Endlich Wochenende! Ich habe heute bis elf geschlafen, dann habe ich die ganze Wohnung aufgeräumt. Danach bin ich mit dem Rad an den Fluss gefahren und habe zwei Stunden in der Sonne gesessen. Kein Handy, kein Laptop. So "
    - g: gemütlich
    - t: " ist mein Samstag lange nicht gewesen."
  - - t: "SARA, Sonntag 09:02"
  - - t: "Gestern haben wir Julias Geburtstag gefeiert. Sie hat zwanzig Leute eingeladen, und alle haben etwas mitgebracht. Ich habe einen Kuchen gebacken — er ist leider nicht schön geworden, aber er hat gut geschmeckt. Wir haben bis zwei Uhr geredet und getanzt. Heute bin ich müde."
  - - t: "MARKUS, Sonntag 19:40"
  - - t: "Vorgestern bin ich mit meinem Bruder in den Bergen gewandert, sechs Stunden. Sehr "
    - g: anstrengend
    - t: ", aber es hat sich gelohnt. Heute habe ich nichts gemacht: nur ferngesehen und Tee getrunken. Übrigens, wer kommt nächstes Wochenende mit? Wir treffen uns um acht am Bahnhof."
glosses:
  - key: gemütlich
    term: gemütlich
    pos_label: adjective
    definition: cosy, relaxed — calm and pleasant, with no hurry
    example: Wir hatten einen gemütlichen Abend zu Hause.
  - key: anstrengend
    term: anstrengend
    pos_label: adjective
    definition: tiring, exhausting — it takes a lot out of you
    example: Der Tag im Garten war sehr anstrengend.
