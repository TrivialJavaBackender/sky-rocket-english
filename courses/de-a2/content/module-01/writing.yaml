mode: writing
genre: Bericht vom Wochenende
word_target: [50, 60]
prompt: |
  In Ihrer Sprachgruppe im Netz schreiben alle am Montag, was sie
  am Wochenende gemacht haben. Schreiben Sie Ihren Beitrag. 50–60 Wörter.

  Schreiben Sie zu allen vier Punkten:
  • Was Sie am Samstag gemacht haben
  • Was Sie am Sonntag gemacht haben
  • Wen Sie getroffen oder besucht haben
  • Wie das Wochenende war — spannend, gemütlich oder anstrengend

  Benutzen Sie das Perfekt und mindestens zwei Zeitangaben.
model_answer: |
  Mein Wochenende war voll. Am Samstag habe ich lange ausgeschlafen und
  dann die Wohnung aufgeräumt. Am Nachmittag habe ich eingekauft und einen
  Kuchen gebacken. Am Abend sind zwei Freunde gekommen, und wir haben
  zusammen gekocht. Am Sonntag bin ich mit meinem Bruder an den See
  gefahren. Wir sind drei Stunden gewandert — sehr anstrengend, aber schön.
checklist:
  - 50–60 Wörter
  - Alle vier Punkte stehen im Text
  - Jeder Satz über das Wochenende steht im Perfekt
  - haben oder sein ist richtig gewählt (Bewegung → sein)
  - Das Partizip steht am Ende vom Satz
  - Bei trennbaren Verben steht ge- in der Mitte (aufgeräumt, eingekauft)
  - Mindestens zwei Zeitangaben kommen vor (am Samstag, gestern, vorgestern)
  - Mindestens acht Wörter aus dem Modul kommen vor
