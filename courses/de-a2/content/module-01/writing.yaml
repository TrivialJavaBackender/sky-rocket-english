mode: writing
genre: a post about your weekend
word_target: [50, 60]
prompt: |
  Everyone in your online language group posts on Monday about what
  they did at the weekend. Write your post. 50–60 words, in German.

  Cover all four points:
  • what you did on Saturday
  • what you did on Sunday
  • who you met or visited
  • how the weekend was — spannend, gemütlich or anstrengend

  Use the perfect tense and at least two time expressions.
model_answer: |
  Mein Wochenende war voll. Am Samstag habe ich lange ausgeschlafen und
  dann die Wohnung aufgeräumt. Am Nachmittag habe ich eingekauft und einen
  Kuchen gebacken. Am Abend sind zwei Freunde gekommen, und wir haben
  zusammen gekocht. Am Sonntag bin ich mit meinem Bruder an den See
  gefahren. Wir sind drei Stunden gewandert — sehr anstrengend, aber schön.
checklist:
  - 50–60 words
  - All four points are covered
  - Every sentence about the weekend is in the perfect tense
  - haben or sein is chosen correctly (movement → sein)
  - The participle stands at the end of its sentence
  - Separable verbs carry ge- in the middle (aufgeräumt, eingekauft)
  - At least two time expressions appear (am Samstag, gestern, vorgestern)
  - At least eight words from the module appear
