# Modul 01 · Mein Wochenende — 52 Aufgaben im Kern, 20 im Wiederholungspool.
# Verteilung laut Profil (courses/de-a2/PLAN.md §6): 6 mc_cloze · 8 open_cloze ·
# 6 word_formation · 4 key_word_transformation · 8 grammar_drill ·
# 6 error_correction · 8 collocation_match · 6 reading_comprehension.
#
# Kein spiralisches Wiederholen aus früheren Modulen: M1 ist das erste Modul des
# Kurses, und der Block Auffrischung zählt nicht (PLAN.md §1a). An seiner Stelle
# prüfen zwei Aufgaben das Eingangsniveau selbst — grammar_drill 6 (Präsens mit
# trennbarem Verb) und error_correction 6 (Akkusativ). Beides setzt der Kurs
# voraus; wer hier stolpert, sieht es in Woche 1 und nicht in Woche 9.
core:
  # ───────────────────────── Multiple Choice ─────────────────────────
  - type: mc_cloze
    group: grammar
    content:
      pre: "Am Samstag "
      post: " ich bis zehn Uhr geschlafen."
      options: [habe, bin, hat, bist]
      answer: 0
    explanation: "schlafen nimmt haben. ich + haben = habe."
  - type: mc_cloze
    group: grammar
    content:
      pre: "Nina "
      post: " mit dem Rad zum Markt gefahren."
      options: [hat, haben, ist, sind]
      answer: 2
    explanation: "fahren ist Bewegung von A nach B: Perfekt mit sein. Nina = sie, also ist."
  - type: mc_cloze
    group: grammar
    content:
      pre: "Wir haben am Abend zusammen "
      post: "."
      options: [kochen, kocht, gekochen, gekocht]
      answer: 3
    explanation: "kochen ist regelmäßig: ge- + Stamm + -t = gekocht."
  - type: mc_cloze
    group: grammar
    content:
      pre: "Meine Freunde "
      post: " um acht gekommen."
      options: [hat, sind, haben, ist]
      answer: 1
    explanation: "kommen nimmt sein. Meine Freunde sind mehrere Personen = sie, also sind."
  - type: mc_cloze
    group: grammar
    content:
      pre: "Habt ihr die Wohnung schon "
      post: "?"
      options: [geaufräumt, aufräumen, aufgeräumt, aufgeräumen]
      answer: 2
    explanation: "aufräumen ist trennbar: das ge- steht in der Mitte — auf-ge-räumt."
  - type: mc_cloze
    group: grammar
    content:
      pre: ""
      post: " du gestern im Konzert gewesen?"
      options: [Hast, Habt, Ist, Bist]
      answer: 3
    explanation: "sein bildet das Perfekt mit sein: du bist gewesen."

  # ───────────────────────── Lückentext ─────────────────────────
  - type: open_cloze
    group: grammar
    content:
      pre: "Am Sonntag "
      post: " wir einen Ausflug an den See gemacht."
      answers: [haben]
      answer_shown: haben
    explanation: "machen nimmt haben. wir + haben = haben."
  - type: open_cloze
    group: grammar
    content:
      pre: "Meine Schwester "
      post: " am Samstag zu mir gekommen."
      answers: [ist]
      answer_shown: ist
    explanation: "kommen ist Bewegung: Perfekt mit sein. sie + sein = ist."
  - type: open_cloze
    group: grammar
    content:
      pre: ""
      post: " du schon für die Woche eingekauft?"
      answers: [hast]
      answer_shown: Hast
    explanation: "einkaufen nimmt haben. du + haben = hast. Ohne Fragewort beginnt die Frage mit dem Verb."
  - type: open_cloze
    group: grammar
    content:
      pre: "Wir "
      post: " bis nach Mitternacht gefeiert."
      answers: [haben]
      answer_shown: haben
    explanation: "feiern nimmt haben — es ist keine Bewegung von A nach B."
  - type: open_cloze
    group: grammar
    content:
      pre: "Ich "
      post: " am Wochenende dreimal spazieren gegangen."
      answers: [bin]
      answer_shown: bin
    explanation: "gehen nimmt sein. ich + sein = bin."
  - type: open_cloze
    group: grammar
    content:
      pre: ""
      post: " ihr gestern Abend ferngesehen?"
      answers: [habt]
      answer_shown: Habt
    explanation: "fernsehen nimmt haben. ihr + haben = habt."
  - type: open_cloze
    group: grammar
    content:
      pre: "Die Kinder "
      post: " den ganzen Nachmittag draußen geblieben."
      answers: [sind]
      answer_shown: sind
    explanation: "bleiben nimmt sein, auch ohne Bewegung. Das lernt man auswendig: bleiben, sein, werden."
  - type: open_cloze
    group: grammar
    content:
      pre: "Er "
      post: " zur Party einen Kuchen mitgebracht."
      answers: [hat]
      answer_shown: hat
    explanation: "mitbringen nimmt haben. er + haben = hat."

  # ───────────────────────── Wortbildung ─────────────────────────
  - type: word_formation
    group: vocab
    content:
      pre: "Am Freitagabend haben wir zusammen "
      post: "."
      prompt: kochen
      answers: [gekocht]
      answer_shown: gekocht
    explanation: "Regelmäßig: ge- + Stamm + -t. kochen → gekocht."
  - type: word_formation
    group: vocab
    content:
      pre: "Am Sonntag sind wir drei Stunden "
      post: "."
      prompt: wandern
      answers: [gewandert]
      answer_shown: gewandert
    explanation: "Regelmäßig: ge- + Stamm + -t. wandern → gewandert."
  - type: word_formation
    group: vocab
    content:
      pre: "Sie hat zwanzig Leute zu ihrem Geburtstag "
      post: "."
      prompt: einladen
      answers: [eingeladen]
      answer_shown: eingeladen
    explanation: "Trennbar und unregelmäßig: ein-ge-laden."
  - type: word_formation
    group: vocab
    content:
      pre: "Am Samstag ist Nina mit dem Rad zum See "
      post: "."
      prompt: fahren
      answers: [gefahren]
      answer_shown: gefahren
    explanation: "Unregelmäßig: ge- + Stamm + -en. fahren → gefahren."
  - type: word_formation
    group: vocab
    content:
      pre: "Hast du dein Zimmer endlich "
      post: "?"
      prompt: aufräumen
      answers: [aufgeräumt]
      answer_shown: aufgeräumt
    explanation: "Trennbar: das ge- steht zwischen Vorsilbe und Stamm — auf-ge-räumt."
  - type: word_formation
    group: vocab
    content:
      pre: "Auf der Party haben alle viel Kuchen "
      post: "."
      prompt: essen
      answers: [gegessen]
      answer_shown: gegessen
    explanation: "Unregelmäßig: essen → gegessen. Diese Form lernt man auswendig."

  # ───────────────────────── Umformung ─────────────────────────
  - type: key_word_transformation
    group: grammar
    content:
      s1: Ich spiele am Samstag Fußball.
      key: GESTERN
      pre: "Gestern "
      post: " Fußball gespielt."
      answers: [habe ich]
      hint: 2 Wörter
      answer_shown: habe ich
    explanation: "Nach der Zeitangabe steht das Verb auf Position 2, dann das Subjekt: Gestern habe ich …"
  - type: key_word_transformation
    group: grammar
    content:
      s1: Wir fahren nach Berlin.
      key: LETZTE WOCHE
      pre: "Letzte Woche "
      post: " nach Berlin gefahren."
      answers: [sind wir]
      hint: 2 Wörter
      answer_shown: sind wir
    explanation: "fahren nimmt sein. Nach der Zeitangabe: sind wir."
  - type: key_word_transformation
    group: grammar
    content:
      s1: Sie räumt die Wohnung auf.
      key: PERFEKT
      pre: "Sie hat die Wohnung "
      post: "."
      answers: [aufgeräumt]
      hint: 1 Wort
      answer_shown: aufgeräumt
    explanation: "Im Perfekt wird aus auf … auf ein Wort: aufgeräumt, ganz am Ende."
  - type: key_word_transformation
    group: grammar
    content:
      s1: Besuchst du deine Eltern?
      key: PERFEKT
      pre: ""
      post: " du deine Eltern besucht?"
      answers: [hast]
      hint: 1 Wort
      answer_shown: Hast
    explanation: "besuchen nimmt haben. In der Frage steht es am Anfang: Hast du … besucht?"

  # ───────────────────────── Grammatik-Drill ─────────────────────────
  - type: grammar_drill
    group: grammar
    content:
      pre: "Wir "
      post: " am Wochenende einen Ausflug gemacht."
      prompt: HABEN ODER SEIN
      options: [haben, sind, ist, hat]
      answer: 0
    explanation: "machen nimmt haben. wir + haben = haben."
  - type: grammar_drill
    group: grammar
    content:
      pre: "Nina "
      post: " am Samstag um zehn aufgestanden."
      prompt: HABEN ODER SEIN
      options: [hat, haben, ist, sind]
      answer: 2
    explanation: "aufstehen nimmt sein — man bewegt sich von unten nach oben. sie + sein = ist."
  - type: grammar_drill
    group: grammar
    content:
      pre: "Ich habe für die Party einen Kuchen "
      post: "."
      prompt: BACKEN
      options: [gebackt, backte, gebacken, backen]
      answer: 2
    explanation: "backen ist unregelmäßig: ge- + Stamm + -en = gebacken."
  - type: grammar_drill
    group: grammar
    content:
      pre: "Am Freitag sind meine Freunde "
      post: "."
      prompt: KOMMEN
      options: [kommen, gekommen, gekommt, kamen]
      answer: 1
    explanation: "kommen ist unregelmäßig: gekommen. Mit sein, weil es Bewegung ist."
  - type: grammar_drill
    group: grammar
    content:
      pre: ""
      post: " ihr gestern spazieren gegangen?"
      prompt: HABEN ODER SEIN
      options: [Habt, Seid, Sind, Ist]
      answer: 1
    explanation: "gehen nimmt sein. ihr + sein = seid."
  - type: grammar_drill
    group: grammar
    content:
      pre: "Am Samstag "
      post: " Nina immer früh auf."
      prompt: AUFSTEHEN IM PRÄSENS
      options: [steht, stehen, steht auf, aufsteht]
      answer: 0
    explanation: "Trennbares Verb im Präsens: steht … auf. Die Vorsilbe auf steht schon am Ende."
  - type: grammar_drill
    group: grammar
    content:
      pre: "Ich "
      post: " vorgestern meine Oma besucht."
      prompt: HABEN ODER SEIN
      options: [bin, ist, hat, habe]
      answer: 3
    explanation: "besuchen nimmt haben — man besucht jemanden, das ist keine Bewegung von A nach B."
  - type: grammar_drill
    group: grammar
    content:
      pre: "Wir sind am Sonntag vier Stunden "
      post: "."
      prompt: WANDERN
      options: [gewandert, wandern, gewandern, wanderten]
      answer: 0
    explanation: "wandern ist regelmäßig: gewandert. Mit sein, weil es Bewegung ist."

  # ───────────────────────── Fehlersuche ─────────────────────────
  - type: error_correction
    group: grammar
    content:
      words: [Ich, habe, am, Sonntag, nach, Berlin, "gefahren."]
      wrong: 1
      correction: "habe → bin"
    explanation: "fahren ist Bewegung von A nach B und nimmt sein: Ich bin nach Berlin gefahren."
  - type: error_correction
    group: grammar
    content:
      words: [Am, Samstag, bin, ich, Fußball, "gespielt."]
      wrong: 2
      correction: "bin → habe"
    explanation: "spielen ist keine Bewegung von A nach B: Ich habe Fußball gespielt."
  - type: error_correction
    group: grammar
    content:
      words: [Wir, haben, gemacht, einen, "Ausflug."]
      wrong: 2
      correction: "gemacht einen Ausflug → einen Ausflug gemacht"
    explanation: "Das Partizip steht ganz am Ende. Dazwischen steht der Rest vom Satz."
  - type: error_correction
    group: grammar
    content:
      words: [Gestern, habe, ich, mit, Anna, "getelefoniert."]
      wrong: 5
      correction: "getelefoniert → telefoniert"
    explanation: "Verben auf -ieren bilden das Partizip ohne ge-: telefoniert, studiert, fotografiert."
  - type: error_correction
    group: grammar
    content:
      words: [Er, hat, sein, Zimmer, endlich, "geaufräumt."]
      wrong: 5
      correction: "geaufräumt → aufgeräumt"
    explanation: "Bei trennbaren Verben steht ge- in der Mitte: auf-ge-räumt, nicht ge-aufräumt."
  - type: error_correction
    group: grammar
    content:
      words: [Ich, habe, ein, Kuchen, "gebacken."]
      wrong: 2
      correction: "ein → einen"
    explanation: "backen braucht den Akkusativ. der Kuchen → einen Kuchen."

  # ───────────────────────── Wörter verbinden ─────────────────────────
  - type: collocation_match
    group: vocab
    content:
      left: [Sport, einen Ausflug, einen Kuchen, Freunde]
      right: [backen, treiben, einladen, machen]
      pairs: { 0: 1, 1: 3, 2: 0, 3: 2 }
    explanation: "Feste Verbindungen: Sport treiben, einen Ausflug machen, einen Kuchen backen, Freunde einladen."
  - type: collocation_match
    group: vocab
    content:
      left: [die Wohnung, ein Konzert, spazieren, fern]
      right: [sehen, aufräumen, gehen, besuchen]
      pairs: { 0: 1, 1: 3, 2: 2, 3: 0 }
    explanation: "die Wohnung aufräumen, ein Konzert besuchen, spazieren gehen, fernsehen."
  - type: collocation_match
    group: vocab
    content:
      left: [spannend, langweilig, anstrengend, gemütlich]
      right: [ohne Interesse, ruhig und angenehm, sehr interessant, man wird müde]
      pairs: { 0: 2, 1: 0, 2: 3, 3: 1 }
    explanation: "spannend und langweilig sind Gegenteile. anstrengend kostet Kraft, gemütlich ist das Gegenteil von Eile."
  - type: collocation_match
    group: vocab
    content:
      left: [vorgestern, neulich, endlich, übrigens]
      right: [nach langem Warten, vor kurzer Zeit, ein neues Thema, der Tag vor gestern]
      pairs: { 0: 3, 1: 1, 2: 0, 3: 2 }
    explanation: "vorgestern ist ein Tag, neulich eine kurze Zeit davor, endlich zeigt Freude, übrigens beginnt ein neues Thema."
  - type: collocation_match
    group: grammar
    content:
      left: [gekocht, gefahren, aufgeräumt, eingeladen]
      right: [einladen, kochen, aufräumen, fahren]
      pairs: { 0: 1, 1: 3, 2: 2, 3: 0 }
    explanation: "Vom Partizip zurück zum Infinitiv: gekocht → kochen, gefahren → fahren, aufgeräumt → aufräumen, eingeladen → einladen."
  - type: collocation_match
    group: grammar
    content:
      left: [ich, du, wir, ihr]
      right: [seid, bin, sind, bist]
      pairs: { 0: 1, 1: 3, 2: 2, 3: 0 }
    explanation: "sein im Perfekt: ich bin gefahren, du bist gefahren, wir sind gefahren, ihr seid gefahren."
  - type: collocation_match
    group: vocab
    content:
      left: [einkaufen, ausschlafen, mitbringen, feiern]
      right: [ein Fest machen, im Geschäft kaufen, etwas zu jemandem bringen, sehr lange schlafen]
      pairs: { 0: 1, 1: 3, 2: 2, 3: 0 }
    explanation: "Vier Verben für das Wochenende — jedes mit seiner Umschreibung."
  - type: collocation_match
    group: vocab
    content:
      left: [draußen, zusammen, das Wochenende, die Freizeit]
      right: [Samstag und Sonntag, nicht allein, nicht im Haus, die Zeit ohne Arbeit]
      pairs: { 0: 2, 1: 1, 2: 0, 3: 3 }
    explanation: "draußen ist das Gegenteil von drinnen, zusammen von allein."

  # ───────────────────────── Leseverstehen ─────────────────────────
  - type: reading_comprehension
    group: reading
    content:
      passage: "Am Freitagabend ist Nina früh nach Hause gekommen und hat zuerst die Wohnung aufgeräumt. „Das klingt langweilig“, sagt sie und lacht, „aber so habe ich danach zwei freie Tage gehabt.“"
      q: Warum hat Nina am Freitag aufgeräumt?
      options:
        - Ihre Schwester ist zu Besuch gekommen.
        - So hat sie danach zwei freie Tage.
        - Sie findet Aufräumen schön.
        - Am Freitag hat sie nicht gearbeitet.
      answer: 1
    explanation: "Im Text steht: so habe ich danach zwei freie Tage gehabt. Die Freunde kommen erst am Samstag."
  - type: reading_comprehension
    group: reading
    content:
      passage: "Am Samstag hat Nina ausgeschlafen. Um zehn ist sie aufgestanden, hat gefrühstückt und ist mit dem Rad zum Markt gefahren. Dort hat sie für die ganze Woche eingekauft: Obst, Gemüse, Brot."
      q: Wie ist Nina zum Markt gekommen?
      options:
        - Mit dem Rad
        - Mit dem Bus
        - Zu Fuß
        - Mit dem Auto
      answer: 0
    explanation: "Im Text steht: ist sie mit dem Rad zum Markt gefahren."
  - type: reading_comprehension
    group: reading
    content:
      passage: "Am Nachmittag hat sie einen Kuchen gebacken, denn am Abend sind Freunde gekommen. Sie hat die Leute schon am Mittwoch eingeladen. Alle haben etwas mitgebracht — Salat, Wein, Musik. Sie haben zusammen gekocht, gegessen und bis nach Mitternacht geredet."
      q: Was haben die Gäste gemacht?
      options:
        - Sie sind früh gegangen.
        - Sie haben nur zugehört.
        - Sie haben etwas mitgebracht.
        - Sie haben den Kuchen gebacken.
      answer: 2
    explanation: "Im Text steht: Alle haben etwas mitgebracht. Den Kuchen hat Nina gebacken."
  - type: reading_comprehension
    group: reading
    content:
      passage: "Mit ihrer Schwester hat sie sich am Bahnhof getroffen, und die beiden sind an den See gefahren. Dort haben sie einen Ausflug gemacht und sind drei Stunden gewandert. Nina findet Wandern spannend, ihre Schwester findet es anstrengend."
      q: Wie finden die beiden das Wandern?
      options:
        - Beide finden es spannend.
        - Beide finden es anstrengend.
        - Nina findet es anstrengend, die Schwester spannend.
        - Nina findet es spannend, die Schwester anstrengend.
      answer: 3
    explanation: "Im Text steht: Nina findet Wandern spannend, ihre Schwester findet es anstrengend."
  - type: reading_comprehension
    group: reading
    content:
      passage: "Am Abend hat Nina nur noch ferngesehen. Übrigens: Neulich hat sie ein neues Hobby gefunden. Sie treibt jetzt zweimal pro Woche Sport — sie geht schwimmen. Am Sonntag hat sie das nicht gemacht. „Einmal Pause ist auch Freizeit.“"
      q: Was ist Ninas neues Hobby?
      options:
        - Fernsehen
        - Schwimmen
        - Wandern
        - Backen
      answer: 1
    explanation: "Im Text steht: Sie treibt jetzt zweimal pro Woche Sport — sie geht schwimmen."
  - type: reading_comprehension
    group: reading
    content:
      passage: "Am Sonntag hat die Sonne geschienen, und Nina ist keine Minute drinnen geblieben. Den ganzen Nachmittag sind sie draußen geblieben. Am Abend hat Nina nur noch ferngesehen."
      q: Wo war Nina am Sonntagnachmittag?
      options:
        - Zu Hause vor dem Fernseher
        - Im Konzert
        - Draußen
        - Auf dem Markt
      answer: 2
    explanation: "Im Text steht: Den ganzen Nachmittag sind sie draußen geblieben. Ferngesehen hat sie erst am Abend."

