# Modul 01 · Mein Wochenende — 30 Wörter zu Freizeit, Wochenende und Treffen.
# `definition` ist eine einfache Umschreibung auf A2 plus Synonym oder Gegenteil —
# kein Wörterbuchstil (courses/de-a2/PLAN.md §5).
# Bei jedem Verb steht das Partizip im `register`: es ist der Stoff des Moduls.
entries:
  - term: das Wochenende
    tag: Nomen
    definition: Samstag und Sonntag. An diesen Tagen arbeiten die meisten Menschen nicht.
    use_cases:
      - Am Wochenende bleibe ich gern zu Hause.
      - Was hast du am Wochenende gemacht?
    collocations: am Wochenende · das lange Wochenende · schönes Wochenende!
    register: "Plural: die Wochenenden"

  - term: die Freizeit
    tag: Nomen
    definition: Die Zeit ohne Arbeit und ohne Schule. Man macht, was man will.
    use_cases:
      - In meiner Freizeit koche ich gern.
      - Ich habe wenig Freizeit.
    collocations: in der Freizeit · viel Freizeit haben · die Freizeit genießen
    register: "Nur Singular."

  - term: das Hobby
    tag: Nomen
    definition: Eine Sache, die man in der Freizeit regelmäßig und gern macht.
    use_cases:
      - Mein Hobby ist Fotografieren.
      - Hast du ein neues Hobby gefunden?
    collocations: ein Hobby haben · mein größtes Hobby
    register: "Plural: die Hobbys"

  - term: Sport treiben
    tag: Verb
    definition: Sich regelmäßig bewegen — laufen, schwimmen, Fußball spielen.
    use_cases:
      - Ich treibe dreimal pro Woche Sport.
      - Früher hat er viel Sport getrieben.
    collocations: viel Sport treiben · regelmäßig Sport treiben
    register: "Partizip: getrieben. Auch: Sport machen."

  - term: sich treffen
    tag: Verb
    definition: Zusammenkommen. Zwei oder mehr Personen sind am gleichen Ort.
    use_cases:
      - Wir treffen uns um acht am Bahnhof.
      - Gestern haben wir uns im Café getroffen.
    collocations: sich mit Freunden treffen · sich am Bahnhof treffen
    register: "Immer mit mich, dich, uns: Ich treffe mich, wir treffen uns. Partizip: getroffen."

  - term: das Konzert
    tag: Nomen
    definition: Eine Veranstaltung mit Musik. Man hört zu, die Musiker spielen.
    use_cases:
      - Am Freitag waren wir im Konzert.
      - Das Konzert hat zwei Stunden gedauert.
    collocations: ins Konzert gehen · ein Konzert besuchen · das Konzert beginnt
    register: "Plural: die Konzerte"

  - term: der Ausflug
    tag: Nomen
    definition: Eine kurze Reise für einen Tag. Man fährt weg und kommt zurück.
    use_cases:
      - Am Sonntag haben wir einen Ausflug an den See gemacht.
      - Der Ausflug war leider sehr kurz.
    collocations: einen Ausflug machen · der Tagesausflug
    register: "Plural: die Ausflüge"

  - term: wandern
    tag: Verb
    definition: Lange in der Natur zu Fuß gehen, meistens in den Bergen.
    use_cases:
      - Wir wandern jeden Sommer in den Alpen.
      - Am Sonntag sind wir vier Stunden gewandert.
    collocations: in den Bergen wandern · wandern gehen
    register: "Partizip: gewandert, mit sein: Ich bin gewandert."

  - term: Rad fahren
    tag: Verb
    definition: Mit dem Fahrrad fahren.
    use_cases:
      - Ich fahre jeden Tag Rad.
      - Sie ist zum Markt Rad gefahren.
    collocations: Rad fahren gehen · gern Rad fahren
    register: "Partizip: gefahren, mit sein. Auch: Fahrrad fahren."

  - term: spazieren gehen
    tag: Verb
    definition: Langsam gehen, ohne Ziel, nur zum Vergnügen.
    use_cases:
      - Nach dem Essen gehen wir immer spazieren.
      - Gestern bin ich zwei Stunden spazieren gegangen.
    collocations: im Park spazieren gehen · mit dem Hund spazieren gehen
    register: "Partizip: spazieren gegangen, mit sein."

  - term: fernsehen
    tag: Verb
    definition: Filme oder Sendungen am Fernseher ansehen.
    use_cases:
      - Abends sehe ich eine Stunde fern.
      - Am Sonntag haben wir den ganzen Tag ferngesehen.
    collocations: viel fernsehen · abends fernsehen
    register: "Trennbar: Ich sehe fern. Partizip: ferngesehen."

  - term: besuchen
    tag: Verb
    definition: Zu einer Person oder an einen Ort gehen und dort bleiben.
    use_cases:
      - Ich besuche meine Oma jeden Monat.
      - Wir haben am Samstag ein Museum besucht.
    collocations: Freunde besuchen · einen Kurs besuchen · eine Stadt besuchen
    register: "Partizip: besucht, ohne ge-."

  - term: einladen
    tag: Verb
    definition: "Zu jemandem sagen: Komm zu mir!"
    use_cases:
      - Ich lade dich zu meiner Party ein.
      - Sie hat zwanzig Leute eingeladen.
    collocations: zum Essen einladen · Freunde einladen
    register: "Trennbar: Ich lade ein. Partizip: eingeladen."

  - term: mitbringen
    tag: Verb
    definition: Etwas dabeihaben, wenn man zu einer Person kommt.
    use_cases:
      - Bringst du etwas zu trinken mit?
      - Alle haben Kuchen mitgebracht.
    collocations: ein Geschenk mitbringen · etwas zu essen mitbringen
    register: "Trennbar: Ich bringe mit. Partizip: mitgebracht."

  - term: feiern
    tag: Verb
    definition: Ein Fest machen — mit Musik, Essen und Gästen.
    use_cases:
      - Wir feiern am Samstag seinen Geburtstag.
      - Sie haben bis drei Uhr gefeiert.
    collocations: Geburtstag feiern · zusammen feiern · die Feier
    register: "Partizip: gefeiert."

  - term: kochen
    tag: Verb
    definition: Essen warm machen. Man braucht einen Topf und einen Herd.
    use_cases:
      - Am Wochenende koche ich für die ganze Familie.
      - Wir haben zusammen Suppe gekocht.
    collocations: Suppe kochen · gern kochen · Kaffee kochen
    register: "Partizip: gekocht."

  - term: backen
    tag: Verb
    definition: Kuchen oder Brot im Ofen machen.
    use_cases:
      - Meine Mutter backt jeden Sonntag einen Kuchen.
      - Ich habe für die Party Brot gebacken.
    collocations: einen Kuchen backen · Brot backen
    register: "Unregelmäßig. Partizip: gebacken."

  - term: aufräumen
    tag: Verb
    definition: Alles wieder an seinen Platz stellen. Danach ist die Wohnung ordentlich.
    use_cases:
      - Ich räume jeden Freitag die Küche auf.
      - Hast du dein Zimmer schon aufgeräumt?
    collocations: das Zimmer aufräumen · die Wohnung aufräumen
    register: "Trennbar: Ich räume auf. Partizip: aufgeräumt."

  - term: einkaufen
    tag: Verb
    definition: Im Geschäft Sachen für zu Hause kaufen.
    use_cases:
      - Am Samstag kaufe ich für die ganze Woche ein.
      - Wir haben auf dem Markt eingekauft.
    collocations: einkaufen gehen · im Supermarkt einkaufen
    register: "Trennbar: Ich kaufe ein. Partizip: eingekauft."

  - term: ausschlafen
    tag: Verb
    definition: So lange schlafen, wie man will. Kein Wecker am Morgen.
    use_cases:
      - Am Sonntag schlafe ich immer aus.
      - Endlich habe ich einmal ausgeschlafen.
    collocations: am Wochenende ausschlafen · endlich ausschlafen
    register: "Trennbar: Ich schlafe aus. Partizip: ausgeschlafen."

  - term: spannend
    tag: Adjektiv
    definition: "Sehr interessant. Man will unbedingt wissen, wie es weitergeht. Gegenteil: langweilig."
    use_cases:
      - Der Film war wirklich spannend.
      - Ich finde Wandern spannend, meine Schwester nicht.
    collocations: ein spannendes Buch · spannend finden
    register: "Gegenteil: langweilig"

  - term: langweilig
    tag: Adjektiv
    definition: "Ohne Interesse. Man wartet nur, bis es zu Ende ist. Gegenteil: spannend."
    use_cases:
      - Das Konzert war leider ziemlich langweilig.
      - Mir ist langweilig.
    collocations: langweilig sein · langweilig finden
    register: "Gegenteil: spannend"

  - term: anstrengend
    tag: Adjektiv
    definition: Man braucht viel Kraft. Danach ist man müde.
    use_cases:
      - Die Wanderung war schön, aber anstrengend.
      - Ich hatte eine anstrengende Woche.
    collocations: anstrengend sein · körperlich anstrengend
    register: "Gegenteil: leicht, entspannend"

  - term: gemütlich
    tag: Adjektiv
    definition: Ruhig und angenehm. Man fühlt sich wohl und hat keine Eile.
    use_cases:
      - Wir hatten einen gemütlichen Abend zu Hause.
      - Das Café ist klein und sehr gemütlich.
    collocations: ein gemütlicher Abend · es sich gemütlich machen
    register: "Sehr deutsches Wort — es beschreibt Wohnungen und Abende."

  - term: draußen
    tag: Adverb
    definition: "Nicht im Haus, sondern an der frischen Luft. Gegenteil: drinnen."
    use_cases:
      - Bei gutem Wetter essen wir draußen.
      - Die Kinder sind den ganzen Tag draußen geblieben.
    collocations: draußen sein · draußen bleiben · draußen sitzen
    register: "Gegenteil: drinnen"

  - term: zusammen
    tag: Adverb
    definition: Nicht allein, sondern mit anderen Personen.
    use_cases:
      - Wir haben zusammen gekocht.
      - Gehen wir zusammen ins Kino?
    collocations: zusammen essen · zusammen wohnen · alle zusammen
    register: "Gegenteil: allein"

  - term: vorgestern
    tag: Adverb
    definition: Der Tag vor gestern. Heute ist Freitag, also war vorgestern Mittwoch.
    use_cases:
      - Vorgestern bin ich früh ins Bett gegangen.
      - Wir haben uns vorgestern getroffen.
    collocations: vorgestern Abend · erst vorgestern
    register: "Reihe: vorgestern — gestern — heute — morgen"

  - term: neulich
    tag: Adverb
    definition: Vor kurzer Zeit, aber nicht heute und nicht gestern.
    use_cases:
      - Neulich habe ich deinen Bruder in der Stadt gesehen.
      - Wir waren neulich in einem sehr guten Restaurant.
    collocations: neulich erst · erzählen, was neulich passiert ist
    register: "Man sagt es, wenn man eine Geschichte beginnt."

  - term: endlich
    tag: Adverb
    definition: Nach langem Warten. Man hat sich darauf gefreut.
    use_cases:
      - Endlich ist das Wochenende da!
      - Wir haben endlich unsere Wohnung aufgeräumt.
    collocations: endlich fertig · na endlich!
    register: "Zeigt Freude oder Erleichterung."

  - term: übrigens
    tag: Adverb
    definition: Man sagt es, wenn man ein neues Thema beginnt.
    use_cases:
      - Übrigens, hast du am Samstag Zeit?
      - Das Essen war übrigens sehr gut.
    collocations: übrigens am Anfang oder in der Mitte vom Satz
    register: "Neutral, sehr häufig im Gespräch."
