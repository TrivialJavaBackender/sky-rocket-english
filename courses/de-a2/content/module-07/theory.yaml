# Modul 07 · Wohnungssuche — theory. Two spotlights, 8 items realising the six
# grammar points of the module card (courses/de-a2/PLAN.md §4).
#
# Module 06 covered the endings after der, das, die. This module adds the other
# two patterns: after ein, kein, mein, and with no article at all — plus the
# dative, where all three collapse into one ending.
#
# Scaffolding rule (§5, revised 2026-07): title, intro, form and note in English,
# every example and table in German. Adjective endings: courses/_reference/
# basic-german/ unit 25.
spotlights:
- title: The adjective after ein, kein, mein and with no article
  intro: >-
    Module 06 gave you the easy pattern: after der, das and die the adjective
    only ever takes -e or -en, because the article has already shown the gender.
    Take the article away, or replace it with ein, and the adjective has to do
    that job itself. That is why ein schöner Balkon carries -er where der schöne
    Balkon carries -e — the -er is the signal that der would have given. Read
    the two tables side by side and the logic becomes visible: the ending simply
    moves from the article to the adjective.
  items:
  - form: "After ein, kein, mein in the nominative"
    example: Das ist ein schöner Balkon.
    note: "The article ending moves onto the adjective: der → -er, das → -es, die → -e."
    table:
      headers:
      - Genus
      - Endung
      - Beispiel
      rows:
      - - der (maskulin)
        - -er
        - ein schöner Balkon
      - - das (neutral)
        - -es
        - ein helles Zimmer
      - - die (feminin)
        - -e
        - eine ruhige Straße
  - form: "After ein, kein, mein in the accusative"
    example: Ich suche einen hellen Raum.
    note: "Only the masculine moves: ein becomes einen and -er becomes -en. The other two are unchanged."
    table:
      headers:
      - Genus
      - Akkusativ
      - Beispiel
      rows:
      - - der (maskulin)
        - einen ...-en
        - Ich suche einen hellen Raum.
      - - das (neutral)
        - ein ...-es
        - Ich suche ein möbliertes Zimmer.
      - - die (feminin)
        - eine ...-e
        - Ich suche eine ruhige Wohnung.
  - form: "With no article at all"
    example: Helles Zimmer, ruhige Lage, niedrige Nebenkosten.
    note: "With nothing in front, the adjective carries the whole signal: -er, -es, -e. This is the language of small ads."
    table:
      headers:
      - Genus
      - Endung
      - Beispiel
      rows:
      - - der (maskulin)
        - -er
        - guter Preis
      - - das (neutral)
        - -es
        - helles Zimmer
      - - die (feminin)
        - -e
        - ruhige Lage
      - - Plural
        - -e
        - niedrige Nebenkosten
  - form: "der or ein — the same adjective, two endings"
    example: Der schöne Balkon gefällt mir. Das ist ein schöner Balkon.
    note: One rule explains both columns — the gender has to be visible once, either on the article or on the adjective.
    table:
      headers:
      - Genus
      - nach der, das, die
      - nach ein, kein, mein
      rows:
      - - der (maskulin)
        - der schöne Balkon
        - ein schöner Balkon
      - - das (neutral)
        - das helle Zimmer
        - ein helles Zimmer
      - - die (feminin)
        - die ruhige Lage
        - eine ruhige Lage
- title: The adjective in the dative, and the whole picture
  intro: >-
    The dative is the easy part of the system. Whatever stands in front of the
    adjective and whatever the gender is, the ending is -en — masculine,
    feminine, neuter and plural alike. One ending, no exceptions, nothing to
    weigh up. The last item of this spotlight puts all three patterns on one
    page; it is the table to come back to whenever an ending feels uncertain.
  items:
  - form: "In the dative after dem or einem: always -en"
    example: Wir wohnen in einem großen Haus.
    note: "der, das or die — in the dative it makes no difference. The ending is -en every time."
    table:
      headers:
      - Genus
      - Dativ
      - Beispiel
      rows:
      - - der (maskulin)
        - dem / einem ...-en
        - mit einem schönen Balkon
      - - das (neutral)
        - dem / einem ...-en
        - in einem großen Haus
      - - die (feminin)
        - der / einer ...-en
        - mit einer schönen Küche
  - form: "The dative plural: -en as well"
    example: Am Stadtrand wohnt man in ruhigen Straßen.
    note: There is no ein in the plural, so nothing stands in front — and the adjective still ends in -en.
    table:
      headers:
      - Nomen
      - Dativ Plural
      - Beispiel
      rows:
      - - die Straßen
        - -en
        - in ruhigen Straßen
      - - die Kosten
        - -en
        - mit hohen Nebenkosten
  - form: How to read a flat advert
    example: "Helle 2-Zimmer-Wohnung, ruhige Lage, mit großem Balkon, provisionsfrei."
    note: Small ads drop the article to save space, so nearly every adjective there carries the full signal. Learning to read them is half of flat-hunting.
    table:
      headers:
      - In der Anzeige
      - Ganzer Satz
      rows:
      - - helle Wohnung
        - Die Wohnung ist hell.
      - - ruhige Lage
        - Die Wohnung hat eine ruhige Lage.
      - - mit großem Balkon
        - Die Wohnung hat einen großen Balkon.
      - - niedrige Nebenkosten
        - Die Nebenkosten sind niedrig.
  - form: "All three patterns on one page"
    example: ein schöner Balkon, einen schönen Balkon, mit einem schönen Balkon.
    note: Read it downwards and the pattern is simple — everything drifts towards -en as you move from nominative to dative.
    table:
      headers:
      - Kasus
      - der (m)
      - das (n)
      - die (f)
      - Plural
      rows:
      - - Nominativ
        - -er
        - -es
        - -e
        - -en
      - - Akkusativ
        - -en
        - -es
        - -e
        - -en
      - - Dativ
        - -en
        - -en
        - -en
        - -en
watchouts:
- title: ein schöner, ein schönes, eine schöne
  bad: Das ist ein schöne Balkon.
  good: Das ist ein schöner Balkon.
  note: "der Balkon is masculine, so it is ein schöner Balkon. A das-noun takes -es, a die-noun -e."
- title: The dative is always -en
  bad: Wir wohnen in einem groß Haus.
  good: Wir wohnen in einem großen Haus.
  note: In the dative the adjective ends in -en, whatever the gender and whatever stands in front of it.
- title: helles Zimmer, not hell Zimmer
  bad: 'Zu vermieten: hell Zimmer mit Balkon.'
  good: 'Zu vermieten: helles Zimmer mit Balkon.'
  note: "With no article the adjective carries the signal itself: helles Zimmer."
- title: einen hellen Raum
  bad: Ich suche ein hellen Raum.
  good: Ich suche einen hellen Raum.
  note: "der Raum in the accusative is einen, and the adjective follows with -en: einen hellen Raum."
cloze_cards:
- text: Das ist ein {{c1::schöner}} Balkon mit viel Sonne.
  hint: schön
  rule: "der Balkon is masculine. After ein the ending is -er: ein schöner Balkon."
- text: 'In der Anzeige steht: ein {{c1::helles}} Zimmer im Zentrum.'
  hint: hell
  rule: "das Zimmer is neuter. After ein the ending is -es: ein helles Zimmer."
- text: Ich suche einen {{c1::hellen}} Raum für mein Büro.
  hint: hell
  rule: "der Raum is masculine accusative. After einen the ending is -en: einen hellen Raum."
- text: Wir möchten eine {{c1::ruhige}} Wohnung mieten.
  hint: ruhig
  rule: "die Wohnung is feminine. After eine the ending is -e: eine ruhige Wohnung."
- text: Die Anzeige verspricht {{c1::niedrige}} Nebenkosten.
  hint: niedrig
  rule: "With no article the plural ending is -e: niedrige Nebenkosten."
- text: Die Wohnung kommt mit einem {{c1::schönen}} Balkon.
  hint: schön
  rule: "In the dative the ending is always -en: mit einem schönen Balkon."
- text: Wir wohnen jetzt in einem {{c1::großen}} Haus am Stadtrand.
  hint: groß
  rule: "In the dative the ending is always -en: in einem großen Haus."
- text: 'Zu vermieten: {{c1::möbliertes}} Zimmer, ruhige Lage.'
  hint: möbliert
  rule: "With no article the adjective carries the signal: möbliertes Zimmer."
