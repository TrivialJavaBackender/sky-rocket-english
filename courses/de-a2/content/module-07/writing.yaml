# Modul 07 · Wohnungssuche — writing task: an email to the landlord.
# The real A2 format (Goethe/telc letter): a short email, 50 to 60 words, four
# given points, an opening and a closing. The learner asks the landlord about
# rent, service charges, furniture and a viewing — exactly the nachfragen of the
# standfirst. The model uses this module's target forms (eine ruhige Wohnung,
# mit freundlichen Grüßen) and no grammar from later modules.
mode: writing
genre: an email to a landlord with questions
word_target:
- 50
- 60
prompt: |
  You have read a flat advert in the paper and the flat looks interesting. Write an email to the landlord, Herr Kraus, in German. Write 50 to 60 words.

  Cover all four points:
  - say which advert you read
  - ask about the rent and the service charges
  - ask whether the flat is furnished
  - ask for an appointment to view it

  Do not forget the opening and the closing.
model_answer: |
  Sehr geehrter Herr Kraus,

  ich habe Ihre Anzeige für die Zwei-Zimmer-Wohnung am Stadtrand gelesen. Die Wohnung gefällt mir sehr. Wie hoch ist die Kaltmiete, und wie hoch sind die Nebenkosten? Ist die Wohnung möbliert oder leer? Ich möchte die Wohnung gern besichtigen. Wann haben Sie Zeit für einen Termin?

  Mit freundlichen Grüßen
  Anna Weber
checklist:
- Opening (Sehr geehrter Herr Kraus) and closing (Mit freundlichen Grüßen) are there
- 50 to 60 words
- 'All four points are covered: the advert, rent and service charges, furnished, a viewing'
- 'The questions carry a question mark: Wie hoch ist die Miete? Ist die Wohnung möbliert?'
- 'The adjectives end correctly: eine ruhige Wohnung, mit freundlichen Grüßen'
