# Modul 07 · Wohnungssuche — 52 Aufgaben im Kern, 20 im Wiederholungspool.
# Verteilung laut Profil (courses/de-a2/PLAN.md §6): 6 mc_cloze · 8 open_cloze ·
# 6 word_formation · 4 key_word_transformation · 8 grammar_drill ·
# 6 error_correction · 8 collocation_match · 6 reading_comprehension.
# Wiederholungspool: 4 mc_cloze · 6 open_cloze · 4 grammar_drill · 3 error_correction ·
# 1 word_formation · 1 collocation_match · 1 key_word_transformation.
#
# Thema des Moduls ist die Endung des Adjektivs nach ein-/kein-/mein-, ohne
# Artikel und im Dativ. Jede Aufgabe prüft nur eine Sache: entweder die Endung
# des Adjektivs bei fertigem Artikel oder den Artikel bei fertiger Endung.
# Der Dativ hat im ganzen Modul die Endung -en (in einem großen Haus, mit einer
# schönen Küche) — die schwierige Form ohne Artikel im Dativ (gutem, ruhiger)
# wird nicht verlangt.
#
# Spiralisches Wiederholen: open_cloze 7 und grammar_drill 7 nehmen das Adjektiv
# nach der/das/die aus Modul 06, open_cloze 8 das Präteritum hatten aus Modul 05,
# grammar_drill 8 die Frage Wo? mit Dativ aus Modul 03, error_correction 5 das
# Perfekt mit sein aus Modul 01, error_correction 6 die Präposition mit + Dativ
# aus Modul 02. word_formation 6 bildet das -ung aus Modul 02 (die Besichtigung).
# Im Pool: open_cloze 5 wieder mit + Dativ (Modul 02), grammar_drill 4 der/das/die
# (Modul 06), error_correction 3 das Perfekt mit sein (Modul 01).
