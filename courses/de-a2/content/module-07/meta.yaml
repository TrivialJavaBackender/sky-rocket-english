slug: m07
title: Wohnungssuche
standfirst: Adjective endings after ein- and with no article · 30 words · question a landlord.
goals:
- text: Understand and use 30 words about ads, rent and location
  achieved_by: input
- text: 'End the adjective correctly after ein, kein, mein: ein schöner Balkon, einen hellen Raum'
  achieved_by: workout
- text: 'End the adjective correctly with no article and in the dative: helles Zimmer, in einem großen Haus'
  achieved_by: workout
- text: Write an email to a landlord with four questions
  achieved_by: output
grammar_points:
- The adjective after ein, kein, mein in the nominative (ein schöner Balkon, ein helles Zimmer, eine ruhige Straße)
- The adjective after ein, kein, mein in the accusative (einen hellen Raum, ein möbliertes Zimmer, eine ruhige Wohnung)
- The adjective with no article, nominative and accusative (helles Zimmer, ruhige Lage, niedrige Nebenkosten)
- The adjective in the dative after dem and einem (in einem großen Haus, mit einem schönen Balkon)
- The adjective in the dative plural (in ruhigen Straßen, mit hohen Nebenkosten)
- 'At a glance: adjective endings after ein, kein, mein in the nominative, accusative and dative'
production:
  mode: writing
  genre: an email to a landlord with questions
