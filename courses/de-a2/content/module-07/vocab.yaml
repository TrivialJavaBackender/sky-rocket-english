# Modul 07 · Wohnungssuche — 30 Wörter zu Anzeige, Miete und Wohnlage.
# Kein Wort aus Modul 01 bis 06: eine Vokabel gehört genau einem Modul
# (PLAN.md §4). Deshalb stehen die Wohnung, das Zimmer oder umziehen hier nicht
# noch einmal — sie kommen in den Texten und Aufgaben trotzdem vor. Der Anker
# hell steht schon in Modul 03; an seiner Stelle stehen andere Wörter der Anzeige.
#
# Bei jedem Nomen nennt `register` den Plural, bei jedem Verb das Partizip II,
# dazu ein kurzer Hinweis zur Herkunft des Wortes. Die zusammengesetzten Nomen
# (Nebenkosten, Kaltmiete, Warmmiete, Mietvertrag, Erdgeschoss, Wohnfläche,
# Altbau, Neubau) zeigen im `register` ihre zwei Teile — das übt das Modul auch
# in word_formation.
#
# Gegensatzpaare helfen beim Lernen: Kaltmiete — Warmmiete, Altbau — Neubau,
# Mieter — Vermieter, zentral — Stadtrand, möbliert — leer, ruhig — laut.
entries:
- term: die Miete
  tag: Nomen
  definition: Das Geld, das man jeden Monat für die Wohnung zahlt.
  use_cases:
  - Die Miete für die Wohnung ist ziemlich hoch.
  - Ich zahle die Miete immer am Anfang vom Monat.
  collocations: die Miete zahlen · die hohe Miete · die Miete überweisen
  register: 'Plural: die Mieten. Vom Verb mieten: für Geld benutzen.'
- term: die Nebenkosten
  tag: Nomen
  definition: 'Das extra Geld neben der Miete: für Wasser, Strom und Heizung.'
  use_cases:
  - Zur Miete kommen noch die Nebenkosten für Wasser und Heizung.
  - Die Nebenkosten sind in dieser Wohnung sehr niedrig.
  collocations: hohe Nebenkosten · niedrige Nebenkosten · die Nebenkosten zahlen
  register: Nur im Plural. Aus neben + die Kosten.
- term: der Mietvertrag
  tag: Nomen
  definition: Das Papier zwischen Mieter und Vermieter. Man unterschreibt es vor dem Einzug.
  use_cases:
  - Vor dem Einzug unterschreiben wir den Mietvertrag.
  - Im Mietvertrag steht, wie hoch die Miete ist.
  collocations: den Mietvertrag unterschreiben · den Mietvertrag lesen
  register: 'Plural: die Mietverträge. Aus Miete + Vertrag.'
- term: besichtigen
  tag: Verb
  definition: Eine Wohnung genau ansehen, bevor man sie mietet.
  use_cases:
  - Am Samstag besichtigen wir eine Wohnung am Stadtrand.
  - Ich möchte die Wohnung zuerst besichtigen, dann entscheide ich.
  collocations: eine Wohnung besichtigen · ein Haus besichtigen
  register: 'Partizip II: besichtigt. Von die Sicht (das Sehen).'
- term: möbliert
  tag: Adjektiv
  definition: 'Mit Möbeln. In der Wohnung stehen schon Bett, Tisch und Schrank. Gegenteil: leer.'
  use_cases:
  - Das Zimmer ist möbliert, ein Bett und ein Schrank sind schon da.
  - Wir suchen eine möblierte Wohnung für ein Jahr.
  collocations: ein möbliertes Zimmer · eine möblierte Wohnung
  register: 'Vom Verb möblieren: mit Möbeln füllen.'
- term: ruhig
  tag: Adjektiv
  definition: 'Ohne Lärm. Hier ist es still. Gegenteil: laut.'
  use_cases:
  - Die Wohnung liegt in einer ruhigen Straße.
  - Hier ist es sehr ruhig, es gibt keinen Lärm.
  collocations: eine ruhige Lage · eine ruhige Straße · ganz ruhig
  register: 'Aus die Ruhe + -ig. Gegenteil: laut.'
- term: der Stadtrand
  tag: Nomen
  definition: 'Der Rand der Stadt, weit weg vom Zentrum. Gegenteil: das Zentrum.'
  use_cases:
  - Wir wohnen am Stadtrand, weit weg vom Zentrum.
  - Am Stadtrand ist es ruhig und grün.
  collocations: am Stadtrand wohnen · der ruhige Stadtrand
  register: 'Plural: die Stadtränder. Aus die Stadt + der Rand.'
- term: die Umgebung
  tag: Nomen
  definition: 'Alles rund um die Wohnung: die Straßen, die Geschäfte, der Park.'
  use_cases:
  - Die Umgebung ist schön, es gibt einen Park und viele Bäume.
  - In der Umgebung findet man Geschäfte und eine Schule.
  collocations: eine ruhige Umgebung · die grüne Umgebung
  register: 'Plural: die Umgebungen. Vom Verb umgeben.'
- term: der Vermieter
  tag: Nomen
  definition: 'Die Person, der die Wohnung gehört. Sie vermietet sie. Gegenteil: der Mieter.'
  use_cases:
  - Der Vermieter zeigt uns die Wohnung.
  - Bei Fragen rufe ich den Vermieter an.
  collocations: den Vermieter anrufen · den Vermieter fragen
  register: 'Plural: die Vermieter. Die Frau: die Vermieterin. Von vermieten.'
- term: kündigen
  tag: Verb
  definition: Sagen, dass man den Vertrag beenden will. Man kündigt die Wohnung.
  use_cases:
  - Wir kündigen die Wohnung und ziehen im Mai aus.
  - Der Mieter hat den alten Vertrag gekündigt.
  collocations: die Wohnung kündigen · den Vertrag kündigen
  register: 'Partizip II: gekündigt. Von die Kündigung.'
- term: zentral
  tag: Adjektiv
  definition: 'Mitten in der Stadt, im Zentrum. Gegenteil: am Stadtrand.'
  use_cases:
  - Die Wohnung liegt sehr zentral, mitten in der Stadt.
  - Zentral wohnen ist teuer, aber sehr praktisch.
  collocations: zentral gelegen · zentral wohnen · eine zentrale Lage
  register: 'Von das Zentrum. Gegenteil: am Rand.'
- term: der Quadratmeter
  tag: Nomen
  definition: Ein kleines Feld, einen Meter lang und einen Meter breit. So misst man die Wohnung.
  use_cases:
  - Die Wohnung hat siebzig Quadratmeter.
  - Wie viele Quadratmeter hat das Zimmer?
  collocations: siebzig Quadratmeter · der Preis pro Quadratmeter
  register: 'Plural: die Quadratmeter. Kurz: qm oder m². Aus Quadrat + Meter.'
- term: die Kaution
  tag: Nomen
  definition: Das Geld, das man am Anfang als Sicherheit gibt. Man bekommt es später zurück.
  use_cases:
  - Am Anfang zahlt man eine Kaution als Sicherheit.
  - Die Kaution beträgt drei Monatsmieten.
  collocations: die Kaution zahlen · die Kaution zurückbekommen
  register: 'Plural: die Kautionen. Aus dem Lateinischen.'
- term: der Balkon
  tag: Nomen
  definition: Ein kleiner Platz draußen an der Wohnung, oft oben im Haus.
  use_cases:
  - Im Sommer sitzen wir gern auf dem Balkon.
  - Die Wohnung hat einen großen Balkon mit viel Sonne.
  collocations: ein großer Balkon · auf dem Balkon sitzen
  register: 'Plural: die Balkone. Aus dem Italienischen.'
- term: die Terrasse
  tag: Nomen
  definition: Ein Platz draußen an der Wohnung, meist unten oder im Garten.
  use_cases:
  - Die Wohnung im Erdgeschoss hat eine schöne Terrasse.
  - Auf der Terrasse steht ein Tisch mit vier Stühlen.
  collocations: eine große Terrasse · auf der Terrasse
  register: 'Plural: die Terrassen. Aus dem Französischen.'
- term: der Aufzug
  tag: Nomen
  definition: 'Eine kleine Kabine. Sie fährt die Leute nach oben und unten. Auch: der Lift.'
  use_cases:
  - Die Wohnung ist in der fünften Etage, aber es gibt einen Aufzug.
  - Der Aufzug fährt langsam nach oben.
  collocations: mit dem Aufzug fahren · der Aufzug im Haus
  register: 'Plural: die Aufzüge. Aus auf + ziehen.'
- term: das Erdgeschoss
  tag: Nomen
  definition: Der Boden unten im Haus, gleich neben der Straße. Nicht oben.
  use_cases:
  - Die Wohnung liegt im Erdgeschoss, gleich neben der Straße.
  - Im Erdgeschoss gibt es keine Treppe.
  collocations: im Erdgeschoss wohnen · die Wohnung im Erdgeschoss
  register: 'Plural: die Erdgeschosse. Aus die Erde + das Geschoss.'
- term: die Etage
  tag: Nomen
  definition: 'Ein Stock im Haus. Die Wohnung ist in der zweiten Etage. Auch: der Stock.'
  use_cases:
  - Wir wohnen in der zweiten Etage.
  - Das Haus hat vier Etagen.
  collocations: in der zweiten Etage · das Haus mit vier Etagen
  register: 'Plural: die Etagen. Auch: der Stock. Aus dem Französischen.'
- term: die Lage
  tag: Nomen
  definition: Wo etwas liegt. Die Wohnung hat eine ruhige Lage am Park.
  use_cases:
  - Die Wohnung hat eine ruhige Lage am Park.
  - Die Lage ist zentral und trotzdem grün.
  collocations: eine ruhige Lage · eine zentrale Lage · eine gute Lage
  register: 'Plural: die Lagen. Vom Verb liegen.'
- term: der Mieter
  tag: Nomen
  definition: 'Die Person, die in der Wohnung wohnt und Miete zahlt. Gegenteil: der Vermieter.'
  use_cases:
  - Der neue Mieter zieht am ersten Mai ein.
  - Der Mieter zahlt die Miete jeden Monat.
  collocations: der neue Mieter · ein ruhiger Mieter
  register: 'Plural: die Mieter. Die Frau: die Mieterin. Von mieten.'
- term: einziehen
  tag: Verb
  definition: 'In eine neue Wohnung kommen und dort wohnen. Gegenteil: ausziehen.'
  use_cases:
  - Wir ziehen nächste Woche in die neue Wohnung ein.
  - Wann kann ich in die Wohnung einziehen?
  collocations: in die Wohnung einziehen · sofort einziehen
  register: 'Partizip II: ist eingezogen (mit sein). Trennbar: ein + ziehen.'
- term: renovieren
  tag: Verb
  definition: 'Eine alte Wohnung wieder schön machen: neue Farbe, neue Küche.'
  use_cases:
  - Wir renovieren das alte Bad und die Küche.
  - Die Wohnung ist frisch renoviert und sieht neu aus.
  collocations: die Wohnung renovieren · das Bad renovieren
  register: 'Partizip II: renoviert. Aus dem Lateinischen: neu machen.'
- term: die Kaltmiete
  tag: Nomen
  definition: 'Die Miete ohne die Nebenkosten. Gegenteil: die Warmmiete.'
  use_cases:
  - Die Kaltmiete ist die Miete ohne die Nebenkosten.
  - Die Kaltmiete beträgt sechshundert Euro im Monat.
  collocations: die Kaltmiete beträgt · die niedrige Kaltmiete
  register: 'Plural: die Kaltmieten. Aus kalt + Miete.'
- term: die Warmmiete
  tag: Nomen
  definition: 'Die Miete mit allen Nebenkosten zusammen. Gegenteil: die Kaltmiete.'
  use_cases:
  - Die Warmmiete ist die Kaltmiete plus die Nebenkosten.
  - Unsere Warmmiete ist siebenhundert Euro im Monat.
  collocations: die Warmmiete zahlen · die hohe Warmmiete
  register: 'Plural: die Warmmieten. Aus warm + Miete.'
- term: der Keller
  tag: Nomen
  definition: Ein Raum ganz unten im Haus. Dort stehen alte Sachen und Getränke.
  use_cases:
  - Im Keller steht mein altes Fahrrad.
  - Zur Wohnung gehört auch ein Keller.
  collocations: im Keller · ein trockener Keller
  register: 'Plural: die Keller. Aus dem Lateinischen.'
- term: die Heizung
  tag: Nomen
  definition: Sie macht die Wohnung im Winter warm.
  use_cases:
  - Im Winter machen wir die Heizung an.
  - Die Heizung in der Wohnung ist neu und modern.
  collocations: die Heizung anmachen · die Heizung funktioniert
  register: 'Plural: die Heizungen. Von heizen + -ung.'
- term: provisionsfrei
  tag: Adjektiv
  definition: Ohne Provision. Man zahlt nur die Miete, kein extra Geld.
  use_cases:
  - Die Wohnung ist provisionsfrei, das spart viel Geld.
  - Wir suchen eine provisionsfreie Wohnung im Zentrum.
  collocations: eine provisionsfreie Wohnung · provisionsfrei mieten
  register: Aus Provision + frei. Ohne extra Gebühr.
- term: die Wohnfläche
  tag: Nomen
  definition: Wie groß eine Wohnung ist, gemessen in Quadratmetern.
  use_cases:
  - Die Wohnfläche beträgt achtzig Quadratmeter.
  - Eine große Wohnfläche kostet mehr Miete.
  collocations: die große Wohnfläche · die Wohnfläche in Quadratmetern
  register: 'Plural: die Wohnflächen. Aus wohnen + die Fläche.'
- term: der Altbau
  tag: Nomen
  definition: 'Ein altes Haus, oft über hundert Jahre alt. Gegenteil: der Neubau.'
  use_cases:
  - Im Altbau sind die Zimmer hoch und hell.
  - Wir wohnen gern in einem Altbau im Zentrum.
  collocations: eine Altbauwohnung · der schöne Altbau
  register: 'Plural: die Altbauten. Aus alt + Bau. Gegenteil: der Neubau.'
- term: der Neubau
  tag: Nomen
  definition: 'Ein neues Haus, erst vor kurzem gebaut. Gegenteil: der Altbau.'
  use_cases:
  - Im Neubau sind die Fenster neu und die Heizung modern.
  - Der Neubau am Stadtrand ist erst ein Jahr alt.
  collocations: eine Neubauwohnung · der moderne Neubau
  register: 'Plural: die Neubauten. Aus neu + Bau. Gegenteil: der Altbau.'
