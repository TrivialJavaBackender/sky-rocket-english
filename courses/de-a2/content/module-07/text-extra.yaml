# Modul 07 · Wohnungssuche — Zusatztext: vier Wohnungsanzeigen (~140 Wörter).
# Echtes Genre: kurze Anzeigen aus der Zeitung. Hier steht das Adjektiv oft ohne
# Artikel (helle Zimmer, ruhige Lage, niedrige Nebenkosten) — genau die Zielform
# des Moduls. Viele Zielwörter: Altbau, Neubau, Kaltmiete, Warmmiete, Kaution,
# Nebenkosten, Wohnfläche, Aufzug, Erdgeschoss, Etage, Terrasse, Mieter.
# Glossen nur auf Wörterbuchformen: der Neubau, provisionsfrei, die Terrasse.
kind: extra
kicker: ANZEIGEN
title: Vier Wohnungsanzeigen
meta: ≈ 1 Min · vier kurze Anzeigen aus der Zeitung
word_count: 145
body:
- - t: '1. Schöne Altbauwohnung, zentral gelegen! Drei helle Zimmer, hohe Decken, großer Balkon. Wohnfläche 85 Quadratmeter. Kaltmiete 780 Euro plus Nebenkosten. Kaution: zwei Monatsmieten. Ab sofort frei. Ideal für eine kleine Familie. Bitte nur ernste Anfragen an den Vermieter.'
- - t: '2. Moderne Zwei-Zimmer-Wohnung im '
  - g: Neubau
  - t: ' am Stadtrand. Ruhige Lage, viel Grün, guter Anschluss zur Stadt. Möbliertes Schlafzimmer, neue Küche, Aufzug im Haus. Warmmiete 650 Euro, '
  - g: provisionsfrei
  - t: . Ein Keller gehört dazu. Besichtigung nach Absprache.
- - t: 3. Nettes Zimmer in ruhiger Umgebung zu vermieten. 18 Quadratmeter, hell und freundlich, mit kleinem Balkon. Miete 350 Euro warm, niedrige Nebenkosten. Die Wohnung liegt im Erdgeschoss. Keller und Heizung sind vorhanden. Wir suchen einen freundlichen Mieter.
- - t: '4. Kleine, gemütliche Wohnung mit schöner '
  - g: Terrasse
  - t: . Erste Etage, gute Lage, nur zehn Minuten zur Stadt. Kaltmiete 520 Euro, Kaution drei Monatsmieten. Das Haus ist ein Altbau, aber frisch renoviert. Interesse? Dann rufen Sie den Vermieter an.
glosses:
- key: Neubau
  term: Neubau
  pos_label: Nomen, der
  definition: 'Ein neues Haus. Anders: der Altbau.'
  example: Im Neubau sind die Zimmer neu und modern.
- key: provisionsfrei
  term: provisionsfrei
  pos_label: Adjektiv
  definition: Ohne Provision. Man zahlt kein extra Geld für die Wohnung.
  example: Die Wohnung ist provisionsfrei.
- key: Terrasse
  term: Terrasse
  pos_label: Nomen, die
  definition: Ein Platz draußen an der Wohnung, meist im Erdgeschoss.
  example: Im Sommer sitzen wir gern auf der Terrasse.
