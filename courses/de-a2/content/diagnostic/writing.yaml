mode: writing
genre: Steckbrief
prompt: |
  Schreiben Sie einen kurzen Text über sich. 30–40 Wörter.

  Schreiben Sie etwas zu diesen Punkten:
  • Name und Alter
  • Land und Stadt
  • Beruf oder Studium
  • Sprachen
  • ein Hobby

  Beispielanfang: „Ich heiße … und bin … Jahre alt.“
model_answer: |
  Ich heiße Marek Nowak und bin 32 Jahre alt. Ich komme aus Polen, aus Krakau.
  Jetzt wohne ich in Leipzig und arbeite als Koch in einem Restaurant.
  Ich spreche Polnisch, Englisch und ein bisschen Deutsch. In meiner Freizeit
  koche ich gern und fahre Fahrrad.
checklist:
  - 30–40 Wörter
  - Name und Alter stehen im Text
  - Land und Stadt stehen im Text
  - Beruf oder Studium steht im Text
  - Mindestens zwei Sprachen sind genannt
  - Ein Hobby ist genannt
  - Die Verben haben die richtige Endung (ich heiße, ich wohne, ich arbeite)
  - Nomen beginnen mit einem großen Buchstaben
