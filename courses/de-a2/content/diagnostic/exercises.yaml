# Einstufungstest de-a2 — Grammatik-Wörterbuch (7) + 40 Aufgaben.
# Aufgabe 1–7 sind das Grammatik-Wörterbuch: Sie führen die 28 Fachwörter ein,
# die alle Module danach benutzen (courses/de-a2/PLAN.md §5). Kein Modul benutzt
# ein Fachwort, das hier fehlt. Jede Aufgabe nimmt einen Bereich: Wortarten,
# das Nomen, die Verbform, die Konjugation, der Satz, Formen und Zeiten,
# die Verbindung im Satz.
# Danach 40 Aufgaben quer durch den Stoff A1 → A2 — kein Test zum Bestehen,
# sondern eine Landkarte der Lücken.
core:
  # ───────────────────────── Grammatik-Wörterbuch ─────────────────────────
  - type: collocation_match
    group: grammar
    id: diag-woerterbuch-1
    content:
      left: [das Nomen, das Verb, das Adjektiv, das Adverb]
      right: ["gehen, lernen, arbeiten", "gern, oft, immer", "das Haus, das Kind, die Stadt", "gut, klein, neu"]
      pairs: { 0: 2, 1: 0, 2: 3, 3: 1 }
    explanation: "das Nomen is a thing or a person, das Verb is the action, das Adjektiv describes a noun, das Adverb says how often or how gladly you do something."

  - type: collocation_match
    group: grammar
    id: diag-woerterbuch-2
    content:
      left: [der Artikel, das Genus, der Singular, der Plural]
      right: ["ein Kind, ein Buch", "zwei Kinder, drei Bücher", "der, die, das", "der Tisch, die Lampe, das Buch"]
      pairs: { 0: 2, 1: 3, 2: 0, 3: 1 }
    explanation: "der Artikel stands in front of the noun. das Genus is der, die or das — every noun has one. der Singular means one, der Plural more than one."

  - type: collocation_match
    group: grammar
    id: diag-woerterbuch-3
    content:
      left: [der Stamm, die Endung, der Infinitiv, das Präsens]
      right: ["Heute lerne ich Deutsch.", "lern- in lernen, wohn- in wohnen", "lernen, wohnen, kommen", "-e, -st, -t in lerne, lernst, lernt"]
      pairs: { 0: 1, 1: 3, 2: 2, 3: 0 }
    explanation: "der Stamm is the verb without its ending, die Endung shows the person, der Infinitiv is the dictionary form, das Präsens is the tense for now."

  - type: collocation_match
    group: grammar
    id: diag-woerterbuch-4
    content:
      left: [das Personalpronomen, die Person, regelmäßig, unregelmäßig]
      right: ["lernen: ich lerne, du lernst, er lernt", "1. Person ich, 2. Person du, 3. Person er", "ich, du, er, wir, ihr, sie", "sein: ich bin, du bist, er ist"]
      pairs: { 0: 2, 1: 1, 2: 0, 3: 3 }
    explanation: "das Personalpronomen stands for a person, die Person shows who is speaking. regelmäßig verbs follow the rule, unregelmäßig ones do not."

  - type: collocation_match
    group: grammar
    id: diag-woerterbuch-5
    content:
      left: [der Hauptsatz, der Nebensatz, das Subjekt, das Fragewort]
      right: ["Anna in: Anna kommt aus Spanien.", "wer, wo, wie, warum", "Ich lerne Deutsch.", "…, weil ich müde bin."]
      pairs: { 0: 2, 1: 3, 2: 0, 3: 1 }
    explanation: "der Hauptsatz can stand alone, der Nebensatz starts with weil, dass or wenn. das Subjekt does the action, das Fragewort opens a question."

  - type: collocation_match
    group: grammar
    id: diag-woerterbuch-6
    content:
      left: [der Kasus, das Partizip, die Vergangenheit, trennbar]
      right: ["Gestern habe ich gelernt.", "Nominativ, Akkusativ, Dativ", "Ich stehe um acht Uhr auf.", "gelernt, gemacht, gefahren"]
      pairs: { 0: 1, 1: 3, 2: 0, 3: 2 }
    explanation: "der Kasus shows the role of the noun in the sentence, das Partizip is what the past tense needs, and a trennbar verb has two parts: Ich stehe … auf."

  - type: collocation_match
    group: grammar
    id: diag-woerterbuch-7
    content:
      left: [die Präposition, die Vorsilbe, das Objekt, die Konjunktion]
      right: ["und, oder, aber, weil", "auf-, ein-, mit-, fern-", "in, an, auf, mit, für", "Ich sehe den Mann."]
      pairs: { 0: 2, 1: 1, 2: 3, 3: 0 }
    explanation: "die Präposition stands before the noun, die Vorsilbe before the verb. das Objekt is the person or thing acted on, die Konjunktion joins two parts."

  # ───────────────────────── Wortschatz ─────────────────────────
  - type: collocation_match
    group: vocab
    content:
      left: [Deutsch, Musik, Sport, Freunde]
      right: [treiben, sprechen, treffen, hören]
      pairs: { 0: 1, 1: 3, 2: 0, 3: 2 }
    explanation: "These verbs go with these nouns: Deutsch sprechen, Musik hören, Sport treiben, Freunde treffen."

  - type: collocation_match
    group: vocab
    content:
      left: [eine Frage, einen Kaffee, ein Formular, die Hausaufgaben]
      right: [ausfüllen, stellen, machen, trinken]
      pairs: { 0: 1, 1: 3, 2: 0, 3: 2 }
    explanation: "You stellen a question, trinken a coffee, füllen a form aus and machen your homework."

  - type: collocation_match
    group: vocab
    content:
      left: [das Land, die Stadt, der Beruf, die Sprache]
      right: [Lehrerin, Berlin, Italienisch, Österreich]
      pairs: { 0: 3, 1: 1, 2: 0, 3: 2 }
    explanation: "Österreich is a country, Berlin a town, Lehrerin a job, Italienisch a language."

  # ───────────────────────── Multiple Choice ─────────────────────────
  - type: mc_cloze
    group: grammar
    content:
      pre: "Anna "
      post: " aus Spanien."
      options: [komme, kommst, kommt, kommen]
      answer: 2
    explanation: "Anna = er/sie/es, and with er/sie/es the verb ends in -t: sie kommt."

  - type: mc_cloze
    group: grammar
    content:
      pre: "Ich habe "
      post: " Auto, aber ein Fahrrad."
      options: [kein, keine, keinen, nicht]
      answer: 0
    explanation: "das Auto is neuter, so in the accusative it stays kein Auto. Only der-nouns become keinen: keinen Wagen."

  - type: mc_cloze
    group: grammar
    content:
      pre: "Gestern "
      post: " ich ins Kino gegangen."
      options: [habe, bin, war, werde]
      answer: 1
    explanation: "gehen is a verb of movement, and those build the past with sein: ich bin gegangen, ich bin gefahren."

  - type: mc_cloze
    group: grammar
    content:
      pre: "Wir fahren "
      post: " dem Zug nach Hamburg."
      options: [in, zu, auf, mit]
      answer: 3
    explanation: "A means of transport takes mit + dative: mit dem Zug, mit dem Bus, mit der Bahn."

  - type: mc_cloze
    group: grammar
    content:
      pre: "Er ist "
      post: " als sein Bruder."
      options: [groß, größer, am größten, so groß]
      answer: 1
    explanation: "als is preceded by the comparative: groß → größer. Only so groß wie compares two equal things."

  - type: mc_cloze
    group: grammar
    content:
      pre: "Ich bleibe heute zu Hause, weil ich krank "
      post: "."
      options: [bin, ist, sein, bist]
      answer: 0
    explanation: "In a weil-clause the verb goes to the end. The subject is ich, so: weil ich krank bin."

  - type: mc_cloze
    group: grammar
    content:
      pre: "Das ist "
      post: " Schwester. Sie heißt Lena."
      options: [mein, meine, meinen, meiner]
      answer: 1
    explanation: "die Schwester is feminine, so in the nominative it is meine Schwester."

  - type: mc_cloze
    group: grammar
    content:
      pre: "Du "
      post: " heute nicht arbeiten, es ist Sonntag."
      options: [muss, müssen, müsst, musst]
      answer: 3
    explanation: "du + müssen = du musst. The second verb stays an infinitive at the end: du musst arbeiten."

  - type: mc_cloze
    group: grammar
    content:
      pre: "Der Kurs beginnt "
      post: " 18 Uhr und dauert zwei Stunden."
      options: [in, am, um, an]
      answer: 2
    explanation: "A clock time takes um: um 18 Uhr, um halb acht. am goes before a day: am Montag."

  # ───────────────────────── Lückentext ─────────────────────────
  - type: open_cloze
    group: grammar
    content:
      pre: "Ich komme "
      post: " Polen und wohne seit zwei Jahren in Köln."
      answers: [aus]
      answer_shown: aus
    explanation: "Origin from a country: kommen aus + country. Ich komme aus Polen, aus der Türkei, aus Italien."

  - type: open_cloze
    group: grammar
    content:
      pre: "Ich "
      post: " Lehrerin und arbeite an einer Schule."
      answers: [bin]
      answer_shown: bin
    explanation: "A job goes with sein and no article: Ich bin Lehrerin — never Ich bin eine Lehrerin."

  - type: open_cloze
    group: grammar
    content:
      pre: "Das ist Frau Meier. "
      post: " Frau kommt aus Berlin."
      answers: [die]
      answer_shown: die
    explanation: "The woman is already known, so the definite article. die Frau is feminine: die."

  - type: open_cloze
    group: grammar
    content:
      pre: "Entschuldigung, ich verstehe Sie "
      post: ". Sprechen Sie bitte langsam."
      answers: [nicht]
      answer_shown: nicht
    explanation: "A verb is negated with nicht, and nicht goes to the end: Ich verstehe Sie nicht."

  - type: open_cloze
    group: grammar
    content:
      pre: "Jeden Morgen fahre ich "
      post: " dem Bus zur Arbeit."
      answers: [mit]
      answer_shown: mit
    explanation: "mit always takes the dative. der Bus → mit dem Bus."

  - type: open_cloze
    group: grammar
    content:
      pre: ""
      post: " du heute Abend Zeit? Wir gehen ins Kino."
      answers: [hast]
      answer_shown: hast
    explanation: "A question with no question word starts with the verb. du + haben = hast: Hast du Zeit?"

  - type: open_cloze
    group: grammar
    content:
      pre: "Ich lerne Deutsch "
      post: " Englisch. Beide Sprachen gefallen mir."
      answers: [und]
      answer_shown: und
    explanation: "und joins two matching parts, and beide shows there are two languages together."

  - type: open_cloze
    group: grammar
    content:
      pre: "Ich habe "
      post: " Bruder. Er heißt Tom und ist 20 Jahre alt."
      answers: [einen]
      answer_shown: einen
    explanation: "haben needs an accusative object. der Bruder → einen Bruder."

  - type: open_cloze
    group: grammar
    content:
      pre: "Ich bleibe heute zu Hause, "
      post: " ich müde bin."
      answers: [weil]
      answer_shown: weil
    explanation: "weil gives the reason, and after weil the verb goes to the end: weil ich müde bin."

  - type: open_cloze
    group: grammar
    content:
      pre: "Kannst du "
      post: " Kind bitte helfen? Es findet seine Mutter nicht."
      answers: [dem]
      answer_shown: dem
    explanation: "helfen always takes the dative. das Kind → dem Kind."

  # ───────────────────────── Grammatik-Drill ─────────────────────────
  - type: grammar_drill
    group: grammar
    content:
      pre: ""
      post: " kommst du?"
      prompt: HERKUNFT
      options: [Wo, Woher, Wohin, Wer]
      answer: 1
    explanation: "woher asks where you come from: Woher kommst du? — Aus Italien. wo asks where you are, wohin where you are going."

  - type: grammar_drill
    group: grammar
    content:
      pre: "Am Wochenende "
      post: " wir oft ins Schwimmbad."
      prompt: GEHEN
      options: [gehen, gehe, geht, gegangen]
      answer: 0
    explanation: "The subject is wir, so the ending is -en: wir gehen. After a time expression the verb takes position 2."

  - type: grammar_drill
    group: grammar
    content:
      pre: "Ich stehe jeden Tag um sechs Uhr "
      post: "."
      prompt: AUFSTEHEN
      options: [auf, an, aus, ab]
      answer: 0
    explanation: "aufstehen is a separable verb, so auf goes to the end of the main clause: Ich stehe um sechs Uhr auf."

  - type: grammar_drill
    group: grammar
    content:
      pre: "Wir "
      post: " gestern einen Film gesehen."
      prompt: PERFEKT
      options: [sind, haben, waren, hatten]
      answer: 1
    explanation: "sehen builds its perfect with haben: wir haben gesehen. Only verbs of movement take sein."

  - type: grammar_drill
    group: grammar
    content:
      pre: "Das Buch liegt "
      post: " dem Tisch."
      prompt: ORT
      options: [an, über, in, auf]
      answer: 3
    explanation: "auf + dative describes something lying on a surface. The question is Wo? — Auf dem Tisch."

  - type: grammar_drill
    group: grammar
    content:
      pre: "Als Kind "
      post: " ich sehr schüchtern."
      prompt: PRÄTERITUM
      options: [bin, war, gewesen, bist]
      answer: 1
    explanation: "German prefers the simple past for sein: ich war. It sounds more natural than ich bin gewesen."

  - type: grammar_drill
    group: grammar
    content:
      pre: ""
      post: " Sie bitte langsam! Ich verstehe Sie nicht."
      prompt: SPRECHEN
      options: [Sprich, Sprecht, Sprechen, Spricht]
      answer: 2
    explanation: "A polite request to a stranger: verb + Sie. Sprechen Sie bitte langsam! With du it is Sprich langsam!"

  # ───────────────────────── Fehlersuche ─────────────────────────
  - type: error_correction
    group: grammar
    content:
      words: [Ich, habe, "25", Jahre, "alt."]
      wrong: 1
      correction: "habe → bin"
    explanation: "Age goes with sein: Ich bin 25 Jahre alt. Ich habe 25 Jahre is a calque from another language."

  - type: error_correction
    group: grammar
    content:
      words: [Woher, du, kommst, "?"]
      wrong: 1
      correction: "du kommst → kommst du"
    explanation: "In a question the verb comes straight after the question word: Woher kommst du?"

  - type: error_correction
    group: grammar
    content:
      words: [Ich, bin, ein, Student, an, der, "Universität."]
      wrong: 2
      correction: "ein → (nichts)"
    explanation: "No article in front of a job: Ich bin Student. The same goes for Ich bin Ärztin, Ich bin Lehrer."

  - type: error_correction
    group: grammar
    content:
      words: [Gestern, habe, ich, nach, Berlin, "gefahren."]
      wrong: 1
      correction: "habe → bin"
    explanation: "fahren is a verb of movement and builds its perfect with sein: Ich bin nach Berlin gefahren."

  # ───────────────────────── Wortbildung ─────────────────────────
  - type: word_formation
    group: vocab
    content:
      pre: "In der Klasse sind zwölf "
      post: "."
      prompt: das Kind
      answers: [Kinder]
      answer_shown: Kinder
    explanation: "The plural of das Kind is die Kinder. After a number the plural is obligatory."

  - type: word_formation
    group: vocab
    content:
      pre: "Wir haben gestern zwei Stunden "
      post: "."
      prompt: lernen
      answers: [gelernt]
      answer_shown: gelernt
    explanation: "The participle of a regular verb: ge- + stem + -t. lernen → gelernt."

  - type: word_formation
    group: vocab
    content:
      pre: "Mein Bruder ist "
      post: " als ich."
      prompt: jung
      answers: [jünger]
      answer_shown: jünger
    explanation: "als is preceded by the comparative, and short adjectives often add an umlaut: jung → jünger, alt → älter."

  - type: word_formation
    group: vocab
    content:
      pre: "Meine Schwester arbeitet als "
      post: " in einem Krankenhaus."
      prompt: der Arzt
      answers: [Ärztin]
      answer_shown: Ärztin
    explanation: "The feminine form of a job ends in -in: der Arzt → die Ärztin, der Lehrer → die Lehrerin."

  - type: word_formation
    group: vocab
    content:
      pre: "Heute ist der "
      post: " Mai."
      prompt: drei
      answers: [dritte]
      answer_shown: dritte
    explanation: "A date takes the ordinal: der dritte Mai. From 2 to 19 the ending is -te, from 20 it is -ste."

  # ───────────────────────── Leseverstehen ─────────────────────────
  - type: reading_comprehension
    group: reading
    content:
      passage: "Hallo! Ich heiße Marek und komme aus Krakau. Seit einem Jahr wohne ich in Leipzig und arbeite dort als Koch. Am Anfang war alles schwer, denn ich habe fast kein Deutsch gesprochen. Jetzt besuche ich dreimal pro Woche einen Sprachkurs. Meine Lehrerin ist sehr geduldig und spricht langsam."
      q: Warum war der Anfang für Marek schwer?
      options:
        - Er hatte keine Arbeit in Leipzig.
        - Er konnte fast kein Deutsch.
        - Seine Lehrerin sprach zu schnell.
        - Er wohnte noch in Krakau.
      answer: 1
    explanation: "The text says: denn ich habe fast kein Deutsch gesprochen. denn gives the reason. He did have work, and the teacher speaks slowly."

  - type: reading_comprehension
    group: reading
    content:
      passage: "Sprachcafé im Stadtteilzentrum. Jeden Donnerstag von 18 bis 20 Uhr treffen sich Menschen aus vielen Ländern und sprechen zusammen Deutsch. Der Eintritt ist frei, Kaffee und Tee kosten einen Euro. Eine Anmeldung ist nicht nötig — kommen Sie einfach vorbei!"
      q: Was muss man vor dem Besuch machen?
      options:
        - Man muss sich anmelden.
        - Man muss einen Euro bezahlen.
        - Man muss nichts machen.
        - Man muss Deutsch lernen.
      answer: 2
    explanation: "The text says: Eine Anmeldung ist nicht nötig. The euro is for coffee or tea, not for entry."

review_pool: []
