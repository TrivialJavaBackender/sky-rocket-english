# Modul 06 · Kleidung und Einkaufen — theory. Two spotlights, 9 items realising
# the six grammar points of the module card (courses/de-a2/PLAN.md §4).
#
# The adjective takes an ending here only after der, das, die, dieser and jeder,
# and only in the nominative and accusative. After ein and in the dative it is
# module 07's job — which is why ein almost never appears in front of an
# adjective in these examples.
#
# Scaffolding rule (§5, revised 2026-07): title, intro, form and note in English,
# every example and table in German. Adjective endings: courses/_reference/
# basic-german/ unit 25.
spotlights:
  - title: The adjective after der, das, die
    intro: >-
      An adjective after the noun needs nothing at all: Der Mantel ist neu. Put
      it in front of the noun and German gives it an ending: der neue Mantel.
      This is the point at which German asks more of you than English does, and
      it is worth taking slowly. The good news is that after der, das and die
      there are only two endings in the whole system, -e and -en, and only one
      cell of the table actually uses -en in the singular. Learn that one cell
      and the rest is -e.
    items:
      - form: "In the nominative: der neue Mantel, das rote Kleid, die blaue Jacke"
        example: Der neue Mantel ist warm, und die blaue Jacke ist schön.
        note: "After der, das and die the ending is -e in the singular and -en in the plural."
        table:
          headers: ["Artikel", "Adjektiv + Nomen"]
          rows:
            - ["der (maskulin)", "der neue Mantel"]
            - ["das (neutrum)", "das rote Kleid"]
            - ["die (feminin)", "die blaue Jacke"]
            - ["die (Plural)", "die neuen Schuhe"]
      - form: "In the accusative: Ich nehme den neuen Mantel"
        example: Ich nehme den neuen Mantel, das rote Kleid und die blaue Jacke.
        note: "Only the masculine moves: der neue → den neuen. Everything else stays exactly as it was."
        table:
          headers: ["", "Nominativ", "Akkusativ"]
          rows:
            - ["maskulin", "der neue Mantel", "den neuen Mantel"]
            - ["neutrum", "das rote Kleid", "das rote Kleid"]
            - ["feminin", "die blaue Jacke", "die blaue Jacke"]
            - ["Plural", "die neuen Schuhe", "die neuen Schuhe"]
      - form: "dieser and jeder: dieser Mantel, jede Jacke, jeden Tag"
        example: Dieser Mantel ist teuer, aber jede Jacke hier ist billig.
        note: "dieser and jeder end exactly like der, das, die — so the adjective after them behaves the same way."
        table:
          headers: ["der, das, die", "dieser / jeder", "mit Adjektiv"]
          rows:
            - ["der Mantel", "dieser Mantel", "dieser neue Mantel"]
            - ["das Kleid", "jedes Kleid", "jedes rote Kleid"]
            - ["die Jacke", "jede Jacke", "jede blaue Jacke"]
            - ["den Mantel", "diesen Mantel", "diesen neuen Mantel"]
      - form: "Behind the noun, no ending at all"
        example: "Der Mantel ist neu. Der neue Mantel ist warm."
        note: An adjective only takes an ending when it stands in front of the noun. After sein it stays bare.
        table:
          headers: ["hinter dem Nomen", "vor dem Nomen"]
          rows:
            - ["Der Mantel ist neu.", "der neue Mantel"]
            - ["Das Kleid ist rot.", "das rote Kleid"]
            - ["Die Schuhe sind teuer.", "die teuren Schuhe"]

  - title: der, das, die as a short answer
    intro: >-
      In a shop you rarely say the noun twice. German lets the article stand on
      its own and point at the thing: Welchen Mantel nimmst du? — Den da. It
      keeps its case, which is why you hear den and not der. The second half of
      this spotlight puts the whole ending system on one page, so come back to
      that table whenever an ending feels uncertain.
    items:
      - form: der, das, die as a short answer
        example: '„Welchen Mantel nimmst du?" — „Den da, den blauen."'
        note: "The article stands alone and points at the thing. It keeps its case — masculine accusative is den."
        table:
          headers: ["Frage", "kurze Antwort"]
          rows:
            - ["Welcher Mantel ist neu?", "Der da. (Nominativ)"]
            - ["Welchen Mantel nimmst du?", "Den da. (Akkusativ)"]
            - ["Welche Jacke gefällt dir?", "Die da."]
            - ["Welches Kleid möchtest du?", "Das da."]
      - form: dieser or jeder together with an adjective
        example: Dieser gestreifte Pullover ist zu eng. Jede neue Hose kostet extra.
        note: After dieser and jeder the adjective takes the same -e or -en as after der.
        table:
          headers: ["Satz", "Kasus"]
          rows:
            - ["Dieser gestreifte Pullover ist zu eng.", "Nominativ"]
            - ["Ich nehme diesen gestreiften Pullover.", "Akkusativ"]
            - ["Jede neue Hose kostet extra.", "Nominativ"]
            - ["Ich probiere jede neue Hose an.", "Akkusativ"]
      - form: All the endings on one page
        example: Der neue Mantel ist teuer, aber ich nehme den neuen Mantel trotzdem.
        note: "One cell takes -en in the singular — masculine accusative. Everything else in the singular takes -e, and the plural is always -en."
        table:
          headers: ["", "Nominativ", "Akkusativ"]
          rows:
            - ["maskulin", "der neue", "den neuen"]
            - ["neutrum", "das neue", "das neue"]
            - ["feminin", "die neue", "die neue"]
            - ["Plural", "die neuen", "die neuen"]
      - form: "Two adjectives, two endings"
        example: "Ich suche den langen blauen Mantel. Die neuen schwarzen Schuhe sind teuer."
        note: Every adjective in the row takes the same ending. Nothing is shared and nothing is dropped.
        table:
          headers: ["Kasus", "Beispiel"]
          rows:
            - ["Nominativ", "der lange blaue Mantel"]
            - ["Akkusativ", "den langen blauen Mantel"]
            - ["Plural", "die neuen schwarzen Schuhe"]

watchouts:
  - title: The adjective needs an ending
    bad: Der neu Mantel ist warm.
    good: Der neue Mantel ist warm.
    note: "In front of a noun an adjective is never bare: der neue Mantel, not der neu Mantel."
  - title: "Masculine accusative takes -en"
    bad: Ich nehme den neue Mantel.
    good: Ich nehme den neuen Mantel.
    note: "Nominative: der neue Mantel. Masculine accusative: den neuen Mantel."
  - title: "der or den?"
    bad: Ich kaufe der roten Rock.
    good: Ich kaufe den roten Rock.
    note: "kaufen asks Wen? — accusative. der Rock → den Rock."
  - title: "The plural always takes -en"
    bad: Ich möchte die neue Schuhe.
    good: Ich möchte die neuen Schuhe.
    note: "After plural die the adjective takes -en: die neuen Schuhe."

cloze_cards:
  - text: "Der {{c1::neue}} Mantel ist warm und nicht zu eng."
    hint: neu
    rule: "After der the nominative ending is -e: der neue Mantel."
  - text: "Ich nehme den {{c1::neuen}} Mantel, er gefällt mir sehr."
    hint: neu
    rule: "Masculine accusative: den neuen. Only the masculine changes."
  - text: "Das {{c1::rote}} Kleid steht dir wirklich gut."
    hint: rot
    rule: "After das the ending is -e: das rote Kleid. Nominative and accusative are identical."
  - text: "Die {{c1::blaue}} Jacke ist heute im Sonderangebot."
    hint: blau
    rule: "After die the ending is -e: die blaue Jacke."
  - text: "Ich möchte die {{c1::neuen}} Schuhe anprobieren."
    hint: neu
    rule: "In the plural after die the adjective takes -en: die neuen Schuhe."
  - text: "Der Mantel ist schön. Ich nehme {{c1::den}} grauen Mantel."
    hint: der oder den
    rule: "nehmen asks Wen? — accusative. der Mantel → den Mantel."
  - text: "{{c1::Dieser}} gestreifte Pullover ist mir leider zu eng."
    hint: dieser
    rule: "dieser ends like der: dieser Pullover, and the adjective after it takes -e."
  - text: "{{c1::Jede}} neue Hose in diesem Geschäft kostet extra."
    hint: jeder
    rule: "jeder ends like der: jede Hose is feminine, and the adjective after it takes -e."
