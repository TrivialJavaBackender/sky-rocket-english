# Modul 06 · Kleidung und Einkaufen — 52 Aufgaben im Kern, 20 im Wiederholungspool.
# Verteilung laut Profil (courses/de-a2/PLAN.md §6): 6 mc_cloze · 8 open_cloze ·
# 6 word_formation · 4 key_word_transformation · 8 grammar_drill ·
# 6 error_correction · 8 collocation_match · 6 reading_comprehension.
#
# Getestet wird nur das Adjektiv nach der, das, die, dieser und jeder, und nur
# im Nominativ und Akkusativ (die Modulkarte). Die Endung nach ein und im Dativ
# (Modul 07) oder Formen wie größer und am größten (Modul 08) kommen nie als
# Lösung vor.
#
# Spiralisches Wiederholen: open_cloze 7 die Präposition mit + Dativ (Modul 02),
# open_cloze 8 das Präteritum war (Modul 05), word_formation 6 das Partizip II
# (Modul 01), grammar_drill 7 die Frage Wohin? (Modul 03), grammar_drill 8 der
# Dativ nach stehen (Modul 04), error_correction 6 das Partizip II (Modul 01).
# Im Pool: open_cloze 5 mit + Dativ (Modul 02), grammar_drill 4 das Perfekt mit
# sein (Modul 01), error_correction 3 für + Akkusativ (Modul 02).
#
# Die Lücken im open_cloze stehen meist auf der Adjektiv-Endung (hint = die
# Grundform des Adjektivs, so ist nur eine Endung möglich) oder auf dem Artikel
# den/der, den der Kasus eindeutig macht.
core:
  # ───────────────────────── Multiple Choice ─────────────────────────
  - type: mc_cloze
    group: grammar
    content:
      pre: "Im Schaufenster hängt der "
      post: " Mantel."
      options: [neuer, neue, neuen, neu]
      answer: 1
    explanation: "After der the nominative ending is -e: der neue Mantel."
  - type: mc_cloze
    group: grammar
    content:
      pre: "Ich kaufe den "
      post: " Pullover."
      options: [rote, roter, roten, rot]
      answer: 2
    explanation: "Masculine accusative: den roten Pullover. Only the masculine switches to -en."
  - type: mc_cloze
    group: grammar
    content:
      pre: "Das "
      post: " Kleid steht dir wirklich gut."
      options: [rote, roten, rotes, rot]
      answer: 0
    explanation: "After das the ending is -e: das rote Kleid. Nominative and accusative are identical."
  - type: mc_cloze
    group: grammar
    content:
      pre: ""
      post: " gestreifte Hemd ist modern."
      options: [Dieser, Dieses, Diese, Diesen]
      answer: 1
    explanation: "das Hemd is neuter: dieses Hemd. The adjective after it takes -e: dieses gestreifte Hemd."
  - type: mc_cloze
    group: grammar
    content:
      pre: '„Welchen Mantel nimmst du?" — „'
      post: ' da, den blauen."'
      options: [Der, Dem, Den, Das]
      answer: 2
    explanation: "Short answer in the masculine accusative: Den da. der Mantel → den."
  - type: mc_cloze
    group: grammar
    content:
      pre: "Ich nehme die "
      post: " Schuhe."
      options: [neues, neuer, neue, neuen]
      answer: 3
    explanation: "In the plural after die the adjective takes -en: die neuen Schuhe."

  # ───────────────────────── Lückentext ─────────────────────────
  - type: open_cloze
    group: grammar
    content:
      pre: "Der "
      post: " Rock ist heute im Sonderangebot."
      answers: [graue]
      hint: grau
      answer_shown: graue
    explanation: "After der the nominative ending is -e: der graue Rock."
  - type: open_cloze
    group: grammar
    content:
      pre: "Dieses "
      post: " Hemd trage ich gern zur Arbeit."
      answers: [weiße]
      hint: weiß
      answer_shown: weiße
    explanation: "dieses ends like das, and the adjective after it takes -e: dieses weiße Hemd."
  - type: open_cloze
    group: grammar
    content:
      pre: "Die "
      post: " Jacke gefällt mir sehr."
      answers: [rote]
      hint: rot
      answer_shown: rote
    explanation: "After die the ending is -e: die rote Jacke."
  - type: open_cloze
    group: grammar
    content:
      pre: "Ich möchte die "
      post: " Schuhe anprobieren."
      answers: [schwarzen]
      hint: schwarz
      answer_shown: schwarzen
    explanation: "In the plural after die the adjective takes -en: die schwarzen Schuhe."
  - type: open_cloze
    group: grammar
    content:
      pre: "Ich nehme den "
      post: " Mantel, er ist wärmer."
      answers: [grauen]
      hint: grau
      answer_shown: grauen
    explanation: "Masculine accusative: den grauen Mantel, with -en."
  - type: open_cloze
    group: grammar
    content:
      pre: "Der blaue Mantel gefällt mir. Ich nehme "
      post: " blauen Mantel."
      answers: [den, diesen]
      answer_shown: den
    explanation: "nehmen asks Wen? — masculine accusative: den (or diesen) blauen Mantel."
  # Spiralisches Wiederholen: die Präposition mit + Dativ aus Modul 02.
  - type: open_cloze
    group: grammar
    content:
      pre: "Ich fahre "
      post: " dem Bus ins Kaufhaus."
      answers: [mit]
      answer_shown: mit
    explanation: "A means of transport takes mit + dative (module 02): mit dem Bus."
  # Spiralisches Wiederholen: das Präteritum von sein aus Modul 05.
  - type: open_cloze
    group: grammar
    content:
      pre: "Gestern "
      post: " der graue Mantel noch reduziert."
      answers: [war]
      answer_shown: war
    explanation: "sein in the simple past: er war (module 05). Gestern marks the past."

  # ───────────────────────── Wortbildung ─────────────────────────
  - type: word_formation
    group: vocab
    content:
      pre: "Das Kleid ist schön bunt und "
      post: "."
      prompt: Farbe
      answers: [farbig]
      answer_shown: farbig
    explanation: "-ig turns the noun into an adjective: die Farbe → farbig."
  - type: word_formation
    group: vocab
    content:
      pre: "Die Verkäuferin ist sehr "
      post: "."
      prompt: Freund
      answers: [freundlich]
      answer_shown: freundlich
    explanation: "-lich turns the noun into an adjective: der Freund → freundlich."
  - type: word_formation
    group: vocab
    content:
      pre: "Heute ist es warm und "
      post: "."
      prompt: Sonne
      answers: [sonnig]
      answer_shown: sonnig
    explanation: "-ig again: die Sonne → sonnig."
  - type: word_formation
    group: vocab
    content:
      pre: "Am Morgen war der Himmel grau und "
      post: "."
      prompt: Wolke
      answers: [wolkig]
      answer_shown: wolkig
    explanation: "-ig again: die Wolke → wolkig."
  - type: word_formation
    group: vocab
    content:
      pre: "Dieser Pullover ist modern und "
      post: "."
      prompt: Sport
      answers: [sportlich]
      answer_shown: sportlich
    explanation: "-lich again: der Sport → sportlich."
  # Spiralisches Wiederholen: das Partizip II aus Modul 01.
  - type: word_formation
    group: vocab
    content:
      pre: "Ich habe die blaue Jacke im Sonderangebot "
      post: "."
      prompt: kaufen
      answers: [gekauft]
      answer_shown: gekauft
    explanation: "Participle of kaufen: gekauft (module 01), and the perfect takes haben."

  # ───────────────────────── Umformung ─────────────────────────
  - type: key_word_transformation
    group: grammar
    content:
      s1: Der Mantel ist neu.
      key: adjective ending after den
      pre: "Ich kaufe den "
      post: " Mantel."
      answers: [neuen]
      hint: 1 Wort
      answer_shown: neuen
    explanation: "The sentence becomes an accusative phrase: den neuen Mantel (masculine takes -en)."
  - type: key_word_transformation
    group: grammar
    content:
      s1: Das Kleid ist rot.
      key: adjective ending after das
      pre: "Ich möchte das "
      post: " Kleid anprobieren."
      answers: [rote]
      hint: 1 Wort
      answer_shown: rote
    explanation: "das rote Kleid: after das the ending is -e, and the accusative looks the same."
  - type: key_word_transformation
    group: grammar
    content:
      s1: Die Schuhe sind schwarz.
      key: adjective ending after die (plural)
      pre: "Ich nehme die "
      post: " Schuhe."
      answers: [schwarzen]
      hint: 1 Wort
      answer_shown: schwarzen
    explanation: "In the plural after die: die schwarzen Schuhe, with -en."
  - type: key_word_transformation
    group: grammar
    content:
      s1: Dieser Pullover ist gestreift.
      key: dieser in the accusative
      pre: "Ich möchte "
      post: " gestreiften Pullover."
      answers: [diesen]
      hint: 1 Wort
      answer_shown: diesen
    explanation: "In the masculine accusative dieser becomes diesen: diesen gestreiften Pullover."

  # ───────────────────────── Grammatik-Drill ─────────────────────────
  - type: grammar_drill
    group: grammar
    content:
      pre: "Ich nehme "
      post: " blauen Mantel."
      prompt: AKKUSATIV
      options: [der, den, dem, das]
      answer: 1
    explanation: "nehmen asks Wen? — masculine accusative: den blauen Mantel."
  - type: grammar_drill
    group: grammar
    content:
      pre: ""
      post: " rote Rock ist im Sonderangebot."
      prompt: NOMINATIV
      options: [Der, Den, Dem, Das]
      answer: 0
    explanation: "The skirt is the subject → nominative: Der rote Rock."
  - type: grammar_drill
    group: grammar
    content:
      pre: "Ich trage das "
      post: " Hemd."
      prompt: ENDUNG
      options: [weiß, weiße, weißen, weißes]
      answer: 1
    explanation: "das weiße Hemd: after das the ending is -e."
  - type: grammar_drill
    group: grammar
    content:
      pre: ""
      post: " Jacke gefällt mir sehr."
      prompt: DIESER
      options: [Dieser, Dieses, Diese, Diesen]
      answer: 2
    explanation: "die Jacke is feminine: diese Jacke."
  - type: grammar_drill
    group: grammar
    content:
      pre: "Ich möchte die "
      post: " Schuhe anprobieren."
      prompt: ENDUNG
      options: [roten, rote, roter, rotes]
      answer: 0
    explanation: "In the plural after die: die roten Schuhe, with -en."
  - type: grammar_drill
    group: grammar
    content:
      pre: "Nimmst du "
      post: " karierten Rock?"
      prompt: AKKUSATIV
      options: [der, dem, das, den]
      answer: 3
    explanation: "nehmen asks Wen? — masculine accusative: den karierten Rock."
  # Spiralisches Wiederholen: die Frage Wohin? aus Modul 03.
  - type: grammar_drill
    group: grammar
    content:
      pre: "Ich lege den Pullover "
      post: " Tisch."
      prompt: "WOHIN?"
      options: [auf dem, auf den, auf der, im]
      answer: 1
    explanation: "legen answers Wohin? — accusative (module 03): auf den Tisch."
  # Spiralisches Wiederholen: der Dativ nach stehen aus Modul 04.
  - type: grammar_drill
    group: grammar
    content:
      pre: "Der graue Mantel steht "
      post: " wirklich gut."
      prompt: DATIV
      options: [du, dich, dir, dein]
      answer: 2
    explanation: "stehen with a person takes the dative (module 04): Der Mantel steht dir gut."

  # ───────────────────────── Fehlersuche ─────────────────────────
  - type: error_correction
    group: grammar
    content:
      words: [Der, neu, Mantel, ist, sehr, "warm."]
      wrong: 1
      correction: "neu → neue"
    explanation: "In front of a noun the adjective needs an ending: der neue Mantel."
  - type: error_correction
    group: grammar
    content:
      words: [Ich, nehme, den, neue, "Mantel."]
      wrong: 3
      correction: "neue → neuen"
    explanation: "Masculine accusative: den neuen Mantel."
  - type: error_correction
    group: grammar
    content:
      words: [Ich, möchte, die, neue, Schuhe, "anprobieren."]
      wrong: 3
      correction: "neue → neuen"
    explanation: "In the plural after die the adjective takes -en: die neuen Schuhe."
  - type: error_correction
    group: grammar
    content:
      words: [Das, rot, Kleid, gefällt, mir, "gut."]
      wrong: 1
      correction: "rot → rote"
    explanation: "After das the ending is -e: das rote Kleid."
  - type: error_correction
    group: grammar
    content:
      words: [Diese, Pullover, ist, zu, "eng."]
      wrong: 0
      correction: "Diese → Dieser"
    explanation: "der Pullover is masculine: Dieser Pullover ist zu eng."
  # Spiralisches Wiederholen: das Partizip II aus Modul 01.
  - type: error_correction
    group: grammar
    content:
      words: [Ich, habe, einen, Mantel, "gekaufen."]
      wrong: 4
      correction: "gekaufen → gekauft"
    explanation: "Participle of kaufen: gekauft (module 01), not gekaufen."

  # ───────────────────────── Wörter verbinden ─────────────────────────
  - type: collocation_match
    group: grammar
    content:
      left: [der neue, das rote, die blaue, die neuen]
      right: [Kleid, Schuhe, Mantel, Jacke]
      pairs: { 0: 2, 1: 0, 2: 3, 3: 1 }
    explanation: "der neue Mantel, das rote Kleid, die blaue Jacke, die neuen Schuhe — the article shows the gender."
  - type: collocation_match
    group: grammar
    content:
      left: [den neuen, das rote, die blaue, die neuen]
      right: [Jacke, Mantel, Schuhe, Kleid]
      pairs: { 0: 1, 1: 3, 2: 0, 3: 2 }
    explanation: "Ich nehme den neuen Mantel, das rote Kleid, die blaue Jacke, die neuen Schuhe. Only the masculine moves: den neuen."
  - type: collocation_match
    group: vocab
    content:
      left: [weit, groß, neu, teuer]
      right: [alt, eng, billig, klein]
      pairs: { 0: 1, 1: 3, 2: 0, 3: 2 }
    explanation: "Opposites: weit and eng, groß and klein, neu and alt, teuer and billig."
  - type: collocation_match
    group: vocab
    content:
      left: [die Umkleidekabine, das Sonderangebot, der Ärmel, die Quittung]
      right: [hier ist die Ware billiger, ein Teil vom Hemd für den Arm, ein kleiner Raum zum Anprobieren, ein Papier vom Bezahlen]
      pairs: { 0: 2, 1: 0, 2: 1, 3: 3 }
    explanation: "Four nouns from the module, each with its paraphrase."
  - type: collocation_match
    group: vocab
    content:
      left: [die Kasse, das Schaufenster, tragen, anprobieren]
      right: [das große Fenster vorne am Laden, vor dem Kauf anziehen und prüfen, dort bezahlt man im Geschäft, Kleidung am Körper haben]
      pairs: { 0: 2, 1: 0, 2: 3, 3: 1 }
    explanation: "You pay an der Kasse, the goods lie im Schaufenster, tragen means having it on, anprobieren means testing it before you buy."
  - type: collocation_match
    group: vocab
    content:
      left: [die Mütze, die Schuhe, der Schal, der Mantel]
      right: [an den Füßen, auf dem Kopf, am ganzen Körper, um den Hals]
      pairs: { 0: 1, 1: 0, 2: 3, 3: 2 }
    explanation: "Where do you wear what? Die Mütze auf dem Kopf, die Schuhe an den Füßen, den Schal um den Hals, den Mantel am Körper."
  - type: collocation_match
    group: vocab
    content:
      left: [anziehen, ausziehen, umtauschen, anprobieren]
      right: [zurückbringen und eine andere nehmen, Kleidung an den Körper tun, im Geschäft testen, Kleidung vom Körper wegnehmen]
      pairs: { 0: 1, 1: 3, 2: 0, 3: 2 }
    explanation: "anziehen and ausziehen are opposites. umtauschen means bringing it back, anprobieren means testing it in the shop."
  - type: collocation_match
    group: vocab
    content:
      left: [gestreift, kariert, reduziert, preiswert]
      right: [nicht teuer, mit Linien, jetzt billiger als vorher, mit kleinen Quadraten]
      pairs: { 0: 1, 1: 3, 2: 2, 3: 0 }
    explanation: "gestreift has lines, kariert has squares, reduziert means cheaper now, preiswert means not expensive."

  # ───────────────────────── Leseverstehen ─────────────────────────
  - type: reading_comprehension
    group: reading
    content:
      passage: "Lena sucht einen warmen Mantel für den Winter. Schon im Schaufenster sieht sie den blauen Mantel und die rote Jacke."
      q: Was sucht Lena im Kaufhaus?
      options:
        - Einen warmen Mantel
        - Eine rote Jacke
        - Ein gestreiftes Hemd
        - Neue Schuhe
      answer: 0
    explanation: "The text says: Lena sucht einen warmen Mantel für den Winter."
  - type: reading_comprehension
    group: reading
    content:
      passage: "Im ersten Stock ist die Kleidung für Damen. Die Auswahl ist wirklich groß. Neben den Mänteln hängen die Kleider, die Röcke und die warmen Pullover."
      q: Wo ist die Kleidung für Damen?
      options:
        - Im Schaufenster
        - Im ersten Stock
        - Im Erdgeschoss
        - Neben der Kasse
      answer: 1
    explanation: "The text says: Im ersten Stock ist die Kleidung für Damen."
  - type: reading_comprehension
    group: reading
    content:
      passage: "Sie probiert den blauen Mantel an. Er ist schön, aber der Ärmel ist ein bisschen zu lang, und der Mantel ist auch ein wenig zu weit."
