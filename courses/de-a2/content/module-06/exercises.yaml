      options:
        - Er ist zu teuer
        - Er ist zu klein
        - Der Ärmel ist zu lang und er ist zu weit
        - Die Farbe gefällt nicht
      answer: 2
    explanation: "The text says: der Ärmel ist ein bisschen zu lang, und der Mantel ist auch ein wenig zu weit."
  - type: reading_comprehension
    group: reading
    content:
      passage: "Lena probiert auch den grauen Mantel an. Dieser Mantel passt perfekt."
      q: Welcher Mantel passt Lena perfekt?
      options:
        - Der blaue Mantel
        - Der rote Mantel
        - Der alte Mantel
        - Der graue Mantel
      answer: 3
    explanation: "The text says: Lena probiert auch den grauen Mantel an. Dieser Mantel passt perfekt."
  - type: reading_comprehension
    group: reading
    content:
      passage: "An einem großen Tisch liegt das Sonderangebot. Heute sind alle Schuhe reduziert. Lena nimmt die schwarzen Schuhe und probiert sie an."
      q: Warum sind die Schuhe heute billig?
      options:
        - Sie sind im Sonderangebot
        - Sie sind alt
        - Sie sind kaputt
        - Sie sind zu klein
      answer: 0
    explanation: "The text says: An einem großen Tisch liegt das Sonderangebot. Heute sind alle Schuhe reduziert."
  - type: reading_comprehension
    group: reading
    content:
      passage: '„Bewahren Sie die Quittung gut auf", sagt sie. „Dann können Sie jeden Artikel umtauschen."'
      q: Warum soll Lena die Quittung aufbewahren?
      options:
        - Dann bezahlt sie mehr
        - Dann kann sie die Ware umtauschen
        - Dann geht sie in die Umkleidekabine
        - Dann findet sie ihre Größe
      answer: 1
    explanation: "The text says: Bewahren Sie die Quittung gut auf. Dann können Sie jeden Artikel umtauschen."

