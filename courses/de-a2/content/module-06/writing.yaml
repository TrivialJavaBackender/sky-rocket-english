# Modul 06 · Kleidung und Einkaufen — production: a conversation in a shop.
# mode: speaking, hence no word_target (the schema forbids it for speaking).
# The model shows the grammar of module 06: the adjective after der, das, die
# (den blauen Mantel, der graue Mantel), dieser Mantel and the short answer
# (den nehme ich). The module vocabulary runs through the dialogue.
mode: speaking
genre: a conversation in a shop
prompt: |
  You are in a department store buying clothes. Act out the conversation
  between the customer and the shop assistant, in German (1–2 minutes).
  Record it on your phone.

  Cover these four points:
  - say which garment you are looking for (a coat, a dress, shoes) and in
    which colour
  - give your size and ask whether you may try it on
  - say how it fits: zu eng, zu weit, zu lang or gut
  - ask the price and whether you can exchange the item later
model_answer: |
  — Guten Tag! Ich suche einen warmen Mantel für den Winter. Haben Sie den
  blauen Mantel aus dem Schaufenster auch in meiner Größe?
  — Guten Tag! Ja, natürlich. Welche Größe haben Sie?
  — Ich habe Größe achtunddreißig. Darf ich den blauen Mantel anprobieren?
  — Gern. Die Umkleidekabine ist dort hinten.
  — Danke … Der Mantel ist schön, aber die Ärmel sind ein bisschen zu lang,
  und er ist ein wenig zu weit.
  — Dann probieren Sie doch den grauen Mantel. Der ist etwas kleiner.
  — Ja, dieser Mantel passt perfekt. Was kostet er?
  — Er ist heute reduziert und kostet nur sechzig Euro.
  — Sehr gut, den nehme ich. Kann ich den Mantel später umtauschen?
  — Kein Problem. Bewahren Sie nur die Quittung gut auf.
checklist:
  - I name the garment, the colour and my size
  - "I ask politely: Darf ich … anprobieren? Was kostet …?"
  - "The adjective after der, das, die has the right ending: der blaue Mantel, den blauen Mantel"
  - "I use dieser or jeder and the short answer: Den nehme ich"
  - The conversation runs 1–2 minutes and is recorded
