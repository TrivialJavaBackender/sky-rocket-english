# Modul 06 · Kleidung und Einkaufen — module head.
# grammar_points: 6 points, exactly the grammar list on the module card (PLAN.md §4).
# Scaffolding is English (PLAN.md §5); the module title stays German.
# standfirst copied verbatim from course.yaml.
slug: m06
title: Kleidung und Einkaufen
standfirst: "Adjective endings after the definite article · 30 words · a conversation in a shop."
goals:
  - text: Name clothes, sizes and colours and ask for them in a shop
    achieved_by: input
  - text: "Give the adjective before a noun its right ending: der neue Mantel, den neuen Mantel"
    achieved_by: workout
  - text: Point at a particular garment with dieser and jeder
    achieved_by: workout
  - text: Hold a conversation in a shop — ask, try on, buy and exchange
    achieved_by: output
grammar_points:
  - The adjective after der, das, die in the nominative (der neue Mantel, das rote Kleid, die neuen Schuhe)
  - The adjective after der, das, die in the accusative (only the masculine changes)
  - dieser and jeder (dieser Mantel, jede Jacke, jeden Tag)
  - der, das, die as a short answer („Welchen nimmst du?" — „Den da.")
  - dieser or jeder together with an adjective (Dieser gestreifte Pullover ist zu eng)
  - The endings after der, das, die, den at a glance — nominative and accusative
production:
  mode: speaking
  genre: a conversation in a shop
