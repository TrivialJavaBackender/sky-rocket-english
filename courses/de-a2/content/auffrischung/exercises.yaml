    group: grammar
    content:
      pre: "Fatima "
      post: " Informatik an der Universität."
      options: [studiere, studierst, studiert, studieren]
      answer: 2
    explanation: "Fatima = sie, so the ending is -t: sie studiert."
  - type: mc_cloze
    group: grammar
    content:
      pre: "Wir "
      post: " aus neun verschiedenen Ländern."
      options: [bin, bist, ist, sind]
      answer: 3
    explanation: "wir + sein = sind."
  - type: mc_cloze
    group: grammar
    content:
      pre: ""
      post: " du Zeit am Mittwoch?"
      options: [Hast, Habe, Hat, Habt]
      answer: 0
    explanation: "du + haben = hast. A yes/no question starts with the verb."
  - type: mc_cloze
    group: grammar
    content:
      pre: "Wie alt "
      post: " deine Schwester?"
      options: [bin, bist, ist, sind]
      answer: 2
    explanation: "deine Schwester = sie, so the form is ist. Age goes with sein."
  - type: open_cloze
