      answers: [ist]
      answer_shown: ist
    explanation: "er + sein = ist. A job takes no article."
  - type: open_cloze
    group: grammar
    content:
      pre: "Wir "
      post: " zwei Kinder, einen Sohn und eine Tochter."
      answers: [haben]
      answer_shown: haben
    explanation: "wir + haben = haben. The form is the same as the infinitive."
  - type: open_cloze
    group: grammar
    content:
      pre: "Sprichst du Englisch? — Nein, "
      post: " Englisch spreche ich nicht."
      answers: [aber]
      answer_shown: aber
