  - type: open_cloze
    group: grammar
    content:
      pre: "Das ist Frau Weber. "
      post: " ist unsere Lehrerin."
      answers: [sie]
      answer_shown: Sie
    explanation: "Frau Weber is one person = sie. The pronoun replaces the name."
  - type: open_cloze
    group: grammar
    content:
      pre: ""
      post: " alt bist du? — Ich bin 32."
      answers: [wie]
      answer_shown: Wie
    explanation: "Wie alt …? asks for someone's age."
  - type: grammar_drill
    group: grammar
    content:
      pre: "Ihr "
      post: " sehr schnell Deutsch."
      prompt: LERNEN
      options: [lerne, lernst, lernt, lernen]
      answer: 2
    explanation: "ihr takes stem + -t: ihr lernt."
  - type: grammar_drill
    group: grammar
    content:
      pre: "Ich "
      post: " den Namen: N-o-w-a-k."
      prompt: BUCHSTABIEREN
      options: [buchstabiere, buchstabierst, buchstabiert, buchstabieren]
      answer: 0
    explanation: "ich takes stem + -e: ich buchstabiere."
  - type: grammar_drill
    group: grammar
    content:
      pre: ""
      post: " machst du am Wochenende?"
      prompt: SACHE
      options: [Wer, Wo, Was, Wie]
      answer: 2
    explanation: "was asks about a thing or an activity."
  - type: grammar_drill
    group: grammar
    content:
      pre: "Frau Weber "
      post: " sehr langsam und deutlich."
      prompt: SPRECHEN
      options: [spreche, sprichst, spricht, sprechen]
      answer: 2
    explanation: "Frau Weber = sie, and sie takes the form spricht."
  - type: error_correction
    group: grammar
    content:
      words: [Wie, alt, hast, "du?"]
      wrong: 2
      correction: "hast → bist"
    explanation: "Age goes with sein: Wie alt bist du?"
  - type: error_correction
    group: grammar
    content:
      words: [Ich, bin, eine, Lehrerin, in, "Leipzig."]
      wrong: 2
      correction: "eine → (nichts)"
    explanation: "No article in front of a job: Ich bin Lehrerin."
  - type: error_correction
    group: grammar
    content:
      words: [Wo, ihr, wohnt, "?"]
      wrong: 1
      correction: "ihr wohnt → wohnt ihr"
    explanation: "The verb follows the question word directly: Wo wohnt ihr?"
  - type: word_formation
    group: vocab
    content:
      pre: "Meine "
      post: " ist Arabisch."
      prompt: die Mutter + die Sprache
      answers: [Muttersprache]
      answer_shown: Muttersprache
    explanation: "Two nouns become one word: die Mutter + die Sprache = die Muttersprache."
  - type: collocation_match
    group: vocab
    content:
      left: [Kaffee, Deutsch, einen Kurs, Leute]
      right: [besuchen, trinken, kennenlernen, lernen]
      pairs: { 0: 1, 1: 3, 2: 0, 3: 2 }
    explanation: "Kaffee trinken, Deutsch lernen, einen Kurs besuchen, Leute kennenlernen."
  - type: key_word_transformation
    group: grammar
    content:
      s1: Wie ist Ihr Name?
      key: polite form (Sie)
      pre: "Wie "
      post: " Sie?"
      answers: [heißen]
      hint: 1 Wort
      answer_shown: heißen
    explanation: "Wie ist Ihr Name? and Wie heißen Sie? mean the same. Polite Sie takes stem + -en."
