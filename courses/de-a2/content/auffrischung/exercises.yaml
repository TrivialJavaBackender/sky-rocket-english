# Modul 01 · Ich und du — 52 Aufgaben im Kern, 20 im Wiederholungspool.
# Verteilung laut Profil (courses/de-a2/PLAN.md §6): 6 mc_cloze · 8 open_cloze ·
# 6 word_formation · 4 key_word_transformation · 8 grammar_drill ·
# 6 error_correction · 8 collocation_match · 6 reading_comprehension.
#
# Kein spiralisches Wiederholen: M1 ist das erste Modul, es gibt noch keinen
# Stoff davor. Ab M2 gehören 2–3 Aufgaben dem vorherigen Modul.
core:
  # ───────────────────────── Multiple Choice ─────────────────────────
  - type: mc_cloze
    group: grammar
    content:
      pre: "Marek "
      post: " aus Polen und wohnt jetzt in Leipzig."
      options: [komme, kommst, kommt, kommen]
      answer: 2
    explanation: "Marek = er. With er/sie/es the verb ends in -t: er kommt."
  - type: mc_cloze
    group: grammar
    content:
      pre: "Ich "
      post: " Köchin und arbeite in einem Restaurant."
      options: [bin, bist, ist, sind]
      answer: 0
    explanation: "ich + sein = bin. A job takes no article: Ich bin Köchin."
  - type: mc_cloze
    group: grammar
    content:
      pre: ""
      post: " ihr noch Fragen zum Kurs?"
      options: [Habe, Hast, Hat, Habt]
      answer: 3
    explanation: "ihr + haben = habt. With no question word the question starts with the verb."
  - type: mc_cloze
    group: grammar
    content:
      pre: ""
      post: " wohnst du? — In der Bahnhofstraße."
      options: [Woher, Wo, Wohin, Wer]
      answer: 1
    explanation: "wo asks where you are. woher asks where you come from: Woher kommst du?"
  - type: mc_cloze
    group: grammar
    content:
      pre: "Meine Schwester "
      post: " zwei Kinder."
      options: [hat, habe, hast, haben]
      answer: 0
    explanation: "Meine Schwester = sie. sie + haben = hat."
  - type: mc_cloze
    group: grammar
    content:
      pre: "Wie "
      post: " Sie? — Mein Name ist Weber."
      options: [heiße, heißt, heißen, heißst]
      answer: 2
    explanation: "Polite Sie takes stem + -en: Wie heißen Sie? Use Sie with anyone you do not know."

  # ───────────────────────── Lückentext ─────────────────────────
  - type: open_cloze
    group: grammar
    content:
      pre: "Ich komme "
      post: " Polen, aus Krakau."
      answers: [aus]
      answer_shown: aus
    explanation: "Origin is kommen aus + country or town: Ich komme aus Italien, aus Wien."
  - type: open_cloze
    group: grammar
    content:
      pre: "Ich "
      post: " Koch von Beruf."
      answers: [bin]
      answer_shown: bin
    explanation: "ich + sein = bin. A job goes with sein and with no article."
  - type: open_cloze
    group: grammar
    content:
      pre: "Wie alt "
      post: " du? — Ich bin 27."
      answers: [bist]
      answer_shown: bist
    explanation: "du + sein = bist. Age always goes with sein, never with haben."
  - type: open_cloze
    group: grammar
    content:
      pre: "Anna "
      post: " zwei Brüder und eine Schwester."
      answers: [hat]
      answer_shown: hat
    explanation: "Anna = sie. sie + haben = hat — an irregular form."
  - type: open_cloze
    group: grammar
    content:
      pre: ""
      post: " ihr aus Spanien? — Nein, wir kommen aus Portugal."
      answers: [seid]
      answer_shown: seid
    explanation: "ihr + sein = seid. The answer wir kommen shows the question is aimed at several people."
  - type: open_cloze
    group: grammar
    content:
      pre: "Ich spreche Polnisch "
      post: " Englisch, aber nur wenig Deutsch."
      answers: [und]
      answer_shown: und
    explanation: "und joins two matching parts. What follows is the contrast, marked by aber."
  - type: open_cloze
    group: grammar
    content:
      pre: "Entschuldigung, ich verstehe Sie "
      post: ". Sprechen Sie bitte langsam."
      answers: [nicht]
      answer_shown: nicht
    explanation: "nicht negates the verb and goes to the end: Ich verstehe Sie nicht."
  - type: open_cloze
    group: grammar
    content:
      pre: ""
      post: " kommst du? — Aus der Türkei."
      answers: [woher]
      answer_shown: Woher
    explanation: "The answer names a country, so the question word is woher. wo would ask for the place, wohin for the direction."

  # ───────────────────────── Wortbildung ─────────────────────────
  - type: word_formation
    group: vocab
    content:
      pre: "Ich komme aus Polen. Meine Muttersprache ist "
      post: "."
      prompt: Polen
      answers: [Polnisch]
      answer_shown: Polnisch
    explanation: "The country is Polen, the language is Polnisch. Language names take a capital."
  - type: word_formation
    group: vocab
    content:
      pre: "Ich komme aus Italien und spreche natürlich "
      post: "."
      prompt: Italien
      answers: [Italienisch]
      answer_shown: Italienisch
    explanation: "Italien is the country, Italienisch the language. The ending is usually -isch."
  - type: word_formation
    group: vocab
    content:
      pre: "Meine Frau ist "
      post: " und arbeitet in einem Restaurant."
      prompt: der Koch
      answers: [Köchin]
      answer_shown: Köchin
    explanation: "The feminine form ends in -in: der Koch → die Köchin, der Arzt → die Ärztin."
  - type: word_formation
    group: vocab
    content:
      pre: "Frau Weber ist "
      post: " an einer Sprachschule."
      prompt: der Lehrer
      answers: [Lehrerin]
      answer_shown: Lehrerin
    explanation: "der Lehrer → die Lehrerin. A job takes no article: Sie ist Lehrerin."
  - type: word_formation
    group: vocab
    content:
      pre: "Wie ist deine "
      post: "? — 0341 555 12 34."
      prompt: das Telefon + die Nummer
      answers: [Telefonnummer]
      answer_shown: Telefonnummer
    explanation: "Two nouns become one word: das Telefon + die Nummer = die Telefonnummer."
  - type: word_formation
    group: vocab
    content:
      pre: "Meine Schwester ist "
      post: " an der Universität in München."
      prompt: der Student
      answers: [Studentin]
      answer_shown: Studentin
    explanation: "The feminine form ends in -in: der Student → die Studentin."

  # ───────────────────────── Umformung ─────────────────────────
  - type: key_word_transformation
    group: grammar
    content:
      s1: Mein Name ist Marek.
      key: heißen (ich-form)
      pre: "Ich "
      post: " Marek."
      answers: [heiße]
      hint: 1 Wort
      answer_shown: heiße
    explanation: "Mein Name ist … and Ich heiße … mean the same thing. ich + heißen = heiße."
  - type: key_word_transformation
    group: grammar
    content:
      s1: Ich bin Koch von Beruf.
      key: name the job with arbeiten
      pre: "Ich "
      post: " Koch."
      answers: [arbeite als]
      hint: 2 Wörter
      answer_shown: arbeite als
    explanation: "arbeiten als + job, with no article: Ich arbeite als Koch."
  - type: key_word_transformation
    group: grammar
    content:
      s1: Du kommst aus Spanien, oder?
      key: WOHER
      pre: ""
      post: " du?"
      answers: [woher kommst]
      hint: 2 Wörter
      answer_shown: Woher kommst
    explanation: "A yes/no question becomes a W-question. The verb follows the question word directly: Woher kommst du?"
  - type: key_word_transformation
    group: grammar
    content:
      s1: Ich bin nicht verheiratet.
      key: LEDIG
      pre: "Ich "
      post: "."
      answers: [bin ledig]
      hint: 2 Wörter
      answer_shown: bin ledig
    explanation: "ledig is the opposite of verheiratet. On a form the field is called Familienstand: ledig."

  # ───────────────────────── Grammatik-Drill ─────────────────────────
  - type: grammar_drill
    group: grammar
    content:
      pre: "Du "
      post: " sehr gut Deutsch."
      prompt: SPRECHEN
      options: [spreche, sprichst, spricht, sprechen]
      answer: 1
    explanation: "sprechen has special forms. Learn them as one word: ich spreche, du sprichst, er spricht."
  - type: grammar_drill
    group: grammar
    content:
      pre: "Wir "
      post: " zusammen Deutsch."
      prompt: LERNEN
      options: [lerne, lernst, lernt, lernen]
      answer: 3
    explanation: "wir takes stem + -en. The form looks like the infinitive: wir lernen."
  - type: grammar_drill
    group: grammar
    content:
      pre: "Ich "
      post: " seit einem Jahr in Leipzig."
      prompt: WOHNEN
      options: [wohne, wohnst, wohnt, wohnen]
      answer: 0
    explanation: "ich takes stem + -e: ich wohne."
  - type: grammar_drill
    group: grammar
    content:
      pre: "Ihr "
      post: " aus Marokko, richtig?"
      prompt: KOMMEN
      options: [komme, kommst, kommt, kommen]
      answer: 2
    explanation: "ihr takes stem + -t: ihr kommt — the same ending as er/sie/es."
  - type: grammar_drill
    group: grammar
    content:
      pre: "Das "
      post: " meine Schwester Lena."
      prompt: SEIN
      options: [bin, ist, sind, bist]
      answer: 1
    explanation: "Das ist … introduces a person. Das counts as es, so the form is ist."
  - type: grammar_drill
    group: grammar
    content:
      pre: "Wie "
      post: " man Ihren Namen?"
      prompt: SCHREIBEN
      options: [schreibt, schreibe, schreibst, schreiben]
      answer: 0
    explanation: "man behaves like er/sie/es, so the ending is -t: Wie schreibt man das?"
  - type: grammar_drill
    group: grammar
    content:
      pre: "Meine Eltern "
      post: " noch in Krakau."
      prompt: WOHNEN
      options: [wohne, wohnst, wohnt, wohnen]
      answer: 3
    explanation: "Meine Eltern is more than one person = sie. The ending is -en: sie wohnen."
  - type: grammar_drill
    group: grammar
    content:
      pre: ""
      post: " ist das? — Das ist Frau Weber, unsere Lehrerin."
      prompt: PERSON
      options: [Was, Wie, Wer, Wo]
      answer: 2
    explanation: "wer asks about a person, was about a thing."

  # ───────────────────────── Fehlersuche ─────────────────────────
  - type: error_correction
    group: grammar
    content:
      words: [Ich, habe, "25", Jahre, "alt."]
      wrong: 1
      correction: "habe → bin"
    explanation: "Age goes with sein: Ich bin 25 Jahre alt."
  - type: error_correction
    group: grammar
    content:
      words: [Woher, du, kommst, "?"]
      wrong: 1
      correction: "du kommst → kommst du"
    explanation: "The verb follows the question word directly: Woher kommst du?"
  - type: error_correction
    group: grammar
    content:
      words: [Ich, bin, ein, Student, aus, "Polen."]
      wrong: 2
      correction: "ein → (nichts)"
    explanation: "No article in front of a job, and Student counts as one: Ich bin Student."
  - type: error_correction
    group: grammar
    content:
      words: [Meine, Schwester, sprechen, sehr, gut, "Deutsch."]
      wrong: 2
      correction: "sprechen → spricht"
    explanation: "Meine Schwester = sie, and sie takes the form spricht."
  - type: error_correction
    group: grammar
    content:
      words: [Meine, Eltern, wohnt, in, "Krakau."]
      wrong: 2
      correction: "wohnt → wohnen"
    explanation: "Meine Eltern is more than one person = sie. The ending is -en: sie wohnen."
  - type: error_correction
    group: grammar
    content:
      words: [Wir, seid, alle, im, gleichen, "Kurs."]
      wrong: 1
      correction: "seid → sind"
    explanation: "wir + sein = sind. seid belongs to ihr."

  # ───────────────────────── Wörter verbinden ─────────────────────────
  - type: collocation_match
    group: vocab
    content:
      left: [Deutsch, ein Formular, den Namen, eine Frage]
      right: [buchstabieren, sprechen, stellen, ausfüllen]
      pairs: { 0: 1, 1: 3, 2: 0, 3: 2 }
    explanation: "Set combinations: Deutsch sprechen, ein Formular ausfüllen, den Namen buchstabieren, eine Frage stellen."
  - type: collocation_match
    group: vocab
    content:
      left: [der Vorname, der Nachname, das Alter, die Adresse]
      right: ["Nowak", "Bahnhofstraße 12", "Marek", "32 Jahre"]
      pairs: { 0: 2, 1: 0, 2: 3, 3: 1 }
    explanation: "On the form: Vorname Marek, Nachname Nowak, Alter 32 Jahre, Adresse Bahnhofstraße 12."
  - type: collocation_match
    group: vocab
    content:
      left: [Polen, Krakau, Koch, Polnisch]
      right: [die Stadt, das Land, die Sprache, der Beruf]
      pairs: { 0: 1, 1: 0, 2: 3, 3: 2 }
    explanation: "Polen is a country, Krakau a town, Koch a job, Polnisch a language."
  - type: collocation_match
    group: grammar
    content:
      left: [ich, du, er, wir]
      right: [bist, sind, bin, ist]
      pairs: { 0: 2, 1: 0, 2: 3, 3: 1 }
    explanation: "sein: ich bin, du bist, er ist, wir sind."
  - type: collocation_match
    group: grammar
    content:
      left: [ich, du, ihr, sie]
      right: [habt, hast, haben, habe]
      pairs: { 0: 3, 1: 1, 2: 0, 3: 2 }
    explanation: "haben: ich habe, du hast, ihr habt, sie haben."
  - type: collocation_match
    group: grammar
    content:
      left: [Woher, Wo, Wie, Was]
      right: ["wohnst du?", "machst du?", "kommst du?", "heißt du?"]
      pairs: { 0: 2, 1: 0, 2: 3, 3: 1 }
    explanation: "woher → where from, wo → where, wie → the name, was → the thing."
  - type: collocation_match
    group: vocab
    content:
      left: [verheiratet, ledig, langsam, gern]
      right: [nicht schnell, mit Freude, hat eine Familie, nicht verheiratet]
      pairs: { 0: 2, 1: 3, 2: 0, 3: 1 }
    explanation: "verheiratet and ledig are opposites. langsam is the opposite of schnell. gern marks something you enjoy."
  - type: collocation_match
    group: vocab
    content:
      left: [sich vorstellen, kennenlernen, wiederholen, verstehen]
      right: [noch einmal sagen, den eigenen Namen sagen, wissen was es bedeutet, zum ersten Mal treffen]
      pairs: { 0: 1, 1: 3, 2: 0, 3: 2 }
    explanation: "These four verbs come up in the first lesson of any course."

  # ───────────────────────── Leseverstehen ─────────────────────────
  - type: reading_comprehension
    group: reading
    content:
      passage: "Marek Nowak ist 32 Jahre alt und kommt aus Polen, aus Krakau. Seit einem Jahr wohnt er in Leipzig. Von Beruf ist er Koch und arbeitet in einem kleinen Restaurant in der Nähe vom Bahnhof."
      q: Was macht Marek in Leipzig?
      options:
        - Er studiert an der Universität.
        - Er arbeitet als Koch.
        - Er sucht eine Wohnung.
        - Er besucht seine Familie.
      answer: 1
    explanation: "The text says: Von Beruf ist er Koch und arbeitet in einem kleinen Restaurant."
  - type: reading_comprehension
    group: reading
    content:
      passage: "Seine Muttersprache ist Polnisch, aber er spricht auch Englisch und ein bisschen Deutsch. „Am Anfang war alles schwer“, sagt er. „Ich verstehe die Leute hier oft nicht, und sie sprechen sehr schnell.“"
      q: Welche Sprache spricht Marek am besten?
      options:
        - Polnisch
        - Deutsch
        - Englisch
        - Alle drei gleich gut
      answer: 0
    explanation: "Polnisch is his mother tongue — his first language. He speaks only a little German."
  - type: reading_comprehension
    group: reading
    content:
      passage: "Zweimal pro Woche besucht Marek einen Sprachkurs. Der Kurs beginnt am Montag und am Mittwoch um 18 Uhr. In der ersten Stunde stellt sich jeder kurz vor: Name, Land, Beruf."
      q: Wie oft geht Marek in den Sprachkurs?
      options:
        - Jeden Tag
        - Einmal pro Woche
        - Am Wochenende
        - Zweimal pro Woche
      answer: 3
    explanation: "The text says: Zweimal pro Woche — am Montag und am Mittwoch."
  - type: reading_comprehension
    group: reading
    content:
      passage: "Im Kurs sind vierzehn Leute aus neun Ländern. Neben Marek sitzt Fatima. Sie kommt aus Marokko, ist 27 und ledig. Sie studiert Informatik an der Universität und spricht schon sehr gut Deutsch."
      q: Was wissen wir über Fatima?
      options:
        - Sie ist verheiratet und hat Kinder.
        - Sie arbeitet in einem Restaurant.
        - Sie studiert und ist nicht verheiratet.
        - Sie lernt seit einem Monat Deutsch.
      answer: 2
    explanation: "The text says: ist 27 und ledig … Sie studiert Informatik. ledig means not married."
  - type: reading_comprehension
    group: reading
    content:
      passage: "Am Ende der Stunde bekommt jeder ein Formular. Alle füllen es aus: Vorname, Nachname, Alter, Adresse, Telefonnummer, E-Mail-Adresse. Marek schreibt seine neue Adresse in Leipzig hinein."
      q: Welche Adresse schreibt Marek in das Formular?
      options:
        - Seine Adresse in Leipzig
        - Seine alte Adresse in Krakau
        - Die Adresse vom Restaurant
        - Die Adresse der Sprachschule
      answer: 0
    explanation: "The text says: seine neue Adresse in Leipzig. The old address in Krakau is not on the form."
  - type: reading_comprehension
    group: reading
    content:
      passage: "Marek ist verheiratet, aber seine Frau wohnt noch in Krakau. Im Sommer kommt sie nach Deutschland. Nach dem Kurs gehen einige Leute zusammen in ein Café. Sie trinken Kaffee und sprechen Deutsch — langsam, mit vielen Fehlern, aber sie sprechen."
      q: Warum sprechen die Leute im Café Deutsch?
      options:
        - Weil sie keine andere Sprache können.
        - Weil sie üben wollen.
        - Weil die Lehrerin dabei ist.
        - Weil im Café nur Deutsch erlaubt ist.
      answer: 1
    explanation: "They speak slowly and with many mistakes — but they speak. That is practice, not mastery."

# ───────────────────────── Wiederholungspool ─────────────────────────
# 20 kurze Aufgaben für das Modul-Quiz und die Wiederholung nach 7 und 21 Tagen.
# Dazu kommen 8 Aufgaben aus theory.yaml (cloze_cards).
review_pool:
