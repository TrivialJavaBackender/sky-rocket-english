# Modul 01 · Ich und du — 30 Wörter zu Person, Herkunft, Beruf und Sprachkurs.
# `definition` ist eine einfache Umschreibung auf A2 plus Synonym oder Gegenteil —
# kein Wörterbuchstil (courses/de-a2/PLAN.md §5).
entries:
  - term: heißen
    tag: Verb
    definition: to be called; the verb for saying your name (Wie heißt du?)
    use_cases:
      - Ich heiße Marek und komme aus Polen.
      - Wie heißt deine Lehrerin? — Sie heißt Frau Weber.
    collocations: Wie heißt du? · Wie heißen Sie? · Ich heiße …
    register: "Neutral. Formell: Mein Name ist …"

  - term: kommen aus
    tag: Verb
    definition: to come from a country or a town (Woher kommst du?)
    use_cases:
      - Ich komme aus Italien, aus Neapel.
      - Woher kommt ihr? — Wir kommen aus der Türkei.
    collocations: kommen aus + Land · Woher kommst du?
    register: Neutral

  - term: wohnen
    tag: Verb
    definition: to live somewhere, to have your home there
    use_cases:
      - Ich wohne seit zwei Jahren in Leipzig.
      - Wo wohnst du? — In der Bahnhofstraße.
    collocations: wohnen in + Stadt · Wo wohnst du?
    register: Neutral

  - term: sprechen
    tag: Verb
    definition: to speak — a language, or to a person
    use_cases:
      - Ich spreche Polnisch, Englisch und ein bisschen Deutsch.
      - Sprechen Sie bitte langsam!
    collocations: Deutsch sprechen · mit jemandem sprechen · langsam sprechen
    register: "Neutral. Das Verb ist unregelmäßig: du sprichst, er spricht."

  - term: die Sprache
    tag: Nomen
    definition: a language, e.g. German or Polish
    use_cases:
      - Deutsch ist keine leichte Sprache.
      - Wie viele Sprachen sprichst du?
    collocations: eine Sprache lernen · eine Sprache sprechen · die Fremdsprache
    register: "Plural: die Sprachen"

  - term: die Muttersprache
    tag: Nomen
    definition: mother tongue; the first language, learned at home
    use_cases:
      - Meine Muttersprache ist Arabisch.
      - Er spricht Deutsch fast wie eine Muttersprache.
    collocations: die Muttersprache sein · in der Muttersprache
    register: Neutral

  - term: der Beruf
    tag: Nomen
    definition: job, profession — what you do for a living
    use_cases:
      - Was sind Sie von Beruf? — Ich bin Koch.
      - Mein Beruf gefällt mir sehr.
    collocations: von Beruf sein · einen Beruf lernen
    register: "Frage: Was sind Sie von Beruf?"

  - term: arbeiten als
    tag: Verb
    definition: to work as — to hold that job and be paid for it
    use_cases:
      - Ich arbeite als Koch in einem Restaurant.
      - Sie arbeitet als Ärztin im Krankenhaus.
    collocations: arbeiten als + Beruf · arbeiten bei + Firma · arbeiten in + Ort
    register: "Ohne Artikel: arbeiten als Koch, nicht als ein Koch."

  - term: studieren
    tag: Verb
    definition: to study at a university
    use_cases:
      - Ich studiere Medizin in München.
      - Was studierst du? — Informatik.
    collocations: an der Universität studieren · Medizin studieren
    register: "Nicht gleich lernen: studieren ist nur an der Universität."

  - term: verheiratet
    tag: Adjektiv
    definition: married; opposite of ledig
    use_cases:
      - Ich bin seit fünf Jahren verheiratet.
      - Sind Sie verheiratet? — Nein, ich bin ledig.
    collocations: verheiratet sein · verheiratet mit
    register: "Steht oft im Formular."

  - term: ledig
    tag: Adjektiv
    definition: single, not married
    use_cases:
      - "Familienstand: ledig."
      - Mein Bruder ist noch ledig.
    collocations: ledig sein · der Familienstand
    register: "Formell. Im Gespräch sagt man oft: Ich bin Single."

  - term: das Alter
    tag: Nomen
    definition: age, the number of years (Wie alt bist du?)
    use_cases:
      - Bitte schreiben Sie Ihr Alter in das Formular.
      - Wir haben das gleiche Alter.
    collocations: das Alter angeben · im Alter von
    register: "Mit sein: Ich bin 25 Jahre alt."

  - term: die Adresse
    tag: Nomen
    definition: address — street, number and town
    use_cases:
      - Meine Adresse ist Bahnhofstraße 12, 04109 Leipzig.
      - Können Sie mir Ihre Adresse geben?
    collocations: die Adresse angeben · unter dieser Adresse wohnen
    register: "Plural: die Adressen"

  - term: die Telefonnummer
    tag: Nomen
    definition: phone number
    use_cases:
      - Wie ist deine Telefonnummer?
      - Er hat mir seine Telefonnummer gegeben.
    collocations: die Telefonnummer geben · die Nummer wählen
    register: "Kurz: die Nummer"

  - term: die E-Mail-Adresse
    tag: Nomen
    definition: email address; it always contains an @
    use_cases:
      - Schreiben Sie bitte Ihre E-Mail-Adresse hier.
      - Meine E-Mail-Adresse ist neu.
    collocations: die E-Mail-Adresse angeben · eine E-Mail schreiben
    register: Neutral

  - term: das Formular
    tag: Nomen
    definition: a form — a sheet asking for your name, address and age
    use_cases:
      - Bitte füllen Sie dieses Formular aus.
      - Das Formular hat zwei Seiten.
    collocations: ein Formular ausfüllen · ein Formular unterschreiben
    register: "Plural: die Formulare"

  - term: ausfüllen
    tag: Verb
    definition: to fill in a form
    use_cases:
      - Ich fülle das Formular für den Kurs aus.
      - Füllen Sie bitte alles auf Deutsch aus.
    collocations: ein Formular ausfüllen · einen Antrag ausfüllen
    register: "Trennbares Verb: Ich fülle … aus."

  - term: der Name
    tag: Nomen
    definition: name — Anna, Weber
    use_cases:
      - Mein Name ist Weber.
      - Wie schreibt man Ihren Namen?
    collocations: der Vorname · der Nachname · der Familienname
    register: "Formeller als heißen: Mein Name ist …"

  - term: der Vorname
    tag: Nomen
    definition: first name; in Anna Weber it is Anna
    use_cases:
      - "Vorname: Anna. Nachname: Weber."
      - Mein Vorname ist schwer für Deutsche.
    collocations: der Vorname und der Nachname
    register: "Steht immer im Formular."

  - term: der Nachname
    tag: Nomen
    definition: surname, family name; in Anna Weber it is Weber
    use_cases:
      - Mein Nachname ist Nowak.
      - Wie ist Ihr Nachname, bitte?
    collocations: der Nachname · der Familienname
    register: "Auch: der Familienname"

  - term: das Land
    tag: Nomen
    definition: a country
    use_cases:
      - Aus welchem Land kommst du?
      - In diesem Land spricht man drei Sprachen.
    collocations: aus einem Land kommen · das Heimatland
    register: "Plural: die Länder"

  - term: die Stadt
    tag: Nomen
    definition: a town, a city
    use_cases:
      - Leipzig ist eine schöne Stadt.
      - In welcher Stadt wohnst du?
    collocations: in der Stadt wohnen · die Großstadt · die Heimatstadt
    register: "Plural: die Städte"

  - term: kennenlernen
    tag: Verb
    definition: to get to know someone, to meet for the first time
    use_cases:
      - Im Kurs lerne ich viele Leute kennen.
      - Schön, Sie kennenzulernen!
    collocations: Leute kennenlernen · sich kennenlernen
    register: "Trennbar: Ich lerne sie kennen."

  - term: sich vorstellen
    tag: Verb
    definition: to introduce yourself, to say who you are
    use_cases:
      - Darf ich mich kurz vorstellen? Ich heiße Marek.
      - Jeder stellt sich in der ersten Stunde vor.
    collocations: sich kurz vorstellen · Darf ich mich vorstellen?
    register: "Trennbar, immer mit mich, dich, sich: Ich stelle mich vor."

  - term: buchstabieren
    tag: Verb
    definition: to spell — to say a word letter by letter (N-o-w-a-k)
    use_cases:
      - Können Sie Ihren Namen bitte buchstabieren?
      - "Ich buchstabiere langsam: M-a-r-e-k."
    collocations: den Namen buchstabieren · Wie buchstabiert man das?
    register: "Sehr nützlich am Telefon."

  - term: wiederholen
    tag: Verb
    definition: to repeat, to say or do something again
    use_cases:
      - Können Sie das bitte wiederholen?
      - Wir wiederholen die Wörter aus Modul eins.
    collocations: eine Frage wiederholen · den Stoff wiederholen
    register: "Wichtiger Satz im Kurs: Bitte wiederholen Sie das."

  - term: verstehen
    tag: Verb
    definition: to understand, to know what the words mean
    use_cases:
      - Entschuldigung, ich verstehe das nicht.
      - Verstehst du die Aufgabe?
    collocations: nichts verstehen · alles verstehen · falsch verstehen
    register: Neutral

  - term: langsam
    tag: Adjektiv
    definition: slowly; opposite of schnell
    use_cases:
      - Sprechen Sie bitte langsam!
      - Ich lerne langsam, aber ich lerne jeden Tag.
    collocations: langsam sprechen · langsam lesen
    register: "Gegenteil: schnell"

  - term: gern
    tag: Adverb
    definition: gladly, willingly — marks something you like doing
    use_cases:
      - Ich koche gern und fahre gern Fahrrad.
      - Trinkst du gern Kaffee? — Ja, sehr gern.
    collocations: gern machen · sehr gern · nicht gern
    register: "Auch: gerne. Beides ist richtig."

  - term: auch
    tag: Adverb
    definition: too, also — the same goes for a second person or thing
    use_cases:
      - Ich komme aus Polen. Meine Frau kommt auch aus Polen.
      - Sprichst du auch Englisch?
    collocations: ich auch · auch nicht
    register: "Antwort: Ich auch! / Ich auch nicht."
