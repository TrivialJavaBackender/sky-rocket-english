mode: writing
genre: a personal profile and a registration form
word_target: [50, 60]
prompt: |
  You are joining a language course. Write a short text about yourself
  for your teacher. 50–60 words, in German.

  Cover all five points:
  • your name, age and marital status
  • where you come from and where you live now
  • your job or your studies
  • which languages you speak
  • what you like doing

  End with a question to your teacher.
model_answer: |
  Hallo! Ich heiße Fatima Benali und bin 27 Jahre alt. Ich bin ledig.
  Ich komme aus Marokko, aus Casablanca, und wohne jetzt in Leipzig.
  Ich studiere Informatik an der Universität, im dritten Jahr.
  Meine Muttersprache ist Arabisch, aber ich spreche auch Französisch
  und Deutsch. Englisch verstehe ich nur ein bisschen. In meiner Freizeit
  lese ich gern und treffe Freunde. Wann beginnt der Kurs?
checklist:
  - 50–60 words
  - All five points are covered
  - It ends with a question — question word first, or the verb first
  - Every verb carries the right ending (ich heiße, ich wohne, ich studiere)
  - sein and haben are correct (ich bin, ich habe)
  - No article in front of a job (Ich bin Studentin, not eine Studentin)
  - Age is expressed with sein (Ich bin 27 Jahre alt)
  - At least eight words from the module appear
