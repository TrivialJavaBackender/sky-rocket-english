# Course skeleton — Deutsch A1 → A2, 40 hours (courses/de-a2/PLAN.md).
# See docs/COURSE-DESIGN-GUIDE.md for how the numbers below were derived.
#
# German core, English scaffolding (PLAN.md §5, boundary by field). Module titles
# stay German — they name the topic; block names, standfirsts and every step title
# are English, exactly as in courses/de-a1. The course ran on full immersion until
# July 2026; the decision to drop it and why is recorded in PLAN.md §5. Only this
# file's comments and the sibling PLAN.md are in Russian — they address the author,
# not the learner.
#
# Positions come from array order. A module's planned_minutes is the sum of the
# protocol's session minutes (55+55+55+45 = 210 = 3.5 h).
#
# 14 modules × 3.5 h + 5 h of assessment = 54 h. The budget is derived in
# PLAN.md §1 «Почему 54 часа» — it is the delta A1 → A2, not a course from zero.

slug: de-a2
language: de
name: Deutsch
level_label: A1 → A2
position: 3

# Length gate for `pnpm validate-content` (PLAN.md §6): text-main/text-extra
# word counts, both derived from body rather than authored.
content_profile:
  text_main: [280, 330]
  text_extra: [130, 150]

blocks:
  # Outside the 54 h and outside the gate (db/migrations/0008): the course
  # assumes the learner holds A1, and this block is the safety net for whoever
  # the placement test says has gaps. Open from the start, carries no checkpoint,
  # and no required module may lean on it — it can be skipped entirely.
  - slug: refresh
    name: Refresher
    optional: true
    color: '#7A7A7A'
    tint: '#F0EFEE'
    modules:
      - slug: a01
        dir: auffrischung
        title: Ich und du
        standfirst: The present tense, sein and haben, questions · 30 words · introduce yourself and others.

  - slug: a
    name: Telling stories
    color: '#C9622E'
    tint: '#FAEDE6'
    modules:
      - slug: m01
        dir: module-01
        title: Mein Wochenende
        standfirst: The perfect tense with haben and sein · 30 words · report on your weekend.
      - slug: m02
        dir: module-02
        title: Unterwegs
        standfirst: The dative and the prepositions that take it · 30 words · describe a route.
      - slug: m03
        dir: module-03
        title: Wohnen und Einrichten
        standfirst: Two-way prepositions, wo and wohin · 30 words · describe your own room.
      - slug: m04
        dir: module-04
        title: Geschenke und Gefälligkeiten
        standfirst: The dative as an object, mir and dir · 30 words · ask someone for a favour.
      - slug: m05
        dir: module-05
        title: Früher und heute
        standfirst: The simple past, als and wenn · 30 words · tell a story from your childhood.

  - slug: b
    name: Describing
    color: '#B8452F'
    tint: '#F9E9E6'
    modules:
      - slug: m06
        dir: module-06
        title: Kleidung und Einkaufen
        standfirst: Adjective endings after the definite article · 30 words · a conversation in a shop.
      - slug: m07
        dir: module-07
        title: Wohnungssuche
        standfirst: Adjective endings after ein- and with no article · 30 words · question a landlord.
      - slug: m08
        dir: module-08
        title: Vergleichen und Bewerten
        standfirst: Comparative and superlative · 30 words · compare things and judge them.
      - slug: m09
        dir: module-09
        title: Körper und Gesundheit
        standfirst: Reflexive verbs, dürfen and sollen · 30 words · give advice.

  - slug: c
    name: Connecting ideas
    color: '#8E3B5C'
    tint: '#F5E8EE'
    modules:
      - slug: m10
        dir: module-10
        title: Arbeit und Entscheidungen
        standfirst: Subordinate clauses with weil, dass and obwohl · 30 words · write a short application.
      - slug: m11
        dir: module-11
        title: Wünsche und Pläne
        standfirst: Konjunktiv II and zu + infinitive · 30 words · make a polite request and decline one.
      - slug: m12
        dir: module-12
        title: Gefühle und Beziehungen
        standfirst: Verbs with a fixed preposition and da-/wo- forms · 30 words · talk about feelings.
      - slug: m13
        dir: module-13
        title: Medien und Auskunft
        standfirst: Indirect questions and relative clauses · 30 words · ask for information.
      - slug: m14
        dir: module-14
        title: Umwelt und Gesellschaft
        standfirst: The present passive and the genitive · 30 words · explain and justify rules.

checkpoints:
  - slug: diagnostic
    kind: diagnostic
    dir: diagnostic
    title: Placement test · 40 tasks and the German grammar terms
    pass_mark: null
    planned_minutes: 60
  - slug: cp-a
    kind: block
    block: a
    dir: checkpoint-a
    title: Checkpoint A · Modules 1–5
    pass_mark: 75
    planned_minutes: 75
  - slug: cp-b
    kind: block
    block: b
    dir: checkpoint-b
    title: Checkpoint B · Modules 6–9
    pass_mark: 75
    planned_minutes: 75
  - slug: final
    kind: final
    block: c
    dir: final
    title: Final test · in the Goethe-Zertifikat A2 format
    pass_mark: 60
    planned_minutes: 90

# Four sessions per module, 210 minutes. Shorter than in en-c1 (270) because at
# A1–A2 concentration fades earlier — docs/COURSE-DESIGN-GUIDE.md §7. The step
# titles are English scaffolding (PLAN.md §5) and are word-for-word the ones in
# courses/de-a1/course.yaml: the same protocol should read the same in both
# German courses.
protocol:
  - type: prime
    title: Start
    planned_minutes: 55
    steps:
      - kind: opener
        title: Your goals this week
        detail: See what you'll be able to do by the end of the week
        minutes: 3
      - kind: reading
        title: Skim the text
        detail: Read once without a dictionary — just the gist
        minutes: 8
        config: { reading_kind: main, mode: skim }
      - kind: theory
        title: Grammar in focus · Part 1
        detail: Learn the first half of the rules — with a table and examples
        minutes: 16
        config: { part: 1, of: 2 }
      - kind: vocab
        title: Vocabulary · 1 of 3
        detail: Learn the first words and mark the most important
        minutes: 20
        config: { batch: 1, of: 3 }
      - kind: flashcards_intro
        title: New cards into your deck
        detail: This module's words join your daily review
        minutes: 8

  - type: input
    title: Reading
    planned_minutes: 55
    steps:
      - kind: review_slot
        title: Review
        detail: Solve 8 tasks from your review queue
        minutes: 10
        config: { count: 8 }
      - kind: vocab
        title: Vocabulary · 2 of 3
        detail: You'll meet these words in the text in a moment
        minutes: 8
        config: { batch: 2, of: 3 }
      - kind: reading
        title: Reading with glosses
        detail: Hunt for this module's words and rules in the text
        minutes: 12
        config: { reading_kind: main, mode: close }
      - kind: exercise_set
        title: Reading check
        detail: Show you caught the details too
        minutes: 7
        config: { types: [reading_comprehension] }
      - kind: vocab
        title: Vocabulary · 3 of 3
        detail: The last words before you practise
        minutes: 8
        config: { batch: 3, of: 3 }
      - kind: exercise_set
        title: Vocabulary drills
        detail: Practise until the words stick
        minutes: 10
        config: { group_key: vocab }

  - type: workout
    title: Training
    planned_minutes: 55
    steps:
      - kind: review_slot
        title: Review
        detail: Solve 8 tasks from your review queue
        minutes: 10
        config: { count: 8 }
      - kind: theory
        title: Grammar in focus · Part 2
        detail: The rest of the rules — you'll practise them right after
        minutes: 12
        config: { part: 2, of: 2 }
      - kind: exercise_set
        title: Drills & gap-fill
        detail: Forms, endings and word order
        minutes: 18
        config: { types: [grammar_drill, open_cloze] }
      - kind: exercise_set
        title: Transform & fix
        detail: Reshape sentences and spot typical mistakes
        minutes: 10
        config: { types: [key_word_transformation, error_correction] }
      - kind: harvest
        title: Collect your mistakes
        detail: Every mistake comes back — in 2, 7 and 21 days
        minutes: 5

  - type: output
    title: Doing
    planned_minutes: 45
    steps:
      - kind: reading
        title: Second text
        detail: A dialogue on the topic — the material for your task
        minutes: 8
        config: { reading_kind: extra, mode: close }
      - kind: production
        title: Write or speak
        detail: Use this module's words and grammar yourself
        minutes: 20
      - kind: self_check
        title: Self-check
        detail: Compare with the model and go through the list
        minutes: 7
      - kind: module_quiz
        title: Module quiz
        detail: 10 tasks — then the module is done, review in 7 and 21 days
        minutes: 10
        config: { count: 10, pool: review }
