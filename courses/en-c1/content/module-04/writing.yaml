mode: speaking
genre: recorded monologue (Speaking Part 2 style)
prompt: |
  Record a monologue of 2–3 minutes on the topic below — an extended version of
  Cambridge Speaking Part 2, unscripted and in one take.

  TOPIC: The most useful thing you have ever learnt.

  Take one minute to plan, then speak. Cover, in any order:
  · what it was, and whether it was taught to you or picked up informally;
  · how you actually learnt it — the method, the false starts, the plateau;
  · what you remember of the effort now that the skill is automatic;
  · why it has proved more useful than things you worked harder for.

  While speaking, deliberately deploy the module's grammar: at least three
  gerund-or-infinitive contrasts where the choice carries meaning (stopped
  doing / stopped to do, remember doing / remember to do, went on doing / went
  on to do), one verb + object + infinitive (made me learn, encouraged me to
  try), and one to-as-preposition phrase (got used to doing, look forward to
  doing). Reach for this module's vocabulary where it fits naturally — five
  lexemes is a good target.

  Afterwards, listen to your recording once and note two grammar slips and one
  pronunciation habit to fix. Then shadow the model answer below: read it aloud
  twice, sentence by sentence, imitating the stress and rhythm of a confident
  speaker, and record one final take of your own monologue.
model_answer: |
  The most useful thing I have ever learnt is touch-typing, which I picked up
  at sixteen out of pure boredom and have used every working day since.

  Nobody made me learn it. There was a shabby program on the school computers,
  and I went on using it for about six weeks, twenty minutes a day, mostly
  because I liked watching the numbers go up. The first fortnight was
  genuinely unpleasant. I had been typing badly but quickly for years, so
  learning to do it properly meant getting slower before I got faster, and I
  remember wanting to give up almost every evening.

  What saved it was the shape of the practice. The program made me repeat the
  awkward letter combinations rather than the comfortable ones, so every
  session felt like failing. I hit a plateau at around forty words a minute
  and stayed there long enough to assume that was simply my ceiling. Then, in
  a week I cannot explain, it became automatic. I had internalised it, and I
  have never consciously thought about it since.

  What strikes me now is the contrast with everything I crammed for. I sat
  exams in subjects I could not discuss today for four minutes, and yet this
  one unexamined habit, learnt by trial and error at sixteen, has quietly
  saved me something like a year of my life.

  So if I were advising a student, I would tell them to look for the dull
  skills nobody assesses. Those are the ones you get used to relying on for
  thirty years.
checklist:
  - Speaks for a full 2–3 minutes without long silences or restarts
  - Names the skill and how it was learnt within the first two sentences
  - Uses at least three meaning-carrying gerund/infinitive contrasts accurately (stop, remember, go on, mean, try)
  - Includes one verb + object + infinitive (made me learn, encouraged me to try, let me use)
  - Includes one phrase where to is a preposition (get used to doing, look forward to doing)
  - Deploys five or more lexemes from this module naturally, not as a list
  - Narrates the learning as a process with a turning point, rather than listing facts about the skill
  - Ends with a rounded conclusion or a piece of advice rather than trailing off
