mode: writing
genre: formal application email
prompt: |
  You have seen this announcement on an international careers site:

  > **PROGRAMME COORDINATOR — GLOBAL MENTORING NETWORK**
  > We connect experienced professionals with young people entering their industries.
  > We are looking for an organised, personable coordinator to run our international
  > mentoring programme: recruiting mentors, matching pairs, and keeping a hundred
  > conversations on schedule across six time zones.
  > Apply in writing to Ms Elena Carter, explaining why your experience makes you
  > suitable and what you would bring to the role.

  Write your **letter of application** in **220–260 words** in an appropriate style.
  Present your experience with the perfect aspect, include at least one future form
  from this module, and keep the register formal from the first line to the last.
model_answer: |
  Dear Ms Carter,

  I am writing to apply for the position of Programme Coordinator with the Global
  Mentoring Network, advertised last week on your careers portal.

  For the past four years I have been coordinating exchange projects for an
  educational foundation in Warsaw, where I currently manage a portfolio of twelve
  partner schools. In that time I have taken on responsibility for scheduling,
  budgeting and volunteer support, and I have learnt to keep on top of competing
  deadlines without letting standards slip. Before that, I spent two years
  assisting a mentoring scheme for first-generation students — work I found
  demanding yet deeply rewarding.

  The advertised role appeals to me for two reasons. First, it would allow me to
  apply my coordination experience on a genuinely international scale. Secondly, I
  have long admired the Network's insistence that mentoring should be judged by
  outcomes rather than by good intentions. By the end of this year I will have
  completed a diploma in project management, which I believe would further
  strengthen my contribution.

  I am currently working out my notice period and would therefore be available
  from the first of March. Should you require references, my present employer
  would be glad to provide them.

  I would welcome the opportunity to discuss my application at interview, and I
  look forward to hearing from you.

  Yours sincerely,
  Anna Novak
checklist:
  - The first sentence names the post and where you saw it advertised
  - The register stays formal throughout — no contractions, no chatty idioms
  - Experience is presented with the perfect aspect (have been coordinating, have taken on), not a bare list of past simples
  - At least one future form with an edge appears (will have completed / am to / will be doing)
  - At least three module collocations are used naturally, without showing off
  - "Paragraphs follow the classic arc: purpose → experience → motivation → availability → closing"
  - The closing formula matches the opening (Dear Ms Carter → Yours sincerely)
  - Length is 220–260 words
