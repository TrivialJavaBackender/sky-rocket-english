mode: speaking
genre: comparative monologue (Speaking Part 2 style)
prompt: |
  Record a monologue of 2–3 minutes comparing two situations — the extended
  version of Cambridge Speaking Part 2, unscripted and in one take.

  There are no photographs here, so read the two scenes below carefully and
  build the pictures yourself before you start.

  SITUATION A. A classroom in a fee-paying school. Eleven pupils, one teacher
  and a second adult at the back. Long windows, a wall of books, a whiteboard
  covered in a half-finished argument. Two boys are standing up, mid-debate;
  the rest are turned towards them. On the noticeboard: a rowing fixture, a
  trip to Berlin, a talk by a former pupil who now runs a bank.

  SITUATION B. A classroom in a state secondary in a poorer part of the same
  city. Thirty-four pupils in a room built for twenty-eight, coats still on
  because the heating failed in November. One teacher, no assistant, a
  projector that has to be restarted twice a lesson. Three pupils share two
  textbooks. On the noticeboard: a food-bank leaflet, exam dates, a
  handwritten sign about the breakfast club.

  YOUR TASK: Compare the two situations, and say what you think each group of
  children is learning about the world beyond the subject on the board.

  Take one minute to plan, then speak. Cover, in any order:
  · what is immediately different, and what is quietly the same;
  · what each room gives a child that will not appear on any exam paper;
  · which differences money could close and which it probably could not;
  · what you would change first, and what you would not change at all.

  While speaking, deliberately deploy the module's grammar: at least one wish
  or if only (I wish somebody had told me…), one it's high time, one would
  rather about other people (I'd rather we admitted…), one as if / as though
  with an unreal past (as though it were another country), and one subjunctive
  (it is essential that every child have…). Reach for this module's vocabulary
  where it fits naturally — five or six lexemes is a good target.

  A warning worth taking seriously: this topic invites speeches. Describe
  before you judge, give the other side its best argument rather than its
  worst, and keep the two rooms in view throughout.

  Afterwards, listen to your recording once and note two grammar slips and one
  pronunciation habit to fix. Then shadow the model answer below: read it aloud
  twice, sentence by sentence, imitating the stress and rhythm of a confident
  speaker, and record one final take of your own.
model_answer: |
  The first thing that strikes me is the arithmetic. Eleven children in one
  room, thirty-four in the other, and most of the disparity follows from that.
  In the first, two boys are arguing while the teacher watches; in the second,
  one teacher faces a room built for twenty-eight.

  But the noticeboards tell you more than the class sizes do. One advertises
  Berlin and a talk by somebody who runs a bank. The other advertises
  breakfast. That is not a difference in ambition but in what the school must
  do before teaching can start.

  What the first room hands out is a head start that will never appear on an
  exam paper: the assumption that adults will listen to you, and that somebody
  knows how the world works. That is where the attainment gap begins. The
  second room teaches something too — those children are learning to manage
  without, and I would rather we said so than pretended it is simply a tragedy.

  Some of this money could fix tomorrow. The heating, the textbooks, a second
  adult. Some of it money cannot touch, and it is high time we admitted that
  instead of promising to level the playing field by Thursday.

  If I could change one thing, it would be the coats. It is essential that a
  child be warm before anybody asks them to think. And I wish we had stopped
  discussing these two rooms as though they were in different countries. They
  are two miles apart, and the life chances in them are thirty years apart.
checklist:
  - Speaks for a full 2–3 minutes without long silences or restarts
  - Describes both situations concretely before drawing any conclusion from them
  - Sustains an explicit comparison throughout rather than describing A and then B
  - Uses at least one wish or if only with the correct past or past perfect form
  - Includes one it's (high) time + past and one would rather about other people
  - Includes one as if / as though with an unreal past, and one subjunctive (essential that … be / have)
  - Deploys five or more lexemes from this module naturally, not as a list
  - Gives the opposing view its strongest form and ends with a clear position rather than trailing off
