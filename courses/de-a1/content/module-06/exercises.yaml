# Module 06 · 46 core tasks + 16 review. Distribution (PLAN.md §6):
# 8 mc_cloze · 8 open_cloze · 6 word_formation · 2 key_word_transformation ·
# 10 grammar_drill · 4 error_correction · 4 collocation_match · 4 reading_comprehension.
#
# Spiral revision of earlier modules (marked "SPIRAL"): mc_cloze 7 (kein, M4),
# open_cloze 7 (stem change isst, M5), error_correction 4 (verb-second inversion, M5).
#
# One task = one operation. Every answer comes from the M6 card (den / einen /
# accusative pronouns / direct object), from an earlier module, or from the
# entry level. No answer needs the dative (dem, der as dative, mit dem), a modal
# verb, a separable verb, the Perfekt or an imperative — möchte only ever appears
# inside a frame, never as the answer. Explanations English (§5); frames,
# options and answers German.
core:
  # ───────────────────────── Multiple Choice ─────────────────────────
  - type: mc_cloze
    group: grammar
    content:
      pre: "Ich nehme "
      post: " Kaffee, bitte."
      options: [der, den, dem, das]
      answer: 1
    explanation: "der Kaffee is the direct object of nehmen, so der becomes den."
  - type: mc_cloze
    group: grammar
    content:
      pre: "Möchtest du "
      post: " Tee?"
      options: [einen, ein, eine, einer]
      answer: 0
    explanation: "der Tee is masculine and it is the object → ein becomes einen."
  - type: mc_cloze
    group: grammar
    content:
      pre: "Anna isst "
      post: " Suppe."
      options: [den, dem, die, das]
      answer: 2
    explanation: "die Suppe is feminine — die stays die in the accusative."
  - type: mc_cloze
    group: grammar
    content:
      pre: "Die Suppe ist lecker. Ich esse "
      post: " sehr gern."
      options: [er, ihn, es, sie]
      answer: 3
    explanation: "The object is die Suppe → the pronoun is sie."
  - type: mc_cloze
    group: vocab
    grammar_point: The direct object with nehmen, essen, trinken and haben
    content:
      pre: "Wir haben "
      post: " und wir bestellen zwei Suppen."
      options: [Hunger, einen Hunger, den Hunger, ein Hunger]
      answer: 0
    explanation: "Hunger haben never takes an article: Ich habe Hunger. Wir haben Hunger."
  - type: mc_cloze
    group: grammar
    content:
      pre: "Das Wasser ist zu kalt. Ich trinke "
      post: " nicht."
      options: [ihn, sie, es, er]
      answer: 2
    explanation: "das Wasser is neuter → es. es looks the same in the accusative."
  # SPIRAL (M4): kein after sein — the noun is the subject, so kein does not change.
  - type: mc_cloze
    group: grammar
    content:
      pre: "Das ist "
      post: " Kaffee, das ist Tee!"
      options: [nicht, keinen, nichts, kein]
      answer: 3
    explanation: "sein takes no object, so the noun stays in the nominative: kein Kaffee."
  - type: mc_cloze
    group: grammar
    content:
      pre: "Wir möchten bezahlen, aber der Kellner sieht "
      post: " nicht."
      options: [uns, euch, mich, ihn]
      answer: 0
    explanation: "wir becomes uns when it is the object of the sentence."

  # ───────────────────────── Open Cloze ─────────────────────────
  - type: open_cloze
    group: grammar
    content:
      pre: "Der Kaffee hier ist sehr lecker. Ich trinke "
      post: " sehr oft."
      answers: [ihn]
      answer_shown: ihn
    explanation: "The object is der Kaffee → er becomes ihn."
  - type: open_cloze
    group: grammar
    content:
      pre: "Die Suppe schmeckt gut. Ich esse "
      post: " sehr gern."
      answers: [sie]
      answer_shown: sie
    explanation: "die Suppe is feminine, so the pronoun is sie — the same in the accusative."
  - type: open_cloze
    group: grammar
    content:
      pre: "Das Brötchen ist frisch. Ich esse "
      post: " gern."
      answers: [es, das]
      answer_shown: es
    explanation: "das Brötchen is neuter → es (or das). Neuter words never change."
  - type: open_cloze
    group: grammar
    content:
      pre: "Wir möchten bezahlen, aber der Kellner sieht "
      post: " nicht."
      answers: [uns]
      answer_shown: uns
    explanation: "wir becomes uns in the accusative."
  - type: open_cloze
    group: grammar
    content:
      pre: "Ich habe Durst. Ich nehme "
      post: " Saft."
      answers: [einen, den]
      answer_shown: einen
    explanation: "der Saft is the object → einen Saft (or den Saft, if you mean the one on the menu)."
  - type: open_cloze
    group: grammar
    content:
      pre: "Anna, ich sehe "
      post: " im Café!"
      answers: [dich]
      answer_shown: dich
    explanation: "You speak to Anna, so du becomes dich."
  # SPIRAL (M5): stem change e → i in the du form.
  - type: open_cloze
    group: grammar
    content:
      pre: "Was "
      post: " du gern, Kuchen oder Eis?"
      hint: essen
      answers: [isst]
      answer_shown: isst
    explanation: "essen changes e → i in du: du isst."
  - type: open_cloze
    group: vocab
    content:
      pre: "Der Kellner bringt die Rechnung. Ich "
      post: " sie sofort."
      hint: bezahlen
      answers: [bezahle]
      answer_shown: bezahle
    explanation: "bezahlen is regular: ich bezahle. The object sie is die Rechnung."

  # ───────────────────────── Word Formation ─────────────────────────
  - type: word_formation
    group: grammar
    content:
      pre: "Ich nehme "
      post: ", bitte."
      prompt: "der Kaffee (Akkusativ)"
      answers: [den Kaffee]
      answer_shown: den Kaffee
    explanation: "der → den: Ich nehme den Kaffee."
  - type: word_formation
    group: grammar
    content:
      pre: "Ich möchte "
      post: ", bitte."
      prompt: "ein Saft (Akkusativ)"
      answers: [einen Saft]
      answer_shown: einen Saft
    explanation: "ein → einen: Ich möchte einen Saft."
  - type: word_formation
    group: grammar
    content:
      pre: "Wir bestellen "
      post: " und zwei Kaffee."
      prompt: "der Kuchen (Akkusativ)"
      answers: [den Kuchen]
      answer_shown: den Kuchen
    explanation: "der Kuchen is the object of bestellen → den Kuchen."
  - type: word_formation
    group: grammar
    content:
      pre: "Tom isst "
      post: "."
      prompt: "ein Brötchen (Akkusativ)"
      answers: [ein Brötchen]
      answer_shown: ein Brötchen
    explanation: "das Brötchen is neuter, so ein stays ein. Only masculine changes."
  - type: word_formation
    group: grammar
    content:
      pre: "Anna nimmt "
      post: " und einen Salat."
      prompt: "die Suppe (Akkusativ)"
      answers: [die Suppe]
      answer_shown: die Suppe
    explanation: "die Suppe is feminine — die stays die in the accusative."
  - type: word_formation
    group: vocab
    content:
      pre: "Was "
      post: " du, Kaffee oder Tee?"
      prompt: "nehmen (du)"
      answers: [nimmst]
      answer_shown: nimmst
    explanation: "nehmen changes e → i in du: du nimmst (see the vocab card)."

  # ───────────────── Key Word Transformation ─────────────────
  - type: key_word_transformation
    group: grammar
    content:
      s1: Ich möchte einen Kaffee.
      key: nehmen (ich-form)
      pre: "Ich "
      post: " einen Kaffee."
      answers: [nehme]
      hint: 1 Wort
      answer_shown: nehme
    explanation: "Same order in a café, other verb: Ich nehme einen Kaffee."
  - type: key_word_transformation
    group: grammar
    content:
      s1: Anna trinkt den Kaffee.
      key: replace the object with a pronoun
      pre: "Anna trinkt "
      post: "."
      answers: [ihn]
      hint: 1 Wort
      answer_shown: ihn
    explanation: "den Kaffee becomes one word: ihn."

  # ───────────────────────── Grammar Drill ─────────────────────────
  - type: grammar_drill
    group: grammar
    grammar_point: The accusative of the definite article (der → den; das and die do not change)
    content:
      pre: "Ich trinke "
      post: " Tee."
      prompt: DER
      options: [der, den, dem, des]
      answer: 1
    explanation: "der Tee is the object of trinken → den Tee."
  - type: grammar_drill
    group: grammar
    grammar_point: The accusative of the definite article (der → den; das and die do not change)
    content:
      pre: "Wir nehmen "
      post: " Suppe."
      prompt: DIE
      options: [den, dem, die, der]
      answer: 2
    explanation: "die Suppe is feminine — no change in the accusative."
  - type: grammar_drill
    group: grammar
    grammar_point: The accusative of the definite article (der → den; das and die do not change)
    content:
      pre: "Tom isst "
      post: " Brot."
      prompt: DAS
      options: [das, den, dem, die]
      answer: 0
    explanation: "das Brot is neuter — das stays das."
  - type: grammar_drill
    group: grammar
    grammar_point: The accusative of the indefinite article (ein → einen)
    content:
      pre: "Ich möchte "
      post: " Saft."
      prompt: EIN
      options: [ein, eine, einem, einen]
      answer: 3
    explanation: "der Saft is masculine and it is the object → einen Saft."
  - type: grammar_drill
    group: grammar
    grammar_point: The accusative of the indefinite article (ein → einen)
    content:
      pre: "Anna bestellt "
      post: " Cola."
      prompt: EIN
      options: [einen, eine, ein, einer]
      answer: 1
    explanation: "die Cola is feminine → eine Cola, in the nominative and in the accusative."
  - type: grammar_drill
    group: grammar
    grammar_point: The accusative of the definite article (der → den; das and die do not change)
    content:
      pre: "Der Kellner bringt "
      post: " Rechnung."
      prompt: DIE
      options: [den, dem, der, die]
      answer: 3
    explanation: "die Rechnung is feminine — die also in the accusative."
  - type: grammar_drill
    group: grammar
    grammar_point: Personal pronouns in the accusative (mich, dich, ihn, sie, es, uns, euch)
    content:
      pre: "Der Kuchen ist lecker. Ich nehme "
      post: "."
      prompt: ER
      options: [er, ihm, ihn, es]
      answer: 2
    explanation: "er becomes ihn when it is the object."
  - type: grammar_drill
    group: grammar
    grammar_point: Personal pronouns in the accusative (mich, dich, ihn, sie, es, uns, euch)
    content:
      pre: "Wir haben Durst. Der Kellner sieht "
      post: " nicht."
      prompt: WIR
      options: [uns, euch, sie, mich]
      answer: 0
    explanation: "wir → uns."
  - type: grammar_drill
    group: grammar
    grammar_point: Personal pronouns in the accusative (mich, dich, ihn, sie, es, uns, euch)
    content:
      pre: "Das Eis ist lecker. Ich esse "
      post: " sehr gern."
      prompt: ES
      options: [er, sie, ihm, es]
      answer: 3
    explanation: "es is the same in the nominative and in the accusative."
  - type: grammar_drill
    group: grammar
    grammar_point: Personal pronouns in the accusative (mich, dich, ihn, sie, es, uns, euch)
    content:
      pre: "Anna, ich sehe "
      post: " im Café!"
      prompt: DU
      options: [dir, dich, du, dein]
      answer: 1
    explanation: "du becomes dich when it is the object."

  # ───────────────────────── Error Correction ─────────────────────────
  - type: error_correction
    group: grammar
    content: {words: [Ich, nehme, ein, "Kaffee."], wrong: 2, correction: "ein → einen"}
    explanation: "der Kaffee is the object here, so the article is einen."
  - type: error_correction
    group: grammar
    content: {words: [Den, Kaffee, ist, sehr, "lecker."], wrong: 0, correction: "Den → Der"}
    explanation: "Here the coffee is the subject, not the object — the subject keeps der."
  - type: error_correction
    group: grammar
    content: {words: [Ich, trinke, den, "Wasser."], wrong: 2, correction: "den → das"}
    explanation: "Only der becomes den. das Wasser is neuter and does not change."
  # SPIRAL (M5): the verb stays in position two after a front adverbial.
  - type: error_correction
    group: grammar
    content: {words: [Heute, ich, trinke, einen, "Tee."], wrong: 1, correction: "ich trinke → trinke ich"}
    explanation: "Heute is position 1, so the verb comes second: Heute trinke ich einen Tee."

  # ───────────────────────── Collocation Match ─────────────────────────
  - type: collocation_match
    group: grammar
    content:
      left: [der Kaffee, das Brot, die Suppe, der Saft]
      right: [den Saft, das Brot, den Kaffee, die Suppe]
      pairs: { 0: 2, 1: 1, 2: 3, 3: 0 }
    explanation: "The accusative: den Kaffee · das Brot · die Suppe · den Saft. Only der changes."
  - type: collocation_match
    group: grammar
    content:
      left: [ein Kaffee, eine Suppe, ein Eis, ein Salat]
      right: [ein Eis, einen Kaffee, einen Salat, eine Suppe]
      pairs: { 0: 1, 1: 3, 2: 0, 3: 2 }
    explanation: "einen Kaffee · eine Suppe · ein Eis · einen Salat — ein becomes einen only for der-words."
  - type: collocation_match
    group: grammar
    content:
      left: [ich, du, er, wir]
      right: [uns, mich, ihn, dich]
      pairs: { 0: 1, 1: 3, 2: 2, 3: 0 }
    explanation: "The accusative pronouns: ich → mich, du → dich, er → ihn, wir → uns."
  - type: collocation_match
    group: vocab
    content:
      left: [die Rechnung, einen Kaffee, Hunger, die Speisekarte]
      right: [lesen, bezahlen, haben, trinken]
      pairs: { 0: 1, 1: 3, 2: 2, 3: 0 }
    explanation: "die Rechnung bezahlen · einen Kaffee trinken · Hunger haben · die Speisekarte lesen."

  # ───────────────────────── Reading Comprehension ─────────────────────────
  - type: reading_comprehension
    group: reading
    content:
      passage: "Anna: Ich nehme einen Kaffee und ein Brötchen. Tom: Ich möchte eine Suppe und einen Saft, bitte."
      q: Was nimmt Anna?
      options:
        - Eine Suppe und einen Saft
        - Nur ein Wasser
        - Einen Kaffee und ein Brötchen
        - Einen Salat
      answer: 2
    explanation: "Anna says: Ich nehme einen Kaffee und ein Brötchen. The soup is Tom's."
  - type: reading_comprehension
    group: reading
    content:
      passage: "Kellner: Der Kuchen ist heute sehr lecker. Anna: Dann bestelle ich auch den Kuchen!"
      q: Wer bestellt den Kuchen?
      options:
        - Anna
        - Tom
        - Der Kellner
        - Niemand
      answer: 0
    explanation: "Anna says: Dann bestelle ich auch den Kuchen."
  - type: reading_comprehension
    group: reading
    content:
      passage: "Kellner: Hier ist die Rechnung. Anna: Ich bezahle sie. Das Café ist toll!"
      q: Wer bezahlt die Rechnung?
      options:
        - Der Kellner
        - Tom
        - Niemand
        - Anna
      answer: 3
    explanation: "Anna says: Ich bezahle sie — sie is die Rechnung."
  - type: reading_comprehension
    group: reading
    content:
      passage: "Tom: Die Suppe schmeckt gut. Ich esse sie gern."
      q: Wie schmeckt die Suppe?
      options:
        - Nicht gut
        - Gut
        - Zu heiß
        - Zu kalt
      answer: 1
    explanation: "Tom says: Die Suppe schmeckt gut."

