    content: { pre: "Er ", post: " gern Fußball.", options: [sehe, siehst, sieht, sehen], answer: 2 }
    explanation: "er + sehen = sieht (e → ie)."
  - type: mc_cloze
    group: grammar
    content: { pre: "Am Freitag ", post: " ich Musik.", options: [höre, hörst, hört, hören], answer: 0 }
    explanation: "The verb is second and the subject is ich → höre."
  - type: mc_cloze
    group: grammar
    content: { pre: "Ich singe ", post: ".", options: [gern nicht, nicht gern, kein gern, nicht kein], answer: 1 }
    explanation: "nicht gern, never gern nicht."
  - type: open_cloze
    group: grammar
    content: { pre: "Ich singe ", post: " ich tanze auch gern.", answers: [und], answer_shown: und }
    explanation: "auch gern adds a second activity → und."
  - type: open_cloze
    group: grammar
    content: { pre: "Du ", post: " sehr schnell.", hint: fahren, answers: [fährst], answer_shown: fährst }
    explanation: "du + fahren = fährst."
  - type: open_cloze
    group: grammar
    content: { pre: "Ich mag Kochen nicht. Ich koche nicht ", post: ".", answers: [gern, gerne], answer_shown: gern }
    explanation: "nicht gern = you do not like doing it."
  # SPIRAL M1 — W-Frage
  - type: open_cloze
    group: reading
    content: { pre: "", post: " ist dein Hobby? — Musik.", answers: [Was], answer_shown: Was }
    explanation: "The answer names a thing → Was ist dein Hobby? (module 1)."
  - type: grammar_drill
    group: grammar
    content: { pre: "Du ", post: " sehr laut.", prompt: sprechen, options: [spreche, sprichst, sprecht, sprechen], answer: 1 }
    explanation: "du + sprechen = sprichst."
  - type: grammar_drill
    group: grammar
    content: { pre: "Am Sonntag ", post: " lange.", prompt: Wortstellung, options: [ich schlafe, schlafe ich, schlafen ich, ich schlafen], answer: 1 }
    explanation: "Am Sonntag is position 1, so the verb comes second: Am Sonntag schlafe ich lange."
  - type: grammar_drill
    group: vocab
    content: { pre: "Ich mache ", post: " Sport. Sport ist nicht mein Hobby.", prompt: Häufigkeit, options: [immer, oft, nie, manchmal], answer: 2 }
    explanation: "Sport ist nicht mein Hobby → nie (0 %)."
  - type: word_formation
    group: vocab
    content: { pre: "Du ", post: " gern Pizza.", prompt: "essen (du)", answers: [isst], answer_shown: isst }
    explanation: "essen → du isst (e → i)."
  - type: word_formation
    group: vocab
    content: { pre: "Meine Schwester ", post: " gern Bücher.", prompt: "lesen (sie)", answers: [liest], answer_shown: liest }
    explanation: "lesen → sie liest (e → ie)."
  - type: key_word_transformation
    group: grammar
    content:
      s1: Ich schwimme am Montag.
      key: verb second after a front adverbial
      pre: "Am Montag "
      post: "."
      answers: [schwimme ich]
      hint: 2 Wörter
      answer_shown: schwimme ich
    explanation: "Am Montag takes position 1, the verb stays second: Am Montag schwimme ich."
  - type: error_correction
    group: grammar
    content: { words: [Morgen, ich, spiele, "Tennis."], wrong: 1, correction: "ich spiele → spiele ich" }
    explanation: "After a front time word the verb comes second: Morgen spiele ich Tennis."
  - type: collocation_match
    group: grammar
    content:
      left: [ich, du, er, wir]
      right: [sprechen, spricht, spreche, sprichst]
      pairs: { 0: 2, 1: 3, 2: 1, 3: 0 }
    explanation: "ich spreche · du sprichst · er spricht · wir sprechen."
