  - type: open_cloze
    group: grammar
    content: { pre: "", post: " ich Sie morgen anrufen?", hint: dürfen, answers: [Darf], answer_shown: Darf }
    explanation: "Asking for permission: Darf ich Sie anrufen?"
  - type: grammar_drill
    group: grammar
    content: { pre: "Ihr ", post: " nicht warten.", prompt: müssen, options: [muss, musst, müsst, müssen], answer: 2 }
    explanation: "ihr müsst — and nicht müssen means that it is not necessary."
  - type: grammar_drill
    group: grammar
    content: { pre: "Anna ", post: " heute nicht arbeiten.", prompt: dürfen, options: [darf, darfst, dürft, dürfen], answer: 0 }
    explanation: "er/sie/es takes darf, the same form as ich."
  - type: grammar_drill
    group: grammar
    content: { pre: "Der Termin ist ", post: " dritten Juni.", prompt: Datum, options: [um, im, an, am], answer: 3 }
    explanation: "am dritten Juni — a date always takes am."
  # SPIRAL · M9 — separable verbs
  - type: grammar_drill
    group: grammar
    content: { pre: "Wann ", post: " du an?", prompt: anrufen, options: [rufst, ruft, rufen, rufe], answer: 0 }
    explanation: "anrufen splits: Wann rufst du an?"
  - type: error_correction
    group: grammar
    content: { words: [Ich, darf, kommen, "später."], wrong: 2, correction: "kommen später → später kommen" }
    explanation: "The second verb is the last word: Ich darf später kommen."
  - type: error_correction
    group: grammar
    content: { words: [Mein, Geburtstag, ist, am, zwanzig, "Juli."], wrong: 4, correction: "zwanzig → zwanzigsten" }
    explanation: "After am the number becomes an ordinal in -sten: am zwanzigsten Juli."
  - type: collocation_match
    group: grammar
    content:
      left: [am, um, im, von … bis]
      right: [die Uhrzeit, der Zeitraum, der Monat, der Tag]
      pairs: { 0: 3, 1: 0, 2: 2, 3: 1 }
    explanation: "am for a day, um for a clock time, im for a month, von … bis for a period."
