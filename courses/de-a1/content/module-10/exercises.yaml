    explanation: "wo asks for a place, and the verb follows it directly."
  - type: grammar_drill
    group: grammar
    content: { pre: "Auf dem Balkon ", post: " ich Kaffee.", prompt: trinken, options: [trinke, trinkst, trinkt, trinken], answer: 0 }
    explanation: "The place phrase in front keeps the verb second, and ich takes -e."
  - type: grammar_drill
