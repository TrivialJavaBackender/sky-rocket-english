    content: { pre: "Es gibt ", post: " Garten.", prompt: Akkusativ, options: [kein, keine, keinen, keinem], answer: 2 }
    explanation: "der Garten is masculine: es gibt keinen Garten."
  - type: grammar_drill
    group: grammar
    content: { pre: "", post: " ist mein Handy?", prompt: W-Frage, options: [Wer, Was, Wo, Wie], answer: 2 }
    explanation: "You are asking for a place, so the question word is Wo."
  - type: grammar_drill
    group: grammar
    content: { pre: "Der Teppich ist ", post: " Wohnzimmer.", prompt: Ortsangabe, options: [in, im, in der, auf der], answer: 1 }
    explanation: "das Wohnzimmer → im Wohnzimmer."
  - type: error_correction
    group: grammar
