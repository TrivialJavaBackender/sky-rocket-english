  - type: error_correction
    group: grammar
    content: { words: [Im, Wohnzimmer, ich, sehe, "fern."], wrong: 2, correction: "ich sehe → sehe ich" }
    explanation: "With a place phrase in front the verb still comes second: Im Wohnzimmer sehe ich fern."
  - type: collocation_match
    group: grammar
    content:
      left: [die Küche, das Bad, das Regal, der Balkon]
      right: [im Regal, in der Küche, auf dem Balkon, im Bad]
