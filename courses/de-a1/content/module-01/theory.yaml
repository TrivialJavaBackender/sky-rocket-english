# Module 01 · theory. Two spotlights, 7 items — they realise the four grammar
# points of the module card (PLAN.md §4). Scaffolding rule (§5): intro and note
# in English, every example and table in German. Grammar terms are named in
# English directly (no German Grammatik-Wörterbuch — PLAN.md §5.1).
spotlights:
  - title: Sounds and spelling — reading German aloud
    intro: German is written much as it sounds. A few letters and letter pairs are new, and every noun starts with a capital.
    items:
      - form: The special letters ä ö ü ß
        note: ä ö ü are separate vowels, not decorated a/o/u. ß sounds like a sharp s (ss).
        table:
          headers: ["Letter", "Sounds like", "Word"]
          rows:
            - ["ä", "e in 'bed'", "Länder"]
            - ["ö", "u in 'fur'", "schön"]
            - ["ü", "ee with round lips", "Tür"]
            - ["ß", "sharp s (ss)", "heißen"]
      - form: "Letter pairs: sch, ch, ei, ie, eu/äu"
        note: "ei sounds like 'eye', ie sounds like 'ee' — opposites, so watch the order."
        table:
          headers: ["Pair", "Sounds like", "Word"]
          rows:
            - ["sch", "sh", "Sprache"]
            - ["ei", "eye", "heißen"]
            - ["ie", "ee", "Sie, wie"]
            - ["eu / äu", "oy", "Deutschland"]
            - ["ch", "soft h / kh", "ich, Buch"]
      - form: "sp-, st- and final -er"
        example: "Sprache · Straße · sprechen · Vater · Wasser"
        note: At the start of a word sp-/st- sound like 'shp-/sht-'. Final -er sounds like a soft 'a'.
      - form: Every noun starts with a capital letter
        example: "der Beruf · die Adresse · das Land · die Telefonnummer"
        note: Nouns always take a capital — Land, not land. This is how you spot a noun.

  - title: sein, pronouns and asking questions
    intro: The most important verb is sein (to be). With the question words wie, wer, woher and wo you can ask about any person.
    items:
      - form: Personal pronouns (nominative)
        note: du = one friend, ihr = several friends, Sie = polite (always a capital S).
        table:
          headers: ["Singular", "", "Plural", ""]
          rows:
            - ["ich", "I", "wir", "we"]
            - ["du", "you (a friend)", "ihr", "you (a group)"]
            - ["er / sie / es", "he / she / it", "sie", "they"]
            - ["Sie", "you (polite)", "", ""]
      - form: The verb sein (to be)
        example: "Ich bin Anna. Du bist Student. Wir sind aus Spanien."
        note: sein is irregular — learn these six forms by heart.
        table:
          headers: ["", "sein"]
          rows:
            - ["ich", "bin"]
            - ["du", "bist"]
            - ["er / sie / es", "ist"]
            - ["wir", "sind"]
            - ["ihr", "seid"]
            - ["sie / Sie", "sind"]
      - form: "W-questions: question word first, verb second"
        note: "wer = who, wie = how/what, woher = where from, wo = where. The verb comes right after."
        table:
          headers: ["Question", "Answer"]
          rows:
            - ["Wie heißt du?", "Ich heiße Anna."]
            - ["Wer ist das?", "Das ist Herr Meyer."]
            - ["Woher kommst du?", "Ich komme aus Spanien."]
            - ["Wo wohnst du?", "Ich wohne in Berlin."]

watchouts:
  - title: Country names take a capital
    bad: Ich komme aus deutschland.
    good: Ich komme aus Deutschland.
    note: Country names and all nouns are written with a capital letter.
  - title: du bist, not du bin
    bad: Du bin Student.
    good: Du bist Student.
    note: "Each person has its own form: ich bin, du bist, er ist."
  - title: The verb comes second in a question
    bad: Woher du kommst?
    good: Woher kommst du?
    note: In a W-question the verb follows the question word — Woher kommst du?
  - title: German needs the verb sein
    bad: Ich Anna.
    good: Ich bin Anna.
    note: "Don't drop the verb: say Ich bin Anna, not Ich Anna."

cloze_cards:
  - text: "Hallo! Ich {{c1::bin}} Anna und komme aus Spanien."
    hint: sein
    rule: "ich + sein = bin."
  - text: "{{c1::Woher}} kommst du?"
    hint: woher
    rule: "woher asks which country a person is from."
  - text: "{{c1::Wie}} heißt du?"
    hint: wie
    rule: "wie + heißen asks for someone's name."
  - text: "Wir {{c1::sind}} aus Österreich."
    hint: sein
    rule: "wir + sein = sind."
  - text: "Ich {{c1::komme}} aus Spanien."
    hint: kommen
    rule: "ich komme aus … is the set phrase for saying your country."
  - text: "Du {{c1::bist}} Lehrer, und ich bin Studentin."
    hint: sein
    rule: "du + sein = bist."
