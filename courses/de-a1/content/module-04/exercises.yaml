    explanation: "A noun with mein or der takes nicht: Das ist nicht mein Buch."
  - type: word_formation
    group: vocab
    content:
      pre: "Das ist "
      post: " Stuhl."
      prompt: "ein (negativ)"
      answers: [kein]
