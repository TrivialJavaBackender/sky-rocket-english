    explanation: "die Frage → keine Frage."
  - type: mc_cloze
    group: grammar
    content: { pre: "Er ist ", post: " sicher.", options: [nicht, kein, keine, nichts], answer: 0 }
    explanation: "sicher is an adjective → nicht sicher."
