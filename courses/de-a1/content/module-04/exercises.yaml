    explanation: "der Stuhl: ein Stuhl → kein Stuhl."
  - type: word_formation
    group: vocab
    content:
      pre: "Das ist "
      post: " Uhr."
      prompt: "eine (negativ)"
      answers: [keine]
      answer_shown: keine
    explanation: "die Uhr: eine Uhr → keine Uhr."
