# Module 03 · 46 core tasks + 16 review. Distribution (PLAN.md §6):
# 8 mc_cloze · 8 open_cloze · 6 word_formation · 2 key_word_transformation ·
# 10 grammar_drill · 4 error_correction · 4 collocation_match · 4 reading_comprehension.
#
# Spiral revision of modules 1–2 (marked "SPIRAL"): open_cloze 8 (haben, M2),
# grammar_drill 9 (sein, M1), grammar_drill 10 (Possessivartikel, M2). Each of the
# four error_correction items realises one watchout from theory.yaml.
# Every open_cloze gap is either a closed-class word forced by the frame — the
# naming question "Was ist das? — Das ist ___ X" forces the indefinite article,
# a second mention forces the definite one — or a plural noun with a base-form
# hint. Explanations English (§5); frames, options and answers German.
core:
  # ───────────────────────── Multiple Choice ─────────────────────────
  - type: mc_cloze
    group: grammar
    grammar_point: Gender and the definite article (der / die / das)
    content:
      pre: ""
      post: " Tisch ist groß."
      options: [Die, Das, Der, Den]
      answer: 2
    explanation: "Tisch is a der-word: Der Tisch ist groß."
  - type: mc_cloze
    group: grammar
    grammar_point: Gender and the definite article (der / die / das)
    content:
      pre: ""
      post: " Tür ist gelb."
      options: [Der, Die, Das, Dem]
      answer: 1
    explanation: "Tür is a die-word: Die Tür ist gelb."
  - type: mc_cloze
    group: grammar
    grammar_point: Gender and the definite article (der / die / das)
    content:
      pre: ""
      post: " Fenster ist klein."
      options: [Der, Die, Den, Das]
      answer: 3
    explanation: "Fenster is a das-word: Das Fenster ist klein."
  - type: mc_cloze
    group: grammar
    grammar_point: The indefinite article (ein / eine)
    content:
      pre: "Das ist "
      post: " Stuhl."
      options: [ein, eine, einen, einem]
      answer: 0
    explanation: "der Stuhl is masculine, so the indefinite article has no ending: ein Stuhl."
  - type: mc_cloze
    group: grammar
    grammar_point: The indefinite article (ein / eine)
    content:
      pre: "Das ist "
      post: " Uhr."
      options: [ein, einen, eine, einem]
      answer: 2
    explanation: "die Uhr is feminine, so the indefinite article takes -e: eine Uhr."
  - type: mc_cloze
    group: grammar
    grammar_point: Plural forms (-e, -en, -er, -s, umlaut)
    content:
      pre: "Ein Buch, zwei "
      post: "."
      options: [Buchs, Bücher, Buche, Buchen]
      answer: 1
    explanation: "Buch takes -er and an umlaut: die Bücher."
  - type: mc_cloze
    group: grammar
    grammar_point: Plural forms (-e, -en, -er, -s, umlaut)
    content:
      pre: "Ein Stuhl, zwei "
      post: "."
      options: [Stühlen, Stuhls, Stühle, Stuhle]
      answer: 2
    explanation: "Stuhl takes -e and an umlaut: die Stühle."
  - type: mc_cloze
    group: grammar
    grammar_point: Plural forms (-e, -en, -er, -s, umlaut)
    content:
      pre: "Ein Handy, drei "
      post: "."
      options: [Handys, Handyen, Handye, Händys]
      answer: 0
    explanation: "Handy is one of the few German words with an -s plural: die Handys."

  # ───────────────────────── Lückentext (open_cloze) ─────────────────────────
  - type: open_cloze
    group: grammar
    grammar_point: The indefinite article (ein / eine)
    content:
      pre: "Was ist das? — Das ist "
      post: " Tisch."
      answers: [ein]
      answer_shown: ein
    explanation: "The question names a thing, so the answer takes the indefinite article. der Tisch → ein Tisch."
  - type: open_cloze
    group: grammar
    grammar_point: The indefinite article (ein / eine)
    content:
      pre: "Was ist das? — Das ist "
      post: " Tasche."
      answers: [eine]
      answer_shown: eine
    explanation: "die Tasche is feminine → eine Tasche."
  - type: open_cloze
    group: grammar
    grammar_point: The indefinite article (ein / eine)
    content:
      pre: "Was ist das? — Das ist "
      post: " Fenster."
      answers: [ein]
      answer_shown: ein
    explanation: "das Fenster is neuter, and neuter takes the same form as masculine: ein Fenster."
  - type: open_cloze
    group: grammar
    grammar_point: Gender and the definite article (der / die / das)
    content:
      pre: "Hier ist eine Uhr. "
      post: " Uhr ist klein."
      answers: [Die]
      answer_shown: Die
    explanation: "Second mention: the thing is known now, so the definite article. die Uhr → Die Uhr ist klein."
  - type: open_cloze
    group: grammar
    grammar_point: Gender and the definite article (der / die / das)
    content:
      pre: "Hier ist ein Buch. "
      post: " Buch ist rot."
      answers: [Das]
      answer_shown: Das
    explanation: "Second mention → the definite article. das Buch → Das Buch ist rot."
  - type: open_cloze
    group: grammar
    grammar_point: Gender and the definite article (der / die / das)
    content:
      pre: "Hier ist ein Stuhl. "
      post: " Stuhl ist schwarz."
      answers: [Der]
      answer_shown: Der
    explanation: "Second mention → the definite article. der Stuhl → Der Stuhl ist schwarz."
  - type: open_cloze
    group: grammar
    grammar_point: Plural forms (-e, -en, -er, -s, umlaut)
    content:
      pre: "Ein Tisch hier ist klein, aber "
      post: " Tische da sind groß."
      answers: [die]
      answer_shown: die
    explanation: "In the plural the article is always die — der, die and das all become die."
  # SPIRAL M2 — haben
  - type: open_cloze
    group: grammar
    content:
      pre: "Mein Bruder "
      post: " zwei Handys."
      answers: [hat]
      answer_shown: hat
    explanation: "er (mein Bruder) + haben = hat (module 2)."

  # ───────────────────────── Wortbildung (word_formation) ─────────────────────────
  # Operation of this module: singular → plural. Six items, six models.
  - type: word_formation
    group: vocab
    grammar_point: Plural forms (-e, -en, -er, -s, umlaut)
    content:
      pre: "Ein Tisch, zwei "
      post: "."
      prompt: "der Tisch → Plural"
      answers: [Tische]
      answer_shown: Tische
    explanation: "Tisch takes -e: die Tische."
  - type: word_formation
    group: vocab
    grammar_point: Plural forms (-e, -en, -er, -s, umlaut)
    content:
      pre: "Ein Stuhl, drei "
      post: "."
      prompt: "der Stuhl → Plural"
      answers: [Stühle]
      answer_shown: Stühle
    explanation: "Stuhl takes -e plus an umlaut: die Stühle."
  - type: word_formation
    group: vocab
    grammar_point: Plural forms (-e, -en, -er, -s, umlaut)
    content:
      pre: "Eine Tür, zwei "
      post: "."
      prompt: "die Tür → Plural"
      answers: [Türen]
      answer_shown: Türen
    explanation: "Tür takes -en: die Türen."
  - type: word_formation
    group: vocab
    grammar_point: Plural forms (-e, -en, -er, -s, umlaut)
    content:
      pre: "Ein Buch, vier "
      post: "."
      prompt: "das Buch → Plural"
      answers: [Bücher]
      answer_shown: Bücher
    explanation: "Buch takes -er plus an umlaut: die Bücher."
  - type: word_formation
    group: vocab
    grammar_point: Plural forms (-e, -en, -er, -s, umlaut)
    content:
      pre: "Ein Handy, zwei "
      post: "."
      prompt: "das Handy → Plural"
      answers: [Handys]
      answer_shown: Handys
    explanation: "Handy takes -s: die Handys."
  - type: word_formation
    group: vocab
    grammar_point: Plural forms (-e, -en, -er, -s, umlaut)
    content:
      pre: "Ein Fenster, zwei "
      post: "."
      prompt: "das Fenster → Plural"
      answers: [Fenster]
      answer_shown: Fenster
    explanation: "Fenster adds nothing — only the article changes: das Fenster → die Fenster."

  # ───────────────────────── Umformung (key_word_transformation) ─────────────────────────
  - type: key_word_transformation
    group: grammar
    grammar_point: Plural forms (-e, -en, -er, -s, umlaut)
    content:
      s1: Das ist ein Tisch.
      key: plural
      pre: "Das sind zwei "
      post: "."
      answers: [Tische]
      hint: 1 Wort
      answer_shown: Tische
    explanation: "Singular → plural: der Tisch → die Tische. Das sind zwei Tische."
  - type: key_word_transformation
    group: grammar
    grammar_point: Plural forms (-e, -en, -er, -s, umlaut)
    content:
      s1: Hier ist ein Buch.
      key: plural
      pre: "Hier sind drei "
      post: "."
      answers: [Bücher]
      hint: 1 Wort
      answer_shown: Bücher
    explanation: "Singular → plural: das Buch → die Bücher. Hier sind drei Bücher."

  # ───────────────────────── Grammatik-Drill ─────────────────────────
  - type: grammar_drill
    group: grammar
    grammar_point: Gender and the definite article (der / die / das)
    content:
      pre: ""
      post: " Stuhl ist rot."
      prompt: Artikel
      options: [Das, Der, Die, Dem]
      answer: 1
    explanation: "der Stuhl → Der Stuhl ist rot."
  - type: grammar_drill
    group: grammar
    grammar_point: Gender and the definite article (der / die / das)
    content:
      pre: ""
      post: " Tasche ist groß."
      prompt: Artikel
      options: [Der, Das, Die, Den]
      answer: 2
    explanation: "die Tasche → Die Tasche ist groß."
  - type: grammar_drill
    group: grammar
    grammar_point: Gender and the definite article (der / die / das)
    content:
      pre: ""
      post: " Handy ist neu."
      prompt: Artikel
      options: [Das, Der, Die, Dem]
      answer: 0
    explanation: "das Handy → Das Handy ist neu."
  - type: grammar_drill
    group: grammar
    grammar_point: Gender and the definite article (der / die / das)
    content:
      pre: ""
      post: " Brille ist blau."
      prompt: Artikel
      options: [Der, Das, Den, Die]
      answer: 3
    explanation: "die Brille → Die Brille ist blau."
  - type: grammar_drill
    group: grammar
    grammar_point: The indefinite article (ein / eine)
    content:
      pre: "Das ist "
      post: " Stift."
      prompt: ein / eine
      options: [eine, ein, einen, einem]
      answer: 1
    explanation: "der Stift is masculine → ein Stift."
  - type: grammar_drill
    group: grammar
    grammar_point: The indefinite article (ein / eine)
    content:
      pre: "Das ist "
      post: " Brille."
      prompt: ein / eine
      options: [ein, einen, einem, eine]
      answer: 3
    explanation: "die Brille is feminine → eine Brille."
  - type: grammar_drill
    group: grammar
    grammar_point: Plural forms (-e, -en, -er, -s, umlaut)
    content:
      pre: "Ein Fenster, zwei "
      post: "."
      prompt: Plural
      options: [Fenstern, Fensters, Fenster, Fenstere]
      answer: 2
    explanation: "Fenster has no plural ending: die Fenster."
  - type: grammar_drill
    group: grammar
    grammar_point: Plural forms (-e, -en, -er, -s, umlaut)
    content:
      pre: "Eine Tasche, zwei "
      post: "."
      prompt: Plural
      options: [Taschen, Taschs, Taschens, Tasche]
      answer: 0
    explanation: "Tasche takes -n: die Taschen."
  # SPIRAL M1 — sein
  - type: grammar_drill
    group: grammar
    content:
      pre: "Das Buch und der Stift "
      post: " neu."
      prompt: sein
      options: [ist, bin, sind, seid]
      answer: 2
    explanation: "Two things = sie (plural) → sind (module 1)."
  # SPIRAL M2 — Possessivartikel
  - type: grammar_drill
    group: grammar
    content:
      pre: ""
      post: " Tasche ist schwarz."
      prompt: Possessiv
      options: [Mein, Meine, Meinen, Meiner]
      answer: 1
    explanation: "die Tasche is a die-word, so the possessive takes -e: Meine Tasche (module 2)."

  # ───────────────────────── Fehlersuche (error_correction) ─────────────────────────
  - type: error_correction
    group: grammar
    content: { words: [Der, tisch, ist, groß, und, "schwarz."], wrong: 1, correction: "tisch → Tisch" }
    explanation: "Every German noun takes a capital letter: der Tisch."
  - type: error_correction
    group: grammar
    content: { words: [Der, Buch, ist, "rot."], wrong: 0, correction: "Der → Das" }
    explanation: "Buch is a das-word. The meaning does not tell you the gender — learn it with the noun."
  - type: error_correction
    group: grammar
    content: { words: [Das, ist, "Stuhl."], wrong: 2, correction: "Stuhl → ein Stuhl" }
    explanation: "A singular noun needs an article: Das ist ein Stuhl."
  - type: error_correction
    group: grammar
    content: { words: [Hier, sind, zwei, "Buchs."], wrong: 3, correction: "Buchs → Bücher" }
    explanation: "-s is rare in German. Buch takes -er plus an umlaut: die Bücher."

  # ───────────────────────── Zuordnung (collocation_match) ─────────────────────────
  - type: collocation_match
    group: vocab
    grammar_point: Plural forms (-e, -en, -er, -s, umlaut)
    content:
      left: [der Tisch, das Buch, die Tür, das Handy]
      right: [die Handys, die Tische, die Türen, die Bücher]
      pairs: { 0: 1, 1: 3, 2: 2, 3: 0 }
    explanation: "Four plural models: -e (Tische), -er + umlaut (Bücher), -en (Türen), -s (Handys)."
  - type: collocation_match
    group: vocab
    grammar_point: Plural forms (-e, -en, -er, -s, umlaut)
    content:
      left: [der Stuhl, das Fenster, die Tasche, der Schlüssel]
      right: [die Taschen, die Stühle, die Schlüssel, die Fenster]
      pairs: { 0: 1, 1: 3, 2: 0, 3: 2 }
    explanation: "Stuhl → Stühle (-e + umlaut). Fenster and Schlüssel add nothing."
  - type: collocation_match
    group: vocab
    grammar_point: Gender and the definite article (der / die / das)
    content:
      left: [Uhr, Stift, Zimmer, Brille]
      right: [die Brille, das Zimmer, der Stift, die Uhr]
      pairs: { 0: 3, 1: 2, 2: 1, 3: 0 }
    explanation: "Match every noun with its article — that is how a German noun is stored."
  - type: collocation_match
    group: vocab
    content:
      left: [groß, klein, schwarz, weiß]
      right: [weiß, klein, groß, schwarz]
      pairs: { 0: 1, 1: 2, 2: 0, 3: 3 }
    explanation: "Opposites: groß ↔ klein, schwarz ↔ weiß."

  # ───────────────────────── Leseverstehen (reading_comprehension) ─────────────────────────
  - type: reading_comprehension
    group: reading
    content:
      passage: "Hier ist der Tisch. Der Tisch ist groß und schwarz. Da sind zwei Stühle. Die Stühle sind rot."
      q: Welche Farbe haben die Stühle?
      options:
        - Schwarz
        - Gelb
        - Rot
        - Blau
      answer: 2
    explanation: "The text says: Die Stühle sind rot."
  - type: reading_comprehension
    group: reading
    content:
      passage: "Das Fenster ist groß und die Tür ist gelb. Hier sind auch zwei Bilder. Die Bilder sind sehr schön."
      q: Welche Farbe hat die Tür?
      options:
        - Gelb
        - Grün
        - Weiß
        - Rot
      answer: 0
    explanation: "The text says: die Tür ist gelb."
  - type: reading_comprehension
    group: reading
    content:
      passage: "Hier sind drei Bücher, ein Stift und meine Brille. Die Bücher sind alt. Mein Heft ist weiß und mein Computer ist neu."
      q: Wie viele Bücher sind hier?
      options:
        - Zwei
        - Vier
        - Fünf
        - Drei
      answer: 3
    explanation: "The text says: Hier sind drei Bücher."
  - type: reading_comprehension
    group: reading
    content:
      passage: "Hallo! Ich bin Nina. Das ist mein Zimmer. Es ist klein, aber sehr schön."
      q: Wie ist Ninas Zimmer?
      options:
        - Groß und alt
        - Klein und schön
        - Groß und schön
        - Klein und alt
      answer: 1
    explanation: "The text says: Es ist klein, aber sehr schön."

review_pool:
  - type: mc_cloze
    group: grammar
    content: { pre: "", post: " Stift ist blau.", options: [Die, Der, Das, Den], answer: 1 }
    explanation: "der Stift → Der Stift ist blau."
  - type: mc_cloze
    group: grammar
    content: { pre: "", post: " Uhr ist klein.", options: [Der, Das, Die, Dem], answer: 2 }
    explanation: "die Uhr → Die Uhr ist klein."
  - type: mc_cloze
    group: grammar
    content: { pre: "", post: " Heft ist weiß.", options: [Das, Der, Die, Dem], answer: 0 }
    explanation: "das Heft → Das Heft ist weiß."
  - type: mc_cloze
    group: grammar
    content: { pre: "Das ist ", post: " Blume.", options: [ein, eine, einen, einem], answer: 1 }
    explanation: "die Blume is feminine → eine Blume."
  - type: mc_cloze
    group: grammar
    content: { pre: "Ein Bild, zwei ", post: ".", options: [Bilds, Bildes, Bilde, Bilder], answer: 3 }
    explanation: "Bild takes -er: die Bilder."
  - type: open_cloze
    group: grammar
    content: { pre: "Was ist das? — Das ist ", post: " Schlüssel.", answers: [ein], answer_shown: ein }
