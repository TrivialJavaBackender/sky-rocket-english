  - type: open_cloze
    group: grammar
    content: { pre: "Was ist das? — Das ist ", post: " Blume.", answers: [eine], answer_shown: eine }
    explanation: "die Blume is feminine → eine Blume."
  - type: open_cloze
    group: grammar
    content: { pre: "Hier ist ein Bild. ", post: " Bild ist sehr schön.", answers: [Das], answer_shown: Das }
    explanation: "Second mention → the definite article. das Bild → Das Bild."
  - type: open_cloze
    group: grammar
    content: { pre: "Ein Zimmer, drei ", post: ".", hint: das Zimmer, answers: [Zimmer], answer_shown: Zimmer }
    explanation: "Zimmer adds nothing in the plural: die Zimmer."
  # SPIRAL M1 — sein
  - type: open_cloze
    group: grammar
    content: { pre: "Meine Brille ", post: " neu.", answers: [ist], answer_shown: ist }
    explanation: "sie (meine Brille) + sein = ist (module 1)."
  - type: word_formation
    group: vocab
    content: { pre: "Eine Brille, zwei ", post: ".", prompt: "die Brille → Plural", answers: [Brillen], answer_shown: Brillen }
    explanation: "Brille takes -n: die Brillen."
  - type: word_formation
    group: vocab
    content: { pre: "Eine Blume, zwei ", post: ".", prompt: "die Blume → Plural", answers: [Blumen], answer_shown: Blumen }
    explanation: "Blume takes -n: die Blumen."
  - type: word_formation
    group: vocab
    content: { pre: "Ein Computer, zwei ", post: ".", prompt: "der Computer → Plural", answers: [Computer], answer_shown: Computer }
    explanation: "Computer adds nothing: die Computer."
  - type: grammar_drill
    group: grammar
    content: { pre: "", post: " Zimmer ist klein.", prompt: Artikel, options: [Der, Die, Das, Dem], answer: 2 }
    explanation: "das Zimmer → Das Zimmer ist klein."
  - type: grammar_drill
    group: grammar
    content: { pre: "Das ist ", post: " Buch.", prompt: ein / eine, options: [ein, eine, einen, einem], answer: 0 }
    explanation: "das Buch is neuter → ein Buch."
  - type: error_correction
    group: grammar
    content: { words: [Das, ist, ein, "buch."], wrong: 3, correction: "buch → Buch" }
    explanation: "Nouns take a capital letter: ein Buch."
