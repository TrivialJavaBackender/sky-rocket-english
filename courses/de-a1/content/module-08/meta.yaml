  - text: Learn 24 words for skills, courses, problems and plans
    achieved_by: input
  - text: Keep the verb bracket — modal second, infinitive at the very end
    achieved_by: input
  - text: Write a short forum post about your skills and your plan
    achieved_by: output
grammar_points:
  - The modal verbs können and wollen in the present tense (all persons)
  - The modal möchten
  - The verb bracket (the modal in second position, the infinitive at the end)
