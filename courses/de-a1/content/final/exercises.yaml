    explanation: "M14 · The present perfect as a ready-made pattern — seven learnt participles (gemacht, gearbeitet, gegessen, getrunken, gefahren, gegangen, gewesen) with haben or sein in second position and the participle at the end — gefahren is a movement, so it takes sein, and wir takes sind: Wir sind nach Italien gefahren."
  - type: open_cloze
    group: grammar
    content:
      pre: "Gestern "
      post: " ich den ganzen Tag gearbeitet."
      answers: [habe]
      answer_shown: habe
    explanation: "M14 · The present perfect as a ready-made pattern — seven learnt participles (gemacht, gearbeitet, gegessen, getrunken, gefahren, gegangen, gewesen) with haben or sein in second position and the participle at the end — gearbeitet takes haben, and the subject is ich, so the form is habe: Gestern habe ich gearbeitet."
  - type: word_formation
