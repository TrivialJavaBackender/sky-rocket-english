      pre: "Entschuldigung, wie komme ich "
      post: " Bahnhof?"
      answers: [zum]
      answer_shown: zum
    explanation: "M11 · Direction as a ready-made phrase (zum Bahnhof, zur Post, mit dem Bus) — learnt whole, not as a case system — der Bahnhof goes with zum: Wie komme ich zum Bahnhof? die Post goes with zur."
