    explanation: "M11 · Direction as a ready-made phrase (zum Bahnhof, zur Post, mit dem Bus) — learnt whole, not as a case system — Each question has its own answer on the street: the way is a bus number, a place is a corner, a distance is minutes, and mit dem Bus is answered by zu Fuß."
