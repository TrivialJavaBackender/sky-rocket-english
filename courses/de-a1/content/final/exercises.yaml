# FINAL · Abschlusstest of Deutsch von null → A1 — a mock in the shape of
# Goethe-Zertifikat A1 / Start Deutsch 1: Lesen, Sprachbausteine, Schreiben.
# 80 items over all 14 modules and all three blocks. Pass mark 60% (48/80) —
# declared in course.yaml (final), not here. Sat once, in one sitting with one
# break: Lesen ~25 minutes, Sprachbausteine ~90 minutes, Schreiben (the form
# plus the message in writing.yaml) 20 minutes.
#
# Nothing here is copied from a module or from checkpoint-a / checkpoint-b — the
# sentences and the words are new, the operations are not. The German material
# and the paradigms behind it come from Basic German (Schenke & Seago), Units 2,
# 4, 5, 6, 8, 9, 12, 18, 20, 21, 26 and 27, and above all from its key to the
# exercises, which is the bank of correct German sentences this test draws on.
#
# WEIGHTING (profile §8): the later and heavier the material, the more items.
#   Block A · M01–M05   5 per module   25
#   Block B · M06–M10   6 per module   30
#   Block C · M11–M13   6 per module   18
#   M14                 7              7
#   total                              80
# Block A gets five each because its material (sein/haben, the present tense,
# gender, negation, verb-second) is the environment of the other 55 items
# anyway. M14 gets a seventh because it is the entry point into de-a2.
#
# Type spread: 16 grammar_drill · 14 mc_cloze · 14 open_cloze ·
#              11 word_formation · 11 error_correction · 7 collocation_match ·
#              7 key_word_transformation = 80
# reading_comprehension is excluded — a checkpoint package carries no
# reading_text, so sync would store reading_text_id = null.
#
# SECTIONS. Items 1–12 are the Lesen part: a short notice, an SMS, a sign, a
# menu, a calendar page or a weather report sits in the `pre` of an mc_cloze,
# and the options are either richtig/falsch or three German statements about
# what was read. Each Lesen text leans on the topic of its owning module
# (Speisekarte → M06, Wohnungsanzeige → M10, Wegbeschreibung → M11,
# Terminkalender → M12, Wetterbericht → M14). Items 13–80 are the
# Sprachbausteine part, ordered by module M01 → M14, types mixed throughout and
# never grouped in blocks of one type.
#
# Per module (mc_cloze is the Lesen item except for M05 and M08):
#   M01 mc_cloze 1 · grammar_drill 1 · open_cloze 1 · word_formation 1 · error_correction 1
#   M02 mc_cloze 1 · word_formation 1 · grammar_drill 1 · open_cloze 1 · key_word_transformation 1
#   M03 mc_cloze 1 · grammar_drill 2 · word_formation 1 · open_cloze 1
#   M04 mc_cloze 1 · open_cloze 1 · grammar_drill 1 · error_correction 1 · key_word_transformation 1
#   M05 mc_cloze 1 · collocation_match 1 · grammar_drill 1 · open_cloze 1 · word_formation 1
#   M06 mc_cloze 1 · grammar_drill 1 · open_cloze 1 · word_formation 1 · error_correction 1 · key_word_transformation 1
#   M07 mc_cloze 1 · open_cloze 1 · grammar_drill 1 · word_formation 1 · collocation_match 1 · error_correction 1
#   M08 mc_cloze 1 · grammar_drill 1 · open_cloze 1 · word_formation 1 · error_correction 1 · key_word_transformation 1
#   M09 mc_cloze 1 · grammar_drill 1 · open_cloze 1 · word_formation 1 · error_correction 1 · collocation_match 1
#   M10 mc_cloze 1 · open_cloze 1 · grammar_drill 1 · collocation_match 1 · error_correction 1 · key_word_transformation 1
#   M11 mc_cloze 1 · grammar_drill 1 · word_formation 1 · open_cloze 1 · collocation_match 1 · error_correction 1
#   M12 mc_cloze 1 · open_cloze 1 · grammar_drill 1 · word_formation 1 · error_correction 1 · key_word_transformation 1
#   M13 mc_cloze 1 · grammar_drill 1 · open_cloze 1 · collocation_match 1 · error_correction 1 · key_word_transformation 1
#   M14 mc_cloze 1 · grammar_drill 2 · open_cloze 1 · word_formation 1 · collocation_match 1 · error_correction 1
#
# ATTRIBUTION: checkpoint exercises cannot carry `grammar_point` (the column is
# module-scoped and syncCheckpoint passes an empty map), so the owning module
# and grammar point travel in the explanation prefix — "M09 · Separable verbs
# (aufstehen, anfangen, aufhören, einkaufen, fernsehen, mitkommen) — the prefix
# goes to the end — …", the heading taken verbatim from that module's
# meta.yaml. The debrief in writing.yaml sorts misses by that prefix.
#
# review_pool is empty: a checkpoint is sat once and does not seed spaced review.
#
# Frames and answers German, explanations English (bridge metalanguage, PLAN §5).
# One task = one operation. Every required answer comes from one of the 14
# modules: no dative built out of endings (only the whole learnt chunks im Bad,
# in der Küche, auf dem Balkon, zum Bahnhof, zur Post, mit dem Bus), no
# Präteritum, no genitive, no adjective endings, no comparative, no subordinate
# clauses, no reflexives, no werden-future, no Konjunktiv, no passive — and no
# participle outside the seven M14 learnt ones (gemacht, gearbeitet, gegessen,
# getrunken, gefahren, gegangen, gewesen). All of that may appear as input in a
# text, a frame, a distractor or the model answer; none of it is ever the answer.
# Every mc_cloze / grammar_drill index 0–3 is used and no value repeats three
# times in a row.

core:
  # ═══════════════════════════════════════════════════════════════════════════
  # LESEN · items 1–12 · ~25 minutes
  # Read the text, then decide about the statement below it.
  # ═══════════════════════════════════════════════════════════════════════════

  # ────────────── Lesen 1 · M01 ──────────────
  - type: mc_cloze
    group: reading
    content:
      pre: |
        NAMENSSCHILD · Deutschkurs A1

        Name: Marta Nowak
        Land: Polen
        Sprachen: Polnisch, Englisch
        Kurs: Deutsch A1, Zimmer 3

        Aussage: Marta kommt aus Polen.
      post: ""
      options: [richtig, falsch]
      answer: 0
    explanation: "M01 · W-questions with wie, wer, woher and wo — Woher kommt Marta? The line Land: Polen answers it: Marta kommt aus Polen. The statement is richtig."

  # ────────────── Lesen 2 · M02 ──────────────
  - type: mc_cloze
    group: reading
    content:
      pre: |
        SMS von Lena

        Hallo! Ich habe zwei Brüder und eine Schwester. Meine Schwester heißt
        Nina. Meine Eltern wohnen in Wien, und mein Vater arbeitet dort.
        Bis bald!

        Aussage: Lena hat zwei Schwestern.
      post: ""
      options: [richtig, falsch]
      answer: 1
    explanation: "M02 · The verb haben in all persons — Lena writes Ich habe zwei Brüder und eine Schwester: two brothers, one sister. Two sisters is falsch."

  # ────────────── Lesen 3 · M03 ──────────────
  - type: mc_cloze
    group: reading
    content:
      pre: |
        SCHILD · Stadtbibliothek

        Hier: Bücher, Zeitungen und Hefte.
        Computer und Kopierer: Zimmer 4.
        Montag bis Freitag von 9 bis 18 Uhr.

        Aussage: In der Bibliothek gibt es Bücher und Zeitungen.
      post: ""
      options: [richtig, falsch]
      answer: 0
    explanation: "M03 · Plural forms (-e, -en, -er, -s, umlaut) — The sign lists die Bücher and die Zeitungen, both plural. The statement says exactly that, so it is richtig."

  # ────────────── Lesen 4 · M04 ──────────────
  - type: mc_cloze
    group: reading
    content:
      pre: |
        NOTIZ AN DER TÜR

        Liebe Kunden,
        heute ist der Supermarkt geschlossen. Wir haben kein Brot und keine
        Milch mehr. Morgen um 8 Uhr sind wir wieder da.

        Was ist richtig?
      post: ""
      options:
        - "Der Supermarkt hat heute Brot."
        - "Der Supermarkt ist morgen geschlossen."
        - "Der Supermarkt hat heute kein Brot."
      answer: 2
    explanation: "M04 · Negation with kein/keine (nouns) and how it differs from nicht — The notice says Wir haben kein Brot: the shop has no bread today. Morgen sind wir wieder da says the opposite of option 2."

  # ────────────── Lesen 5 · M06 ──────────────
  - type: mc_cloze
    group: reading
    content:
      pre: |
        SPEISEKARTE · Café Sonne

        Kaffee              2,50 €
        Tee                 2,00 €
        Apfelsaft           3,00 €
        Käsebrot            4,50 €
        Kuchen              3,50 €

        Was ist richtig?
      post: ""
      options:
        - "Der Kaffee kostet drei Euro."
        - "Der Kuchen kostet drei Euro fünfzig."
        - "Der Tee kostet vier Euro fünfzig."
      answer: 1
    explanation: "M06 · The direct object with nehmen, essen, trinken and haben — Read the price next to each item on the menu: der Kuchen 3,50 €. Der Kaffee kostet 2,50 € and der Tee 2,00 €."

  # ────────────── Lesen 6 · M07 ──────────────
  - type: mc_cloze
    group: reading
    content:
      pre: |
        ANZEIGE · Supermarkt Fischer

        Diese Woche billig:
        1 Kilo Äpfel            1,50 €
        1 Liter Milch           0,99 €
        eine Flasche Wasser     0,60 €

        Aussage: Ein Kilo Äpfel kostet einen Euro fünfzig.
      post: ""
      options: [richtig, falsch]
      answer: 0
    explanation: "M07 · Quantity phrases (ein Kilo, ein Liter, eine Flasche, ein Stück, 100 Gramm) — The advert prices the goods by quantity: 1 Kilo Äpfel 1,50 €. The statement repeats that price, so it is richtig."

  # ────────────── Lesen 7 · M09 ──────────────
  - type: mc_cloze
    group: reading
    content:
      pre: |
        SMS von Jonas

        Hallo! Ich stehe morgen um sechs Uhr auf. Der Kurs fängt um acht Uhr an
        und hört um halb eins auf. Am Abend sehe ich fern.

        Aussage: Jonas steht morgen um acht Uhr auf.
      post: ""
      options: [richtig, falsch]
      answer: 1
    explanation: "M09 · Telling the time (official time and Viertel nach, halb) — Jonas writes Ich stehe um sechs Uhr auf. Acht Uhr is when the course starts, not when he gets up, so the statement is falsch."

  # ────────────── Lesen 8 · M10 ──────────────
  - type: mc_cloze
    group: reading
    content:
      pre: |
        WOHNUNGSANZEIGE

        3 Zimmer, Küche, Bad, Balkon.
        Die Wohnung ist hell und gemütlich.
        Miete: 700 Euro.
        Telefon: 030 / 55 12 40

        Was ist richtig?
      post: ""
      options:
        - "Die Wohnung hat vier Zimmer."
        - "Die Wohnung hat keinen Balkon."
        - "Die Wohnung hat einen Balkon."
      answer: 2
    explanation: "M10 · es gibt with the accusative in the home (revision) — The advert lists Balkon, so es gibt einen Balkon. It offers 3 Zimmer, not four."

  # ────────────── Lesen 9 · M11 ──────────────
  - type: mc_cloze
    group: reading
    content:
      pre: |
        NOTIZ · Der Weg zur Post

        Gehen Sie geradeaus bis zur Ampel. An der Ampel gehen Sie rechts.
        Die Post ist an der Ecke, neben der Apotheke.

        Aussage: Die Post ist neben der Apotheke.
      post: ""
      options: [richtig, falsch]
      answer: 0
    explanation: "M11 · The adverbs links, rechts, geradeaus and an … vorbei — The last line places the post office: an der Ecke, neben der Apotheke. The statement repeats it, so it is richtig."

  # ────────────── Lesen 10 · M12 ──────────────
  - type: mc_cloze
    group: reading
    content:
      pre: |
        TERMINKALENDER · Woche vom 3. Mai

        Montag, 3. Mai        9.00 Uhr    Deutschkurs
        Dienstag, 4. Mai      —
        Mittwoch, 5. Mai      15.30 Uhr   Arzt
        Freitag, 7. Mai       19.00 Uhr   Kino mit Anna

        Aussage: Der Termin beim Arzt ist am Dienstag.
      post: ""
      options: [richtig, falsch]
      answer: 1
    explanation: "M12 · Dates and ordinal numbers (der erste, am dritten Mai) and the months — The doctor stands next to Mittwoch, 5. Mai, and Dienstag has no appointment at all, so the statement is falsch."

  # ────────────── Lesen 11 · M13 ──────────────
  - type: mc_cloze
    group: reading
    content:
      pre: |
        NOTIZ VOM ARZT

        Sie haben eine Erkältung und Fieber.
        Nehmen Sie die Tabletten dreimal am Tag.
        Trinken Sie viel Wasser und schlafen Sie viel.
        Kommen Sie am Freitag wieder.

        Was ist richtig?
      post: ""
      options:
        - "Der Patient soll wenig trinken."
        - "Der Patient soll am Montag wiederkommen."
        - "Der Patient soll die Tabletten dreimal am Tag nehmen."
      answer: 2
    explanation: "M13 · The modal verb sollen for advice (Du sollst …) — The note tells the patient Nehmen Sie die Tabletten dreimal am Tag, so er soll die Tabletten dreimal am Tag nehmen. It also says viel trinken and am Freitag."

  # ────────────── Lesen 12 · M14 ──────────────
  - type: mc_cloze
    group: reading
    content:
      pre: |
        WETTERBERICHT · Sonntag

        Am Morgen regnet es. Am Mittag scheint die Sonne, aber der Wind ist
        kalt. Am Abend ist es kalt: nur 6 Grad.

        Aussage: Am Mittag scheint die Sonne.
      post: ""
      options: [richtig, falsch]
      answer: 0
    explanation: "M14 · The weather with es (es regnet, es schneit, es ist kalt) — The report says Am Mittag scheint die Sonne, so the statement is richtig. Am Morgen regnet es, and the evening is cold."

  # ═══════════════════════════════════════════════════════════════════════════
  # SPRACHBAUSTEINE · items 13–80 · ~90 minutes · ordered by module M01 → M14
  # ═══════════════════════════════════════════════════════════════════════════

  # ══════════════ M01 · Hallo! Ich bin … ══════════════
  - type: grammar_drill
    group: grammar
    content:
      pre: "Wir "
      post: " aus Italien."
      prompt: sein
      options: [bin, bist, seid, sind]
      answer: 3
    explanation: "M01 · The verb sein in all persons — wir takes sind: Wir sind aus Italien. seid belongs to ihr."
  - type: open_cloze
    group: grammar
    content:
      pre: ""
      post: " ist deine Telefonnummer? — 030 55 12 40."
      answers: [Wie]
      answer_shown: Wie
    explanation: "M01 · W-questions with wie, wer, woher and wo — German asks for a name, an address or a number with wie, not with was: Wie ist deine Telefonnummer?"
  - type: word_formation
    group: vocab
    content:
      pre: "Meine "
      post: " ist Spanisch."
      prompt: "sprache (Nomen)"
      answers: [Sprache]
      answer_shown: Sprache
    explanation: "M01 · The alphabet and pronunciation (ä ö ü ß; sch, ch, ei, ie, eu/äu; capital nouns) — Every German noun starts with a capital letter: sprache → Sprache."
  - type: error_correction
    group: grammar
    content: { words: [Ich, bin, zwanzig, "Jahre."], wrong: 3, correction: "Jahre. → Jahre alt." }
    explanation: "M01 · The verb sein in all persons — German says how old you are with sein plus alt: Ich bin zwanzig Jahre alt. Without alt the sentence is not finished."

  # ══════════════ M02 · Meine Familie ══════════════
  - type: word_formation
    group: vocab
    content:
      pre: "Ihr "
      post: " am Samstag Fußball."
      prompt: "spielen (ihr)"
      answers: [spielt]
      answer_shown: spielt
    explanation: "M02 · Regular verbs in the present tense (stem + -e/-st/-t/-en) — Take the stem spiel- and add the ihr ending -t: spielen → ihr spielt."
  - type: grammar_drill
    group: grammar
    content:
      pre: "Mein Bruder "
      post: " in Wien."
      prompt: arbeiten
      options: [arbeite, arbeitet, arbeitest, arbeiten]
      answer: 1
    explanation: "M02 · Regular verbs in the present tense (stem + -e/-st/-t/-en) — mein Bruder is er, so the ending is -t. The stem arbeit- already ends in t, so an e comes first: er arbeitet."
  - type: open_cloze
    group: grammar
    content:
      pre: "Ich habe einen Bruder. "
      post: " Bruder heißt Tom."
      answers: [Mein]
      answer_shown: Mein
    explanation: "M02 · Possessives in the nominative (mein, dein, sein, ihr, unser) — The brother belongs to ich, so the possessive is mein, and der Bruder is masculine: Mein Bruder heißt Tom."
  - type: key_word_transformation
    group: grammar
    content:
      s1: Ich wohne in Hamburg.
      key: wir-form
      pre: "Wir "
      post: " in Hamburg."
      answers: [wohnen]
      hint: 1 Wort
      answer_shown: wohnen
    explanation: "M02 · Regular verbs in the present tense (stem + -e/-st/-t/-en) — Only the ending moves: wir takes -en, the same form as the infinitive. Wir wohnen in Hamburg."

  # ══════════════ M03 · Der, die, das ══════════════
  - type: grammar_drill
    group: grammar
    content:
      pre: "Das ist "
      post: " Lampe."
      prompt: "ein / eine"
      options: [ein, einen, eine, der]
      answer: 2
    explanation: "M03 · The indefinite article (ein / eine) — Lampe is feminine (die Lampe), so the indefinite article is eine: Das ist eine Lampe."
  - type: word_formation
    group: vocab
    content:
      pre: "Österreich hat schöne "
      post: "."
      prompt: "die Stadt (Plural)"
      answers: [Städte]
      answer_shown: Städte
    explanation: "M03 · Plural forms (-e, -en, -er, -s, umlaut) — die Stadt → die Städte: the plural adds -e and the a becomes ä."
  - type: grammar_drill
    group: grammar
    content:
      pre: "Ein Haus, zwei "
      post: "."
      prompt: "das Haus (Plural)"
      options: [Hause, Hausen, Hauses, Häuser]
      answer: 3
    explanation: "M03 · Plural forms (-e, -en, -er, -s, umlaut) — das Haus → die Häuser: this group adds -er and takes an umlaut, like das Buch → die Bücher."
  - type: open_cloze
    group: grammar
    content:
      pre: "Das Buch ist neu — die Bücher sind neu. Der Stift ist blau — "
      post: " Stifte sind blau."
      answers: [die]
      answer_shown: die
    explanation: "M03 · Gender and the definite article (der / die / das) — In the plural the three genders fall together: every plural noun takes die, der Stift as much as das Buch."

  # ══════════════ M04 · Kein Problem! ══════════════
  - type: open_cloze
    group: grammar
    content:
      pre: "Ich möchte einkaufen. Ich habe leider "
      post: " Geld."
      answers: [kein]
      answer_shown: kein
    explanation: "M04 · Negation with kein/keine (nouns) and how it differs from nicht — A noun is negated with kein, and das Geld is neuter, so it stays kein: Ich habe kein Geld."
  - type: grammar_drill
    group: grammar
    content:
      pre: "Hast du keinen Hunger? — "
      post: ", ich habe Hunger!"
      prompt: "Ja / Nein / Doch"
      options: [Doch, Ja, Nein, Nicht]
      answer: 0
    explanation: "M04 · Yes/no questions (verb first) and answering with doch — The question is negative and the answer says the opposite, so German uses doch, never ja: Doch, ich habe Hunger!"
  - type: error_correction
    group: grammar
    content: { words: [Das, ist, nicht, ein, "Problem."], wrong: 2, correction: "nicht ein → kein" }
    explanation: "M04 · Negation with kein/keine (nouns) and how it differs from nicht — German never says nicht ein. ein plus a negation is one word: Das ist kein Problem."
  - type: key_word_transformation
    group: grammar
    content:
      s1: Ihr trinkt Tee.
      key: yes/no question
      pre: ""
      post: " ihr Tee?"
      answers: [Trinkt]
      hint: 1 Wort
      answer_shown: Trinkt
    explanation: "M04 · Yes/no questions (verb first) and answering with doch — A question with no question word starts with the verb and the subject follows it: Trinkt ihr Tee?"

  # ══════════════ M05 · Was machst du gern? ══════════════
  - type: mc_cloze
    group: grammar
    content:
      pre: "Mein Vater "
      post: " oft mit dem Bus zur Arbeit."
      options: [fahre, fährt, fahrst, fahren]
      answer: 1
    explanation: "M05 · Stem-changing verbs (e → i/ie, a → ä) in the du and er/sie/es forms — mein Vater is er, and fahren takes an umlaut in the du and er forms: er fährt."
  - type: collocation_match
    group: vocab
    content:
      left: [Wasser, Klavier, Kuchen, Deutsch]
      right: [lernen, trinken, essen, spielen]
      pairs: { 0: 1, 1: 3, 2: 2, 3: 0 }
    explanation: "M05 · gern and nicht gern — Each noun keeps its own verb: Wasser trinken · Klavier spielen · Kuchen essen · Deutsch lernen. Ich spiele gern Klavier."
  - type: grammar_drill
    group: grammar
    content:
      pre: "Trinkst du Kaffee "
      post: " Tee? — Kaffee, bitte."
      prompt: "und / oder"
      options: [und, aber, denn, oder]
      answer: 3
    explanation: "M05 · The conjunctions und and oder — The answer picks one of the two drinks, so the question offers a choice with oder. und would ask for both together."
  - type: open_cloze
    group: grammar
    content:
      pre: "Heute Abend gehe ich ins Kino. Danach esse "
      post: " im Café."
      answers: [ich]
      answer_shown: ich
    explanation: "M05 · Verb-second word order and inversion after a front adverbial — Danach takes position 1, so the verb stays in position 2 and the subject moves behind it. The ending -e on esse can only belong to ich."
  - type: word_formation
    group: vocab
    content:
      pre: "Du "
      post: " sehr gut Deutsch."
      prompt: "sprechen (du)"
      answers: [sprichst]
      answer_shown: sprichst
    explanation: "M05 · Stem-changing verbs (e → i/ie, a → ä) in the du and er/sie/es forms — sprechen changes e → i in the du form: du sprichst."

  # ══════════════ M06 · Im Café ══════════════
  - type: grammar_drill
    group: grammar
    content:
      pre: "Meine Schwester kauft "
      post: " Kühlschrank."
      prompt: "der Kühlschrank (Akkusativ)"
      options: [der, dem, den, das]
      answer: 2
    explanation: "M06 · The accusative of the definite article (der → den; das and die do not change) — The fridge is the direct object of kauft, and der Kühlschrank is masculine, so der becomes den: Sie kauft den Kühlschrank."
  - type: open_cloze
    group: grammar
    content:
      pre: "Das Brot ist frisch. Ich nehme "
      post: " für das Frühstück."
      answers: [es]
      answer_shown: es
    explanation: "M06 · Personal pronouns in the accusative (mich, dich, ihn, sie, es, uns, euch) — das Brot is neuter, and neuter keeps the same pronoun as a direct object: Ich nehme es."
  - type: word_formation
    group: vocab
    content:
      pre: "Ich esse "
      post: " und ein Brötchen."
      prompt: "ein Salat (Akkusativ)"
      answers: [einen Salat]
      answer_shown: einen Salat
    explanation: "M06 · The accusative of the indefinite article (ein → einen) — der Salat is masculine and it is the direct object of esse, so ein becomes einen: einen Salat."
  - type: error_correction
    group: grammar
    content: { words: [Ich, möchte, ein, "Kaffee."], wrong: 2, correction: "ein → einen" }
    explanation: "M06 · The direct object with nehmen, essen, trinken and haben — After möchten the noun is the direct object, and der Kaffee is masculine: Ich möchte einen Kaffee."
  - type: key_word_transformation
    group: grammar
    content:
      s1: Hier ist der Schlüssel.
      key: accusative after nehmen
      pre: "Ich nehme "
      post: "."
      answers: [den Schlüssel]
      hint: 2 Wörter
      answer_shown: den Schlüssel
    explanation: "M06 · The accusative of the definite article (der → den; das and die do not change) — In the first sentence the key is the subject (der Schlüssel); after nehmen it is the direct object, so it becomes den Schlüssel."

  # ══════════════ M07 · Einkaufen ══════════════
  - type: open_cloze
    group: grammar
    content:
      pre: "Ich kaufe ein Kilo Äpfel und "
      post: " Liter Milch."
      answers: [einen]
      answer_shown: einen
