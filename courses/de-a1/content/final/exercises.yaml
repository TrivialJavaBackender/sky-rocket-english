    explanation: "M14 · The weather with es (es regnet, es schneit, es ist kalt) — The weather verbs run on es and nothing else: im Sommer ist es warm · im Winter schneit es · im Herbst regnet es oft · im Frühling kommen die Blumen."
  - type: error_correction
