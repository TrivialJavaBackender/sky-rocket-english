      answer: 0
    explanation: "M11 · The Sie-imperative (Gehen Sie …, Nehmen Sie …) — The Sie-imperative is the infinitive with Sie behind it: Gehen Sie rechts. The verb comes first, before Sie."
  - type: word_formation
    group: vocab
    content:
